################################################################################
# greenhouse/controls.yaml — Mode-based climate controller (2026-04-10)
#
# 6-mode architecture: SAFETY_COOL, SAFETY_HEAT, SEALED_MIST,
# THERMAL_RELIEF, VENTILATE, IDLE. Each mode defines a complete, consistent
# set of relay outputs. No override layers — the mode table IS the truth.
#
# Vent and fans are always consistent: sealed modes have vent closed + fans off,
# open modes have vent open + fans on. Open-vent moisture is allowed only for
# the explicit VENTILATE assist path. Heater/vent oscillation is structurally
# impossible.
################################################################################

interval:
  # 1 s (was 5 s): the control loop is the ONLY relay actuator path (the mode
  # table is the truth), so manual-override button presses become responsive only
  # as fast as this loop ticks — at 5 s a press lagged the relay up to 5 s. The
  # loop is fully dt_ms-based (accumulates real elapsed millis, self-correcting at
  # any tick rate) and relay min-on/min-off dwell is millis-based, so faster
  # ticking cannot rapid-cycle. Replay is unaffected (the harness calls the
  # decision fns per corpus row, not via this interval).
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t control_loop_started_us = micros();
          /*************** POLICY ENGINE SNAPSHOT (Lane E, #586) *****************/
          // ONE by-value policy snapshot at the top of the control tick
          // (audit §8.9). Until an experiment manifest is armed through the
          // policy_* api services, psnap.experiment_active is false and every
          // gated read below falls through to the legacy global — behavior is
          // bit-identical to pre-Lane-E firmware (feature-off equivalence).
          // Lazy one-time boot init: bind the NVS journal and resolve the
          // persisted policy once the clock is valid, or conservatively boot
          // the ROM baseline after a 5-minute SNTP grace window.
          {
            static bool policy_boot_done = false;
            if (!policy_boot_done) {
              auto boot_now = id(sntp_time).now();
              const bool boot_clock_valid = boot_now.is_valid();
              if (boot_clock_valid || millis() > 300000UL) {
                verdify_policy::policy_engine().bind_storage(&esp_policy_journal());
                const uint32_t boot_day = boot_clock_valid
                    ? uint32_t(boot_now.year) * 1000UL + uint32_t(boot_now.day_of_year) : 0UL;
                const verdify_policy::ResetEvent reset_ev = verdify_policy::policy_engine().boot_init(
                    boot_clock_valid ? uint32_t(boot_now.timestamp) : 0UL, boot_clock_valid, boot_day);
                ESP_LOGI("policy", "boot_init outcome=%d gen=%u manifest=%d water_consumed=%d",
                         (int) reset_ev.outcome, (unsigned) reset_ev.resumed_generation,
                         (int) reset_ev.manifest_rearmed, (int) reset_ev.water_budget_marked_consumed);
                policy_boot_done = true;
              }
            }
          }
          auto policy_now = id(sntp_time).now();
          const bool policy_clock_valid = policy_now.is_valid();
          const uint32_t policy_day = policy_clock_valid
              ? uint32_t(policy_now.year) * 1000UL + uint32_t(policy_now.day_of_year) : 0UL;
          const verdify_policy::PolicySnapshot psnap = verdify_policy::policy_engine().on_tick(
              policy_clock_valid ? uint32_t(policy_now.timestamp) : 0UL, policy_clock_valid, policy_day);
          // Gated reads for EVERY policy-field consumer on the control path
          // (tranche 2 complete, #586): legacy global until an experiment is
          // armed, snapshot value while armed. The consumer manifest
          // (firmware/policy_consumer_manifest.json) is CI-enforced at 100%:
          // any new unmigrated id() read of a wire field fails the gate.
          const auto pol = [&](uint8_t f, float legacy) -> float {
              return psnap.experiment_active ? psnap.values[f] : legacy;
          };
          const auto polb = [&](uint8_t f, bool legacy) -> bool {
              return psnap.experiment_active ? (psnap.values[f] != 0.0f) : legacy;
          };
          // Journal-visible daily water high-water mark (§8.9 conservative
          // reboot rule): never rolls backward; only a journaled same-day
          // mark lifts the consumed flag after a reboot.
          if (policy_clock_valid) {
              verdify_policy::policy_engine().note_water_high_water(policy_day, id(mister_water_today));
          }
          /*************** CONFIG CONSTANTS **************************************/
          // Package 4.3: the relay minimum times, the lead rotation and the stage-3
          // delta of the old controller are gone; the law's relay layer holds the
          // compiled times (verdify_schemas/climate_law.yaml).

          // Enums (Mode) and structs (SensorInputs, Setpoints,
          // ControlState, RelayOutputs) defined in greenhouse_logic.h
          // — included via esphome.includes in greenhouse.yaml

          /**************** 1 — time bookkeeping *********************************/
          static uint32_t last_ms = millis();
          uint32_t now_ms = millis();
          const ElapsedIntervals elapsed = elapsed_intervals(now_ms, last_ms);
          const uint32_t raw_dt_ms = elapsed.raw_ms;
          uint32_t dt_ms = elapsed.control_ms;
          // Clamp only the control interval. A gap of several seconds is a
          // hiccup (RTOS hang, OTA pause, debugger break), and one huge dt_ms
          // must not leap through control dwell gates in a single tick. The
          // wrap-safe raw interval remains available to forensic DLI below.
          last_ms = now_ms;

          /**************** 1b — occupancy fail-safe *****************************/
          // Only the ingestor's API push sets or clears occupancy; no button or
          // burst overrides it (VD-47). This expiry is the fail-safe for a lost push.
          const uint32_t OCCUPANCY_FAILSAFE_MS = 3600000UL;
          if(id(greenhouse_occupied)){
            if(id(occupancy_last_true_ms) == 0){
              id(occupancy_last_true_ms) = now_ms;
            } else if(now_ms - id(occupancy_last_true_ms) > OCCUPANCY_FAILSAFE_MS){
              id(greenhouse_occupied) = false;
              id(occupancy_last_true_ms) = 0;
              id(sw_greenhouse_occupied).publish_state(false);
              ESP_LOGW("occupancy","Occupancy fail-safe expired without fresh API detection; forcing empty");
            }
          }

          /**************** 2 — relay metadata & helpers **************************/
          struct RelayMeta {
            esphome::switch_::Switch *sw;
            uint32_t on_stamp_ms = 0;
            uint32_t runtime_ms = 0;
          };

          static RelayMeta R[] = {
            { id(heat1_rly) }, // H1
            { id(heat2_rly) }, // H2
            { id(fan1_rly)  }, // F1
            { id(fan2_rly)  }, // F2
            { id(fog_rly)   }, // Fog
            { id(vent_rly)  }  // Vent
          };

          // A relay found OFF with its interval still open was switched off by
          // something else (an OTA upload's on_begin close, #1276, then an
          // aborted upload): book the interval here. Its minimum off time is the
          // relay layer's (climate_law::relay_sync() follows the physical relays).
          auto update_runtime = [&](RelayMeta &r){
            if(!r.sw->state && r.on_stamp_ms){
              r.runtime_ms += now_ms - r.on_stamp_ms;
              r.on_stamp_ms = 0;
            }
          };
          // The driver: switches at once. Every minimum time, interlock and the
          // furnace's boot wait are the relay layer's (section 11a); this books runtimes.
          auto set_relay = [&](RelayMeta &r, bool want){
            update_runtime(r);
            if(want && !r.sw->state){
              r.sw->turn_on();
              r.on_stamp_ms = now_ms;
            }else if(!want && r.sw->state){
              r.sw->turn_off();
              update_runtime(r);
            }
          };

          /**************** 3 — mid‑night reset of runtimes (A3 fix) **************/
          static int last_doy = -1;
          if(id(sntp_time).now().is_valid()){
            int doy = id(sntp_time).now().day_of_year;
                if(doy != last_doy){
                  // A3: snapshot runtime for relays ON at midnight boundary
                  for(auto &r : R){
                    if(r.sw->state && r.on_stamp_ms){
                      r.runtime_ms += now_ms - r.on_stamp_ms;
                      r.on_stamp_ms = now_ms;
                    }
                  }
                  // Now reset counters
                  for(auto &r : R) r.runtime_ms = 0;
                  id(runtime_heat1_ms) = 0;
                  id(runtime_heat2_ms) = 0;
                  id(runtime_fan1_ms)  = 0;
                  id(runtime_fan2_ms)  = 0;
                  id(runtime_fog_ms)   = 0;
                  id(runtime_vent_ms)  = 0;
                  // SAF-4/IRR-5: the per-zone mister runtime counters behind the
                  // duty caps and the daily mister volume behind SAF-4 are mirrors
                  // of the irrigation engine's RTC block (#1160), which zeroes them
                  // on a new local day and keeps them across a soft reset; nothing
                  // resets them here.
                  // Last-off stamps use monotonic millis(), not calendar days.
                  // Preserve them across midnight so an aborted pulse cannot
                  // bypass its existing minimum-off fence at a day rollover.
                  // B5: reset DLI accumulator at midnight
                  id(dli_accumulator) = 0.0f;
                  last_doy = doy;
                }
          }

          /**************** 4 — sensor ingest & derived fields ********************/

          // Age pulled outdoor data — invalidate if >1 hour stale
          id(pulled_data_age_s) += dt_ms / 1000;
          if(id(pulled_data_age_s) > 3600){
            id(pulled_outdoor_temp_f) = NAN;
            id(pulled_outdoor_rh_pct) = NAN;
          }
          // Phase 2 (#1643, RULINGS G2): no substituted indoor value, and validity
          // split into temperature and humidity (select_indoor_reading(),
          // lib/running_alone.h). The temperature is the wall average, else the
          // fresh case probe less the compiled offset; humidity only from the same
          // source (else NaN: humidity control holds, temperature control runs).
          // No valid temperature is SENSOR_FAULT and the outdoor rule of decision
          // 7 below, after the boot grace (G3).
          bool avg_ok = !isnan(id(average_temperature).state) && !isnan(id(average_humidity).state);
          const bool case_fresh = probe_sample_fresh(now_ms, id(last_case_ms), running_alone_k::INDOOR_PROBE_STALE_MS);
          const IndoorReading indoor = select_indoor_reading(
              id(average_temperature).state, id(average_humidity).state,
              id(average_vpd_kpa).state, id(dewpoint_avg).state,
              case_fresh, id(case_temperature).state, id(case_humidity).state);
          const float Tin = indoor.temp_f;
          const float RHin = indoor.rh_pct;
          // G3: after a boot, wait for the first valid indoor temperature, at most
          // 60 s: no climate relay is switched and the mode is not a sensor fault.
          static BootGrace boot_grace{};
          const bool boot_wait =
              indoor_gate(boot_grace, indoor.source != IndoorSource::kNone, now_ms) == IndoorGate::kBootWait;
          // No entity for the validity (RULINGS G2a): the host's staleness alert on the
          // indoor humidity columns is the warning. The log names each change.
          {
            static int8_t indoor_logged = -1;
            const int8_t indoor_now = boot_wait ? int8_t(-2)
                : int8_t(int(indoor.source) * 2 + (indoor.humidity_valid ? 1 : 0));
            if (indoor_now != indoor_logged) {
              if (boot_wait) {
                ESP_LOGI("sensor", "Boot: waiting up to 60 s for the first indoor temperature");
              } else if (indoor.source == IndoorSource::kNone) {
                ESP_LOGE("sensor", "No valid indoor temperature: SENSOR_FAULT, outdoor rule");
              } else if (!indoor.humidity_valid) {
                ESP_LOGW("sensor", "Indoor humidity invalid (%s temperature): humidity control held",
                         indoor.source == IndoorSource::kWall ? "wall" : "case");
              } else if (indoor.source == IndoorSource::kCase) {
                ESP_LOGW("sensor", "Wall averages missing: case probe alone (less %.1f°F); humidity control held (AG1)",
                         running_alone_k::CASE_SENSOR_OFFSET_F);
              } else {
                ESP_LOGI("sensor", "Wall averages in use");
              }
              indoor_logged = indoor_now;
            }
          }

          // Track how long ALL probes have been offline
          static uint32_t all_probes_nan_ms = 0;
          if(indoor.source == IndoorSource::kNone && !boot_wait){
            all_probes_nan_ms += dt_ms;
            if(all_probes_nan_ms > 300000 && (all_probes_nan_ms % 60000) < dt_ms){
              ESP_LOGE("health","ALL temperature probes offline for %.0f min!",
                       all_probes_nan_ms / 60000.0f);
            }
          }else{
            all_probes_nan_ms = 0;
          }

          // D-IRP-12 (#1271): what the irrigation engine counts as degraded sensing. A
          // degraded_only slot opens its mister by time, not VPD, so the averages must have
          // been out for 300 s straight, never just the seconds they read NaN after a boot.
          static verdify_irr::IrrDegradedGrace degraded_grace{};
          const bool irr_degraded = verdify_irr::irr_degraded_after_grace(degraded_grace, avg_ok, now_ms);

          // An implausible reading is not clamped to a made-up value: it fails
          // sensors_plausible() and the controller is in SENSOR_FAULT.
          const float VPD = indoor.vpd_kpa;

          // F8 (D-IRP-13): the wall probes for mister zone choice, read once per
          // tick with their last-callback stamps (lib/zone_vpd.h). A Modbus probe
          // that stops answering keeps its last value, so zone choice resolves
          // each zone through zone_vpd_with_fallback(): own probe while fresh and
          // finite, else the fresh peers' mean, else the house VPD. Center has no
          // probe. SensorInputs and the FW-9 emergency merge keep their raw reads.
          const ZoneProbe zp[ZONE_COUNT] = {
              {NAN, 0u},                                  // ZONE_CENTER
              {id(vpd_south).state, id(last_south_ms)},   // ZONE_SOUTH
              {id(vpd_west).state,  id(last_west_ms)},    // ZONE_WEST
              {id(vpd_east).state,  id(last_east_ms)},    // ZONE_EAST
          };

          float dH = id(enthalpy_diff).state;   // outside - inside
          // Track enthalpy staleness — if no update in 10 min, treat as NaN
          static uint32_t enthalpy_age_ms = 0;
          static float last_dH = NAN;
          if(!isnan(dH) && dH != last_dH){
            enthalpy_age_ms = 0;
            last_dH = dH;
          }else{
            enthalpy_age_ms += dt_ms;
          }
          if(enthalpy_age_ms > 600000){  // 10 min stale → treat as NaN
            dH = NAN;
          }

          /**************** 5 — no NaN fallback (phase 2, #1643) *****************/
          // The A6 fallbacks (outdoor plus an offset, or an assumed cold or hot
          // house) are gone: with no indoor reading the controller runs the
          // outdoor rule of decision 7 instead (section 8+9).

          /**************** 6 — set-points & thresholds ***************************/
          // Package 4.3: the old controller's thresholds, safety-limit sanity block
          // and economiser gate are gone. The law takes the band (section 8+9) and
          // its compiled numbers, the 40/100 F protection limits included.

                    /**************** 7 — runtime-aware lead/lag selection ****************/
          // Phase 2: the lifetime counters, restored once from flash at the first
          // tick into the RAM store the shutdown hook also reads; the lead chooser
          // balances the fans' lifetime run seconds, so the balance survives a
          // restart (it was the day's runtime, lost at boot).
          RelayCounterStore& counter_store = relay_counter_store();
          if (!counter_store.restored) {
            const uint32_t saved_starts[kCountedRelays] = {
                id(persist_starts_heat1), id(persist_starts_heat2), id(persist_starts_fan1),
                id(persist_starts_fan2), id(persist_starts_fog), id(persist_starts_vent)};
            const uint32_t saved_fan_s[2] = {id(persist_fan1_run_s), id(persist_fan2_run_s)};
            counter_store.counters = relay_counters_restore(saved_starts, saved_fan_s);
            counter_store.restored = true;
          }
          RelayCounters& relay_counters = counter_store.counters;
          // T6 S3: the lead fan is the relay layer's (relay_step() picks it from the run
          // seconds while both fans are off); this pass's request tables use the lead
          // as it stands, and section 11a publishes the one the relay layer runs.
          static climate_law::RelayState law_relays;

          /**************** 8+9 — MODE + EQUIPMENT (via greenhouse_logic.h) *******/
          // Single source of truth: same code runs on ESP32 and in x86 tests.
          static ControlState ctl_state = initial_state();
          // Mister telemetry (local tracking for state labels — not in ControlState
          // because the mister state machine in section 12 is the authority)
          // mist_telemetry replaced by ctl_state.mist_stage (the authority)  // 0=off, 1=S1, 2=S2

          auto sntp_now = id(sntp_time).now();
          // Two clock tests (phase 2, RULINGS C3). wall_clock_valid is today's
          // test and stays the test of lighting (sv2_solar) and of the irrigation
          // engine's inputs (C2). The band trusts the clock only after an SNTP sync
          // completed since this boot (sntp_acquisition_valid(), the sntp_valid
          // entity's predicate): a soft reset keeps a clock that may be wrong.
          const bool wall_clock_valid = sntp_now.is_valid() && !id(sntp_failed);
          const bool band_clock_trusted =
              sntp_acquisition_valid(id(sntp_acquired), sntp_now.is_valid(), id(sntp_failed));
          int local_hour = wall_clock_valid ? sntp_now.hour : 12;

          // ── Firmware-v2: ON-CHIP solar ephemeris (offline-first) ──────────
          // Compute sunrise / solar-noon / sunset locally from the calendar
          // date so the diurnal program tracks the drifting sun with ZERO
          // network. utc_offset is derived from the time component, so DST is
          // correct by construction. When time is invalid we fall back to a
          // representative day and the header's fallback phase keeps control
          // sane (degraded, not wrong).
          int sv2_now_minute = wall_clock_valid ? (sntp_now.hour * 60 + sntp_now.minute) : (local_hour * 60);
          int sv2_doy = wall_clock_valid ? sntp_now.day_of_year : 172;
          int sv2_utc_off = -360;  // MST/MDT fallback
          if (wall_clock_valid) {
              auto utc_now = id(sntp_time).utcnow();
              if (utc_now.is_valid()) {
                  int local_tod = sntp_now.hour * 60 + sntp_now.minute;
                  int utc_tod = utc_now.hour * 60 + utc_now.minute;
                  int diff = local_tod - utc_tod;
                  if (diff > 720) diff -= 1440; else if (diff < -720) diff += 1440;
                  sv2_utc_off = diff;
              }
          }
          SolarTimes sv2_solar = compute_greenhouse_solar_times(sv2_doy, sv2_utc_off);
          float sv2_phase = solar_phase(sv2_now_minute, sv2_solar);
          // The climate's time of day: the wall clock's while the band trusts it,
          // else today's no-clock values (hour 12 of a representative day), so no
          // phase-gated climate rule acts on a clock the band does not trust.
          const int cl_hour = band_clock_trusted ? local_hour : 12;
          const int cl_now_minute = band_clock_trusted ? sv2_now_minute : 720;
          const SolarTimes cl_solar = band_clock_trusted ? sv2_solar : compute_greenhouse_solar_times(172, -360);
          const float cl_phase = band_clock_trusted ? sv2_phase : solar_phase(720, cl_solar);

          // ── Firmware-v2: deterministic band curve from NVS anchors ────────
          // The served band is a pure function of (crop anchors, solar phase),
          // computed on-chip. When sw_onchip_band_enabled is true these
          // OVERRIDE any dispatcher-pushed target_temp_*/vpd_* so the box runs
          // the full program offline; legacy mode keeps the pushed scalars.
          auto sv2_curve = [&](float sr, float sm, float ss, float mid) -> float {
              BandAnchors a = {sr, sm, ss, mid};
              return band_value_at_phase(a, sv2_phase);
          };
          float sv2_temp_low  = id(target_temp_low_f);
          float sv2_temp_high = id(target_temp_high_f);
          float sv2_temp_tgt  = (sv2_temp_low + sv2_temp_high) * 0.5f;
          // T6 F1: the pushed VPD edges (target_vpd_*_kpa), not the dead globals.
          float sv2_vpd_low   = id(target_vpd_low_kpa);
          float sv2_vpd_high  = id(target_vpd_high_kpa);
          float sv2_vpd_tgt   = (sv2_vpd_low + sv2_vpd_high) * 0.5f;
          const BandSource band_source = select_band_source(id(sw_onchip_band_enabled), band_clock_trusted);
          const BandAnchors band_tl = {id(band_temp_low_sr), id(band_temp_low_sm), id(band_temp_low_ss), id(band_temp_low_mid)};
          const BandAnchors band_th = {id(band_temp_high_sr), id(band_temp_high_sm), id(band_temp_high_ss), id(band_temp_high_mid)};
          const BandAnchors band_vl = {id(band_vpd_low_sr), id(band_vpd_low_sm), id(band_vpd_low_ss), id(band_vpd_low_mid)};
          const BandAnchors band_vh = {id(band_vpd_high_sr), id(band_vpd_high_sm), id(band_vpd_high_ss), id(band_vpd_high_mid)};
          // The corridor: the lowest and highest anchor of each edge. It is the band
          // without a trusted clock, and its low edge is the threshold of the
          // no-indoor-reading rule (decision 7) whatever the clock.
          const BandCorridor corridor = band_corridor(band_tl, band_th, band_vl, band_vh);
          if (id(sw_onchip_band_enabled)) {
            if (band_source == BandSource::kCorridor) {
              sv2_temp_low  = corridor.temp_low;
              sv2_temp_tgt  = corridor.temp_target;
              sv2_temp_high = corridor.temp_high;
              sv2_vpd_low   = corridor.vpd_low;
              sv2_vpd_tgt   = corridor.vpd_target;
              sv2_vpd_high  = corridor.vpd_high;
            } else {
              sv2_temp_low  = sv2_curve(id(band_temp_low_sr),   id(band_temp_low_sm),   id(band_temp_low_ss),   id(band_temp_low_mid));
              sv2_temp_tgt  = sv2_curve(id(band_temp_target_sr),id(band_temp_target_sm),id(band_temp_target_ss),id(band_temp_target_mid));
              sv2_temp_high = sv2_curve(id(band_temp_high_sr),  id(band_temp_high_sm),  id(band_temp_high_ss),  id(band_temp_high_mid));
              sv2_vpd_low   = sv2_curve(id(band_vpd_low_sr),    id(band_vpd_low_sm),    id(band_vpd_low_ss),    id(band_vpd_low_mid));
              sv2_vpd_tgt   = sv2_curve(id(band_vpd_target_sr), id(band_vpd_target_sm), id(band_vpd_target_ss), id(band_vpd_target_mid));
              sv2_vpd_high  = sv2_curve(id(band_vpd_high_sr),   id(band_vpd_high_sm),   id(band_vpd_high_ss),   id(band_vpd_high_mid));
            }
          }

          // RULINGS T2 (F2): night_vpd_bias_kpa no longer reaches the band the law, the
          // zone gate and mister_step receive. The setting still takes pushes and reads
          // back (cfg_night_vpd_bias_kpa), inert until package 4.3 removes it.

          // Phase 2: one outdoor reading for every outdoor-dependent decision: the
          // weather station (Tempest UDP) first, the wired exterior intake probe
          // second, each with its own age stamp and the same 600 s maximum age
          // (select_outdoor_reading(), lib/running_alone.h). Neither fresh: NaN and
          // the stale sentinel age, so the summer-vent gate, the cold-vent guard,
          // drying with outdoor air and the no-indoor rule all see no outdoor data.
          // A stamp older than the maximum age is cleared, so a source silent for
          // 49.7 days cannot look fresh again when millis() wraps.
          expire_sample_stamp(id(tempest_last_obs_ms), now_ms, running_alone_k::OUTDOOR_MAX_AGE_S * 1000UL);
          expire_sample_stamp(id(last_intake_ms), now_ms, running_alone_k::OUTDOOR_MAX_AGE_S * 1000UL);
          const OutdoorReading outdoor = select_outdoor_reading(
              now_ms,
              id(ha_outdoor_temp).state, id(ha_outdoor_rh).state, id(tempest_last_obs_ms),
              id(exterior_intake_temperature).state, id(exterior_intake_humidity).state, id(last_intake_ms));
          const float outdoorT = outdoor.temp_f;
          const float outdoor_dp = outdoor.dew_point_f;
          const uint32_t outdoor_age = outdoor.age_s;
          {
            static int8_t outdoor_source_pub = -1;
            static uint32_t outdoor_source_pub_ms = 0;
            if (int8_t(outdoor.source) != outdoor_source_pub || now_ms - outdoor_source_pub_ms >= 300000UL) {
              if (int8_t(outdoor.source) != outdoor_source_pub && outdoor_source_pub >= 0) {
                ESP_LOGW("outdoor", "Outdoor source -> %s", outdoor_source_name(outdoor.source));
              }
              id(gh_outdoor_source).publish_state(outdoor_source_name(outdoor.source));
              outdoor_source_pub = int8_t(outdoor.source);
              outdoor_source_pub_ms = now_ms;
            }
          }

          SensorInputs sensor_in = {
              .temp_f = Tin, .vpd_kpa = VPD, .rh_pct = RHin,
              .dew_point_f = indoor.dew_point_f,
              .outdoor_rh_pct = isnan(outdoor.rh_pct) ? 30.0f : outdoor.rh_pct,
              .enthalpy_delta = isnan(dH) ? -5.0f : dH,
              .solar_w_m2 = isnan(id(tempest_solar_w_m2)) ? 0.0f : id(tempest_solar_w_m2),
              .vpd_south = id(vpd_south).state,
              .vpd_west = id(vpd_west).state,
              .vpd_east = id(vpd_east).state,
              .local_hour = cl_hour,
              .occupied = id(greenhouse_occupied),
              .outdoor_temp_f = outdoorT,
              .outdoor_dewpoint_f = outdoor_dp,
              .outdoor_data_age_s = outdoor_age,
              // SAF-1 / SF1: degraded when the indoor AVERAGE temp/RH probes are
              // unavailable (avg_ok==false, computed in step 4 above) — whether
              // we fell back to the case probe OR to the fabricated 65/50
              // default. The VPD/RH the controller sees is then not a measured
              // canopy average, so VPD-chasing wetting (humidify/dehum/fog) is
              // suppressed in the header and only conservative timed center
              // bursts + temp control remain. SENSOR_FAULT (inf/garbage) still
              // takes over via sensors_plausible() when even the fabricated
              // value is implausible. No grace here (#1271): this gate only holds
              // VPD wetting back, so it trips at once; irr_degraded, which can open
              // a mister, is what waits.
              .sensor_degraded = indoor_reading_degraded(indoor),
              // Firmware-v2 on-chip solar inputs (offline-first time-of-day), on the
              // band's clock (phase 2: today's no-clock values without trust).
              .now_minute = cl_now_minute,
              .sunrise_min = cl_solar.sunrise_min,
              .solar_noon_min = cl_solar.solar_noon_min,
              .sunset_min = cl_solar.sunset_min,
              .solar_phase = cl_phase
          };

          // FRT-6: absorption hold active while now_ms is before the armed
          // deadline. Wrap-aware (millis() wraps ~49.7 days): a hold is far
          // below the wrap period, so the signed-difference test is safe.
          // 0 deadline = no hold; nothing arms it since the engine replaced the
          // job machine (#1160).
          const bool feed_hold_active =
              id(feed_hold_until_ms) != 0
              && (int32_t)(id(feed_hold_until_ms) - now_ms) > 0;

          // Package 4.3: Setpoints carries only what its readers still take: the
          // manual fog safety block (manual_fog_safety_block_reason(): the HUMID
          // press's dew margin, RH ceiling and minimum temperature) and, below, the
          // band the law used and the served targets for the published telemetry.
          Setpoints setpts = default_setpoints();
          setpts.direct_wet_stress_min_dew_margin_f =
              pol(verdify_policy::kPF_direct_wet_stress_min_dew_margin_f, id(direct_wet_stress_min_dew_margin_f));
          setpts.fog_rh_ceiling = (float)id(fog_rh_ceiling_pct);
          setpts.fog_min_temp = (float)id(fog_min_temp_f);
          setpts.temp_target = id(sw_onchip_band_enabled) ? sv2_temp_tgt : (sv2_temp_low + sv2_temp_high) * 0.5f;
          setpts.vpd_target = id(sw_onchip_band_enabled) ? sv2_vpd_tgt : (sv2_vpd_low + sv2_vpd_high) * 0.5f;
          validate_setpoints(setpts);
          // Phase 3 (#1671): the band-edge law (lib/climate_law.h, plan appendix A)
          // decides the climate relays; determine_mode()/resolve_equipment() are no
          // longer called (package 4.3 removed their call-site leftovers). G3: during the boot
          // grace the law gets no temperature, so it requests nothing (mode_reason
          // "init"). `mode` is a label for the consumers that still read one (the fog
          // holds, the engine's sensor_fault input, telemetry); section 12 ends by
          // setting it to the 11.1 label of the relays (climate_law::legacy_state()).
          const bool law_temp_valid = !boot_wait && indoor.source != IndoorSource::kNone;
          climate_law::Inputs law_in{};
          law_in.T = Tin;
          law_in.vpd = VPD;
          law_in.dp_f = indoor.dew_point_f;
          law_in.band = {sv2_temp_low, sv2_temp_high, sv2_vpd_low, sv2_vpd_high};
          law_in.temp_valid = law_temp_valid;
          // RULINGS AG1 (plan 4.2): the humidity rules run on the wall averages only; on the
          // case sensor they hold (no fog, mist or drying on the case air, 100 F included).
          law_in.humidity_valid = climate_law::law_humidity_valid(law_temp_valid, indoor);
          law_in.out_ok = outdoor.source != OutdoorSource::kNone && outdoor_data_fresh(outdoor.age_s);
          law_in.out_T = outdoorT;
          law_in.out_dp_f = outdoor_dp;
          // FW-INFRA note 4: the humidity ratio from the dew point (right on the case sensor too).
          law_in.w_in = climate_law::humidity_ratio_g_per_kg(indoor.dew_point_f);
          law_in.w_out = climate_law::humidity_ratio_g_per_kg(outdoor_dp);
          law_in.dry_cost_limit = climate_law::dry_cost_limit(id(dry_cost_limit));
          static climate_law::State law_state;
          bool law_band_repaired = false;
          const climate_law::Output law = climate_law::step_checked(law_state, law_in, &law_band_repaired);
          // T6 S4/F6/I4/E-m3: every consumer of the band reads the band the law acted on
          // (check_band() repaired), not the raw edges.
          const climate_law::Band law_band = climate_law::check_band(law_in.band).band;
          // X5 (P2): the published consumed band, targets, deltas and climate errors are the
          // band the law used: its edges into setpts (telemetry only from here on), targets
          // kept inside them.
          setpts.temp_low = float(law_band.low);
          setpts.temp_high = float(law_band.high);
          setpts.vpd_low = float(law_band.vpd_low);
          setpts.vpd_high = float(law_band.vpd_high);
          setpts.temp_target = std::min(std::max(setpts.temp_target, setpts.temp_low), setpts.temp_high);
          setpts.vpd_target = std::min(std::max(setpts.vpd_target, setpts.vpd_low), setpts.vpd_high);
          Mode mode = boot_wait ? IDLE
              : !law_temp_valid ? SENSOR_FAULT
              : law.hot ? SAFETY_COOL
              : law.cold ? SAFETY_HEAT
              : IDLE;
          // RULINGS Q2: the doubly blind judgement for the bus watchdog below.
          id(doubly_blind_state) = boot_wait ? int8_t(-1)
              : int8_t(mode == SENSOR_FAULT && outdoor.source == OutdoorSource::kNone);
          // RULINGS T1: at a protection limit (100 F, 40 F) the FANS and VENT-BYPASS
          // latches are cleared, before the latch booleans below, so the override and
          // the protection never fight at a limit crossing. Logged once per clear.
          // X4: the clear is climate_law::clear_latches_at_protection() (lib/climate_law_glue.h),
          // the function the host tests drive.
          if (climate_law::clear_latches_at_protection(law, id(manual_fans_until_ms), id(vent_bypass_until_ms))) {
            ESP_LOGW("manual", "Protection limit %s: FANS / VENT-BYPASS latch cleared", law.hot ? "hot" : "cold");
          }
          climate_law::Output law_request = law;

          // Decision 7 (RULINGS B1): with no valid indoor temperature (SENSOR_FAULT)
          // the controller acts on the outdoor reading against the corridor's low
          // edge (the lowest temp_low anchor): at or above it, vent open with the
          // lead fan; once venting, back below that edge less 1.0 F (G5), vent
          // closed and the electric heater on (never the furnace); no fresh outdoor
          // reading, every relay off. Fog and misters stay off (the fog lock and the
          // engine's sensor_fault input); the manual overrides stay effective.
          // Relays the table drops are cut on the entry tick only; after that the
          // normal dwell times apply.
          static bool no_indoor_prev = false;
          const bool no_indoor_entry = mode == SENSOR_FAULT && !no_indoor_prev;
          no_indoor_prev = mode == SENSOR_FAULT;
          if (mode == SENSOR_FAULT) {
            static NoIndoorBranch no_indoor_last = NoIndoorBranch::kOff;
            // T6 S4: a finite corridor low edge, else the checked band's low edge.
            const float no_indoor_low = std::isfinite(corridor.temp_low) ? corridor.temp_low : float(law_band.low);
            const NoIndoorBranch no_indoor = no_indoor_branch(
                outdoorT, outdoor_age, no_indoor_low, no_indoor_entry ? NoIndoorBranch::kOff : no_indoor_last);
            // X8 (MINOR-3): a fan count, not a named fan; relay_step() picks the lead.
            law_request = climate_law::no_indoor_request(no_indoor);  // through the same relay layer
            if (no_indoor_entry || no_indoor != no_indoor_last) {
              ESP_LOGE("sensor_fault", "No indoor temperature: %s (outdoor %.1f°F, age %u s, corridor low %.1f°F)",
                       no_indoor_reason(no_indoor), outdoorT, (unsigned) outdoor_age, no_indoor_low);
            }
            no_indoor_last = no_indoor;
          }

          // ── Firmware-v2 BUTTON OVERRIDE LAYER (deadline latches) ──────────
          // FANS / HUMID / VENT-BYPASS are LATCHES with a deadline
          // (manual_*_until_ms): the momentary panel push buttons toggle them
          // (greenhouse.yaml) and the manual_override service sets or clears
          // them (irrigation_engine.yaml, VD-47). While latched the relays are
          // FORCED and SUPERSEDE all climate automation — only a re-press, a
          // clear, the timeout, or a true safety rail interrupts them. This is
          // the absolute-priority override layer; it sits ABOVE the mode table
          // and below only safety.
          // Deadlines are wrap-safe signed-difference tests (millis wraps).
          const bool manual_fans_latched =
              id(manual_fans_until_ms) != 0
              && (int32_t)(id(manual_fans_until_ms) - now_ms) > 0;
          const bool manual_fog_latched =
              id(manual_fog_until_ms) != 0
              && (int32_t)(id(manual_fog_until_ms) - now_ms) > 0;
          const bool vent_bypass_latched =
              id(vent_bypass_until_ms) != 0
              && (int32_t)(id(vent_bypass_until_ms) - now_ms) > 0;
          // Expire latches: clear the deadline once elapsed so telemetry/UI
          // reflect the real state and the next press re-arms cleanly.
          if (id(manual_fans_until_ms) != 0 && !manual_fans_latched) id(manual_fans_until_ms) = 0;
          if (id(manual_fog_until_ms)  != 0 && !manual_fog_latched)  id(manual_fog_until_ms)  = 0;
          if (id(vent_bypass_until_ms) != 0 && !vent_bypass_latched) id(vent_bypass_until_ms) = 0;
          // EFFECTIVE manual state = the deadline latches only. The legacy
          // script flags and their Home Assistant buttons are gone (VD-47), so
          // the push buttons and manual_override are the only ways in.
          const bool manual_fans_eff   = manual_fans_latched;
          // #1343 follow-up: a fog run-once from the irrigation engine asks for fog
          // the way the HUMID latch does, below the same safety rails.
          const bool manual_fog_eff    = manual_fog_latched || irr_fog_run();
          const bool vent_bypass_eff   = vent_bypass_latched;
          const bool manual_fog_requested = manual_fog_eff;
          // SENSOR_FAULT locks the fogger off unless an operator latched HUMID
          // (RULINGS G7; an engine run-once is refused by the engine's own hold).
          // The HUMID press's safety block skips the tests it cannot evaluate: no
          // dew-point margin or RH ceiling without a humidity reading (G2, G7). No
          // clock term (phase 2: fog follows the corridor without a trusted clock).
          const bool sensor_fault_relay_lock = sensor_fault_fog_lock(mode, manual_fog_latched);
          // Phase 3 (wiring note 4): the HUMID press's safety block reads no climate
          // setting: the compiled wetting dew margin (skipped with no humidity reading, G7)
          // and the law's cold-house guard (below the band's low edge).
          // AG1: the press keeps the case dew point (indoor.humidity_valid, G2), not the law's
          // wall-only humidity validity (climate_law::humid_press_block(), native-tested).
          const char* manual_fog_safety_block =
              climate_law::humid_press_block(law_temp_valid, indoor, law_band.low);

          // Phase 3: sw_fog_closes_vent and sw_mister_closes_vent are inert; the law
          // decides fog and mist with the vent.
          // F7 (#1161): one occupancy rule for every kind of mist and fog. True only while a
          // detection the ingestor pushed holds (1b's 60 min fail-safe ends it); unknown or
          // missing occupancy leaves it false, so mist runs (D-IRP-10). VPD mist and fog read it
          // here; scheduled, run-now and fertilizer mist read it as the engine's `occupied`
          // input below. Drips never read it. leak_detected is read nowhere in this loop: it
          // raises the leak alert only (Q-05, F14).
          const bool occupancy_moisture_block = id(occupancy_inhibit_enabled) && id(greenhouse_occupied);
          // #1160: a drip run of the irrigation engine holds the water (irr_drip_active(),
          // the engine's drip-manifold state): climate mist and fog wait. A clean drip that
          // pauses or yields for climate demand releases it (D-IRP-03).
          const bool irrigation_water_conflict = irr_drip_active();
          // F9 (#1161): a drip relay reads ON. Drips never overlap fog, so even survival fog
          // waits for it; in SAFETY_COOL the engine pauses a clean drip, and ends a feed, at
          // its next 5 s tick.
          const bool drip_relay_open = id(wall_drips).state || id(wall_drips_fertilized).state
              || id(center_drips).state || id(center_drips_fertilized).state;
          // FW-9: VPD emergency override — allow wet assist even if the daily
          // water budget is exhausted. Include house and zone VPD so a
          // safety miss is not hidden by stale/missing local sensors.
          // Phase 3 (B3): the emergency level is compiled (VPD_EMERGENCY_KPA), the
          // terms are today's (the house and the raw zone probes).
          const double emergency_zone_vpd[ZONE_COUNT] = {
              NAN, id(vpd_south).state, id(vpd_west).state, id(vpd_east).state};
          const bool climate_vpd_emergency = climate_law::vpd_emergency(VPD, emergency_zone_vpd);
          const bool climate_water_budget_block =
              id(mister_water_today) >= pol(verdify_policy::kPF_mister_water_budget_gal, id(mister_water_budget_gal))
              && !climate_vpd_emergency;
          // SAF-4: absolute daily volume hard-ceiling. Unlike the soft budget
          // above, this is NOT bypassed by climate_vpd_emergency — even a VPD
          // emergency cannot push wetting past the hard cap. It sits above the
          // budget (default 360 vs 300 gal) so normal emergencies still have
          // headroom but runaway saturation is impossible.
          // #1160 (F11): the ceiling is the irrigation program's SAF-4 gallons and
          // the count the engine's RTC block (integer centi-gallons; it survives a
          // soft reset and zeroes on a new local day).
          const bool mister_volume_hard_block = irr_saf4_tripped();
          static bool occupancy_water_interlock_prev = false;
          static bool mister_volume_hard_block_prev = false;
          if (mister_volume_hard_block != mister_volume_hard_block_prev) {
              if (mister_volume_hard_block) {
                  ESP_LOGW("interlock","SAF-4 daily volume hard-ceiling reached (%.0f >= %u gal): all wetting off",
                           id(mister_water_today), irr_saf4_gal());
              } else {
                  ESP_LOGI("interlock","SAF-4 daily volume hard-ceiling cleared");
              }
              mister_volume_hard_block_prev = mister_volume_hard_block;
          }

          // (Firmware-v2: the CYC-4 overnight micro-pulse timer/lockout block is
          // DELETED. Overnight humidity emergencies are handled by the normal
          // SEALED_MIST/fog path under the solar night band — when VPD exceeds
          // the LOW night band edge + stress margin the header's stress-wet rule
          // permits fog, bounded by the standard relay min-on/off + duty caps.
          // The HUMID button (manual_fog_force, above) is the operator path.)

          // SAF-5: the AquaFog is clean-water-only by plumbing (there is no
          // fog_fert relay). Positive interlock: fog NEVER co-fires with the
          // fertilizer master valve, so salts can never reach the fogger even
          // if a future plumbing change introduced a path. A drip feed is also
          // covered by irrigation_water_conflict, but this is the explicit,
          // plumbing-independent assertion of the invariant. #1160: the engine's
          // l03_hold also holds fog OFF while a feed pulse waits to open L03.
          const bool fert_master_on = id(fertilizer_master_valve).state || irr_l03_hold();
          // F9 (#1161): the fog force-off is one pure rule, fog_force_off_reason() in
          // greenhouse_logic.h, which this gate, the fog relay's force-off (11) and the
          // fog_block_reason ladder (14) all read. Every mode keeps SENSOR_FAULT's lock,
          // confirmed occupancy, SAF-5 and a drip relay reading OFF; outside
          // SAFETY_COOL an engine drip, the soft budget and SAF-4 also hold fog, while
          // survival fog runs past them (D-IRP-03, D-IRP-04).
          const FogForceOffInputs fog_rails{
              sensor_fault_relay_lock,
              occupancy_moisture_block,
              fert_master_on,
              drip_relay_open,
              irrigation_water_conflict,
              climate_water_budget_block,
              mister_volume_hard_block,
          };
          // The engine's climate-yield input (D-IRP-03): fog the climate wants that
          // only a drip holds back.
          FogForceOffInputs fog_rails_but_drips = fog_rails;
          fog_rails_but_drips.drip_relay_open = false;
          fog_rails_but_drips.irrigation_water_conflict = false;
          fog_rails_but_drips.sensor_fault_relay_lock = mode == SENSOR_FAULT;  // C2: today's term
          const bool fog_hold = fog_forced_off(mode, fog_rails);
          if (occupancy_moisture_block != occupancy_water_interlock_prev) {
              if (occupancy_moisture_block) {
                  ESP_LOGW("interlock","Occupancy confirmed: holding fog and every mist (drips run)");
              } else {
                  ESP_LOGI("interlock","Occupancy inhibit cleared: moisture actuators may resume");
              }
              occupancy_water_interlock_prev = occupancy_moisture_block;
          }
          // sw_fog_closes_vent is inert in phase 3: the law decides fog with the vent.

          /**************** 11a — RELAY LAYER, THEN THE OVERRIDES (phase 3) ********/
          // climate_law::relay_step() owns the minimum times, the interlocks (a fan
          // only with the vent open, the furnace never with the air), the lead fan, the
          // furnace's boot wait (G4) and the protection limits (G1, G1a-c). On the
          // entry to the no-indoor state it cuts what the table drops (decision 7).
          // RULINGS AG2: the law's own fog keeps the phase 2 dew-point margin (outside
          // SENSOR_FAULT, under WET_DEW_MARGIN_F the request drops); the engine's fog demand
          // below reads the same gated request.
          if (!climate_law::law_fog_dew_margin_ok(mode, Tin, indoor.dew_point_f)) law_request.fog = false;
          climate_law::RelayInputs law_relay_in{};
          law_relay_in.fan1_run_s = relay_counters.fan_run_s[0];
          law_relay_in.fan2_run_s = relay_counters.fan_run_s[1];
          law_relay_in.fog_hold = fog_hold;
          // F5: the law's layers count the wall-clock interval (now - last, unsigned), as the contract states; each
          // saturates, so a stall counts as the time it lasted (a pulse closes on time, a minimum time is not
          // stretched). Only the old dwell gates needed the 5 s clamp of dt_ms.
          law_relay_in.dt_ms = raw_dt_ms;
          law_relay_in.cut_unwanted = no_indoor_entry;
          // The manual override layer on the relay layer's result, exactly as phase 2
          // (B1, G7): FANS forces both fans with the vent open, VENT-BYPASS both fans
          // with the vent closed, HUMID the fogger unless a fog safety block is up; a
          // no-op at the protection limits (mode SAFETY_COOL / SAFETY_HEAT, and T1 has
          // cleared FANS and VENT-BYPASS there); effective in SENSOR_FAULT. A press acts
          // this pass, past minimum off times. climate_law::relay_pass()
          // (lib/climate_law_glue.h) first syncs the relay layer to the physical relays
          // (T6 S2), runs relay_step(), the overrides, and the interlocks over the result
          // (AE10, AG3: no heater with a manual fan run; the electric heater never with the
          // air except the law's drying and 40 F; the furnace never with the air; the fog
          // holds win).
          const ManualOverrides manual_ov = {
              manual_fans_eff,                     // fans_active
              vent_bypass_eff,                     // vent_bypass_active
              manual_fog_eff,                      // humid_active
              manual_fog_safety_block[0] != '\0'   // fog_safety_blocked
          };
          const climate_law::RelayPass pass_out = climate_law::relay_pass(
              law_relays, law_request, law_relay_in,
              RelayOutputs{id(heat1_rly)->state, id(heat2_rly)->state, id(fan1_rly)->state,
                           id(fan2_rly)->state, id(fog_rly)->state, id(vent_rly)->state},
              manual_ov, mode);
          const RelayOutputs ov_out = pass_out.out;
          const ManualForce manual_force = pass_out.force;
          const bool manual_fog_force = manual_force.fog;
          // T6 S3/F4/E-m1: one lead-fan chooser, the relay layer's; the published lead
          // is the fan that runs first.
          if (law_relays.lead_fan1 != id(fan_lead_is_fan1)) {
            id(fan_lead_is_fan1) = law_relays.lead_fan1;
            ESP_LOGI("lead", "Lead fan -> %s (fan1=%lus fan2=%lus)", law_relays.lead_fan1 ? "Fan 1" : "Fan 2",
                     static_cast<unsigned long>(relay_counters.fan_run_s[0]),
                     static_cast<unsigned long>(relay_counters.fan_run_s[1]));
          }
          // RULINGS T4 (C2): the engine's climate fog demand keeps today's terms: the
          // law's fog OR a HUMID press / run-once the override layer forced, after the
          // override layer, with the rails but the drips and today's clock term.
          const bool climate_fog_wanted = climate_law::climate_fog_wanted(
              law_request, manual_force, fog_forced_off(mode, fog_rails_but_drips), wall_clock_valid);

          /**************** 10 — CYCLE COUNTERS ***********************************/
          // #367: count accepted relay edges after dwell and overrides apply
          // (below). Repeated ON intent refused by min-off is not a new cycle.
          const bool relay_was_on[] = {
              id(heat1_rly)->state, id(heat2_rly)->state,
              id(fan1_rly)->state, id(fan2_rly)->state,
              id(fog_rly)->state, id(vent_rly)->state};

          /**************** 11 — APPLY RELAY OUTPUTS ******************************/
          // The drivers switch, book runtimes and count; the timing is the relay layer's.
          set_relay(R[0], ov_out.heat1);
          set_relay(R[1], ov_out.heat2);
          set_relay(R[5], ov_out.vent);
          set_relay(R[2], ov_out.fan1);
          set_relay(R[3], ov_out.fan2);
          set_relay(R[4], ov_out.fog);
          // The relay layer follows what is physically on (an override's edge, an OTA
          // on_begin close): minimum times count from that edge (#1313).
          climate_law::relay_sync(law_relays, RelayOutputs{
              id(heat1_rly)->state, id(heat2_rly)->state, id(fan1_rly)->state,
              id(fan2_rly)->state, id(fog_rly)->state, id(vent_rly)->state});
          // What this pass commanded (the telemetry and logs below read these names).
          const bool willHeat1 = ov_out.heat1, willHeat2 = ov_out.heat2;
          const bool willFan1 = ov_out.fan1, willFan2 = ov_out.fan2;
          const bool willFog = ov_out.fog, willVent = ov_out.vent;

          if(!relay_was_on[0] && id(heat1_rly)->state) id(cnt_heat1_today) += 1;
          if(!relay_was_on[1] && id(heat2_rly)->state) id(cnt_heat2_today) += 1;
          if(!relay_was_on[2] && id(fan1_rly)->state)  id(cnt_fan1_today) += 1;
          if(!relay_was_on[3] && id(fan2_rly)->state)  id(cnt_fan2_today) += 1;
          if(!relay_was_on[4] && id(fog_rly)->state)   id(cnt_fog_today) += 1;
          if(!relay_was_on[5] && id(vent_rly)->state)  id(cnt_vent_today) += 1;

          // Phase 2: lifetime relay starts and fan run seconds (Relay Counters).
          // Counted in RAM every tick, copied to the restore_value globals ten
          // minutes after a boot, then at most once an hour (so flash is written at
          // most hourly), and on a planned shutdown (greenhouse.yaml on_shutdown);
          // restored at boot.
          {
            const bool relay_is_on[kCountedRelays] = {
                id(heat1_rly)->state, id(heat2_rly)->state,
                id(fan1_rly)->state, id(fan2_rly)->state,
                id(fog_rly)->state, id(vent_rly)->state};
            relay_counters_tick(relay_counters, relay_was_on, relay_is_on, raw_dt_ms);
            if (relay_counters_save_due(now_ms, counter_store.last_save_ms, counter_store.saved_since_boot)) {
              id(persist_starts_heat1) = relay_counters.starts[0];
              id(persist_starts_heat2) = relay_counters.starts[1];
              id(persist_starts_fan1)  = relay_counters.starts[2];
              id(persist_starts_fan2)  = relay_counters.starts[3];
              id(persist_starts_fog)   = relay_counters.starts[4];
              id(persist_starts_vent)  = relay_counters.starts[5];
              id(persist_fan1_run_s)   = relay_counters.fan_run_s[0];
              id(persist_fan2_run_s)   = relay_counters.fan_run_s[1];
              counter_store.last_save_ms = now_ms;
              counter_store.saved_since_boot = true;
            }
            static uint32_t counters_pub_ms = 0;
            static bool counters_published = false;
            if ((!counters_published && now_ms >= 15000UL) ||
                (counters_published && now_ms - counters_pub_ms >= 300000UL)) {
              static char counters_json[160];
              snprintf(counters_json, sizeof(counters_json),
                       "{\"v\":1,\"h1\":%lu,\"h2\":%lu,\"f1\":%lu,\"f2\":%lu,\"fg\":%lu,\"vt\":%lu,\"f1s\":%lu,\"f2s\":%lu}",
                       (unsigned long) relay_counters.starts[0], (unsigned long) relay_counters.starts[1],
                       (unsigned long) relay_counters.starts[2], (unsigned long) relay_counters.starts[3],
                       (unsigned long) relay_counters.starts[4], (unsigned long) relay_counters.starts[5],
                       (unsigned long) relay_counters.fan_run_s[0], (unsigned long) relay_counters.fan_run_s[1]);
              id(gh_relay_counters).publish_state(counters_json);
              counters_pub_ms = now_ms;
              counters_published = true;
            }
          }

          /**************** 12 — MISTER STATE MACHINE *****************************/
          // Runs only for SEALED_MIST or explicit VENTILATE assist. Zone stress
          // chooses the pulse target; it does not create a standalone mister mode.
          // Stages: S1 (single zone) → S2 (all zones rotating) → FOG (escalation)
          char moisture_block_reason[96] = "none";
          char direct_wet_zone_mask[48] = "unknown";
          // X1: the mister train as mister_step() left it this pass, for the assist telemetry (section 14).
          climate_law::MisterState mister_law_now{};
          {
            // F8: zone choice takes each zone's VPD from these locals (own → peers →
            // house), never a stale held VPD; *_temp below still reads the raw probe.
            float south_vpd = zone_vpd_with_fallback(ZONE_SOUTH, zp, VPD, now_ms).vpd_kpa;
            float west_vpd  = zone_vpd_with_fallback(ZONE_WEST,  zp, VPD, now_ms).vpd_kpa;
            float east_vpd  = zone_vpd_with_fallback(ZONE_EAST,  zp, VPD, now_ms).vpd_kpa;
            float avg_vpd   = VPD;

            // Phase 3 (#1671, plan 4.8): the climate mister pulses follow the law's mister
            // request (house VPD above vpd_high + 0.30, cold-house guard) through
            // climate_law::mister_step(): one pulse at a time, compiled length and gap
            // (B3), the fairness rule, the engine's rank on the house band, the mister
            // line minimum off time as a fence. The S1/S2 stage machine, its engage delays,
            // the per-zone crop VPD targets and sw_mister_closes_vent are not read.
            const float wet_dew_margin_f = (!isnan(Tin) && !isnan(indoor.dew_point_f))
              ? Tin - indoor.dew_point_f
              : -999.0f;
            // The zone gate's safety term (plan 8.7): no occupancy, no feed hold, house VPD
            // above the band's high edge, the compiled wetting dew margin; no clock term.
            const bool climate_wet_assist_safety_ok = climate_law::zone_gate_safety_ok(
              occupancy_moisture_block, feed_hold_active, VPD, law_band.vpd_high, wet_dew_margin_f);
            // F6 (#1161): one rule per mister zone (L04 center, L07 south, L09 west),
            // irr_climate_zone_allowed(): the demand and its safety term, the zone an
            // effective VPD member, not backing off or latched by the watchdog, its duty
            // cap and SAF-4 not reached. Unchanged; fed with the law's request.
            const bool center_wet_allowed = irr_climate_zone_allowed(
              verdify_irr::kL04, law.mist, climate_wet_assist_safety_ok, mister_volume_hard_block);
            const bool south_wet_allowed = irr_climate_zone_allowed(
              verdify_irr::kL07, law.mist, climate_wet_assist_safety_ok, mister_volume_hard_block);
            const bool west_wet_allowed = irr_climate_zone_allowed(
              verdify_irr::kL09, law.mist, climate_wet_assist_safety_ok, mister_volume_hard_block);
            const bool any_mister_wet_allowed = south_wet_allowed || west_wet_allowed || center_wet_allowed;
            {
              direct_wet_zone_mask[0] = '\0';
              size_t mask_n = 0;
              auto add_zone = [&](const char* tag){
                if(mask_n > 0 && mask_n + 1 < sizeof(direct_wet_zone_mask)) {
                  direct_wet_zone_mask[mask_n++] = ',';
                }
                size_t len = strlen(tag);
                if(mask_n + len < sizeof(direct_wet_zone_mask)) {
                  memcpy(direct_wet_zone_mask + mask_n, tag, len);
                  mask_n += len;
                }
              };
              if(south_wet_allowed) add_zone("south");
              if(west_wet_allowed) add_zone("west");
              if(center_wet_allowed) add_zone("center");
              direct_wet_zone_mask[mask_n] = '\0';
              if(mask_n == 0) snprintf(direct_wet_zone_mask, sizeof(direct_wet_zone_mask), "none");
            }
            // #1160: the climate path closes a mister only when the irrigation
            // engine's own run (a scheduled window, a feed, a mist prewet or flush)
            // does not hold it; closing its own VPD pulse hands the mist manifold
            // back (irr_vpd_release). The fertilizer relays are the engine's alone.
            auto close_climate_misters = [&]() {
              irr_climate_close(id(south_wall_mister), verdify_irr::kL07);
              irr_climate_close(id(west_wall_mister), verdify_irr::kL09);
              irr_climate_close(id(south_wall_mister_fertilized), verdify_irr::kL08);
              irr_climate_close(id(west_wall_mister_fertilized), verdify_irr::kL10);
              irr_climate_close(id(center_mister), verdify_irr::kL04);
            };
            // F10 (D-IRP-19, #1161): the mister watchdog. irr_mister_watchdog() (the fault
            // logic is irr_watchdog_step() in lib/irrigation_program.h) forces OFF every wet
            // relay that reads ON without its engine grant, and every mister ON longer than
            // its commanded pulse + 30 s (300 s when no length is known), whoever opened it.
            // An overrun faults the zone: a VPD member backs off 10, then 30 min, and latches
            // on its third fault of the day; a schedule-only zone, L08 or L10 latches on its
            // first. A latch holds until local midnight or clear_fault; irr_state carries each
            // end time. The climate path then closes its own VPD pulse on a zone that may not
            // mist and ends a pulse train the watchdog cut.
            auto direct_wet_relay_watchdog = [&]() {
              const uint16_t faulted = irr_mister_watchdog();
              if(!south_wet_allowed) irr_climate_close(id(south_wall_mister), verdify_irr::kL07);
              if(!west_wet_allowed) irr_climate_close(id(west_wall_mister), verdify_irr::kL09);
              if(!center_wet_allowed) irr_climate_close(id(center_mister), verdify_irr::kL04);
              const int pulse_zone = id(mister_pulse_zone);
              bool active_zone_gate_closed =
                  (pulse_zone == 1 && (!south_wet_allowed || (faulted & verdify_irr::irr_bit(verdify_irr::kL07)))) ||
                  (pulse_zone == 2 && (!west_wet_allowed || (faulted & verdify_irr::irr_bit(verdify_irr::kL09)))) ||
                  (pulse_zone == 3 && (!center_wet_allowed || (faulted & verdify_irr::irr_bit(verdify_irr::kL04))));
              if(active_zone_gate_closed) {
                id(mister_pulse_zone) = 0;
                id(mister_pulse_timer_ms) = 0;
              }
            };
            direct_wet_relay_watchdog();

            const bool budget_block = climate_water_budget_block;
            const bool occupancy_blocks = occupancy_moisture_block;
            const bool irrigation_block = irrigation_water_conflict;
            // The pulse request with every hold of plan 8.7 (SAF-4 and the watchdog act
            // through the zone gate above).
            const bool mister_request = law.mist && !budget_block && !occupancy_blocks && !irrigation_block;
            static climate_law::MisterState mister_law;
            static uint32_t mister_since_fire_ms[ZONE_COUNT] = {UINT32_MAX, UINT32_MAX, UINT32_MAX, UINT32_MAX};
            for (int z = 0; z < ZONE_COUNT; z++) {
              mister_since_fire_ms[z] = UINT32_MAX - mister_since_fire_ms[z] < raw_dt_ms ? UINT32_MAX
                                                                                      : mister_since_fire_ms[z] + raw_dt_ms;
            }
            climate_law::MisterInputs mister_in{};
            mister_in.request = mister_request;
            mister_in.allowed[ZONE_CENTER] = center_wet_allowed;
            mister_in.allowed[ZONE_SOUTH] = south_wet_allowed;
            mister_in.allowed[ZONE_WEST] = west_wet_allowed;
            mister_in.allowed[ZONE_EAST] = false;  // no mister
            mister_in.zone_vpd[ZONE_CENTER] = avg_vpd;
            mister_in.zone_vpd[ZONE_SOUTH] = south_vpd;
            mister_in.zone_vpd[ZONE_WEST] = west_vpd;
            mister_in.zone_vpd[ZONE_EAST] = east_vpd;
            mister_in.vpd_high = law_band.vpd_high;
            for (int z = 0; z < ZONE_COUNT; z++) mister_in.since_fire_ms[z] = mister_since_fire_ms[z];
            const uint32_t mister_min_off_ms = uint32_t(climate_law::MISTER_MIN_OFF_S * climate_law::MS_PER_S);
            mister_in.min_off_ready[ZONE_CENTER] = now_ms - id(last_off_center_ms) >= mister_min_off_ms;
            mister_in.min_off_ready[ZONE_SOUTH] = now_ms - id(last_off_south_ms) >= mister_min_off_ms;
            mister_in.min_off_ready[ZONE_WEST] = now_ms - id(last_off_west_ms) >= mister_min_off_ms;
            mister_in.min_off_ready[ZONE_EAST] = false;
            mister_in.dt_ms = raw_dt_ms;  // F5
            const climate_law::MisterCommand mister_cmd = climate_law::mister_step(mister_law, mister_in);
            if (mister_cmd.close_all) {
              // T6 C-m3: the pulse's VPD effectiveness, as phase 2 published it at a pulse's end.
              if (id(mister_pulse_zone) > 0 && !isnan(id(mister_vpd_at_start)) && !isnan(avg_vpd)) {
                const float delta = avg_vpd - id(mister_vpd_at_start);
                id(mister_vpd_delta).publish_state(delta);
                ESP_LOGI("mister", "Pulse done: zone=%d delta=%.3f kPa (%.2f -> %.2f)", id(mister_pulse_zone), delta,
                         id(mister_vpd_at_start), avg_vpd);
              }
              close_climate_misters();
              id(mister_pulse_zone) = 0;
            }
            if (mister_cmd.open_zone >= 0) {
              const int z = mister_cmd.open_zone;
              // The legacy zone numbering of the telemetry globals: south 1, west 2, center 3.
              const int legacy_zone = z == ZONE_SOUTH ? 1 : z == ZONE_WEST ? 2 : 3;
              const uint8_t zone_line = z == ZONE_SOUTH ? verdify_irr::kL07
                                      : z == ZONE_WEST  ? verdify_irr::kL09
                                                        : verdify_irr::kL04;
              // #1160 (F5): the engine grants the mist manifold; with no grant nothing
              // opens and mister_step asks again one pulse length later.
              close_climate_misters();
              if (irr_vpd_grant(zone_line, mister_cmd.pulse_ms)) {
                if (legacy_zone == 1)      { id(south_wall_mister).turn_on(); id(last_fire_south_ms)  = now_ms; id(cnt_mister_south_today)  += 1; }
                else if (legacy_zone == 2) { id(west_wall_mister).turn_on();  id(last_fire_west_ms)   = now_ms; id(cnt_mister_west_today)   += 1; }
                else                       { id(center_mister).turn_on();     id(last_fire_center_ms) = now_ms; id(cnt_mister_center_today) += 1; }
                climate_law::mister_opened(mister_law, z, mister_cmd.pulse_ms);
                // I6: a pulse the fairness rule picked (an overdue stressed zone) is counted.
                if (climate_law::mister_fairness_zone(mister_in) == z) id(cnt_mister_fairness_overrides_today) += 1;
                mister_since_fire_ms[z] = 0;
                id(mister_pulse_zone) = legacy_zone;
                id(mister_selected_zone) = legacy_zone;
                id(mister_vpd_at_start) = avg_vpd;
                ESP_LOGI("mister", "PULSE zone=%d %ums (VPD=%.2f, high=%.2f)", legacy_zone,
                         (unsigned) mister_cmd.pulse_ms, avg_vpd, law_band.vpd_high);
              } else {
                id(mister_pulse_zone) = 0;
                ESP_LOGI("mister", "MANIFOLD-HOLD zone=%d", legacy_zone);
              }
            }
            mister_law_now = mister_law;
            // Telemetry globals: 1 while a pulse train runs (pulse or gap), else 0.
            id(mister_state) = mister_law.phase == climate_law::MISTER_IDLE ? 0 : 1;
            id(mister_pulse_timer_ms) = mister_law.timer_ms;
            // moisture_block_reason (free text): why VPD misting is not running.
            if (id(south_wall_mister).state || id(west_wall_mister).state || id(center_mister).state) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "served");
            } else if (!law.mist) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "no_vpd_demand");  // T6 C-m4: today's word
            } else if (budget_block) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "water_budget");
            } else if (occupancy_blocks) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "occupancy");
            } else if (irrigation_block) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "irrigation");
            } else if (!any_mister_wet_allowed) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason),
                       wet_dew_margin_f < climate_law::WET_DEW_MARGIN_F ? "dew_margin" : "no_zone_available");
            } else if (mister_law.phase == climate_law::MISTER_GAP) {
              snprintf(moisture_block_reason, sizeof(moisture_block_reason), "pulse_gap");
            }

            // Water tracking (F6, #1161): the flow meter counts into SAF-4 and the soft
            // budget whenever any mister relay is ON, whatever its origin (a VPD pulse, a
            // scheduled or run-now window, a feed on L08 or L10, a mist prewet or flush),
            // or fog is, survival fog included (D-IRP-04: exempt from both caps, still
            // counted). It runs whether or not a VPD pulse runs, so blocked VPD misting
            // never stops the count; drips never overlap mist or fog, so no drip water is
            // counted. Runtime per zone is the engine's (its RTC block, every relay ON).
            {
              const bool mister_flow_active = id(center_mister).state
                  || id(south_wall_mister).state || id(south_wall_mister_fertilized).state
                  || id(west_wall_mister).state || id(west_wall_mister_fertilized).state;
              const bool fog_flow_active = id(fog_rly)->state;
              if(mister_flow_active || fog_flow_active){
                float gpm = id(water_flow_rate).state;
                if(!isnan(gpm) && gpm > 0.0f){
                  // #1160: SAF-4 and the soft budget count integer centi-gallons in the
                  // engine's RTC block; the fraction below one carries to the next tick
                  // (mister_water_today mirrors the block).
                  irr_add_water(gpm, dt_ms);
                }
              }
            }

            // ── Irrigation engine inputs (#1160) ─────────────────────────────
            // The climate facts the 5 s engine tick reads: modes and measurements
            // only; leak_detected is not an engine input (Q-05, F14).
            {
              verdify_irr::IrrInputs& irr_in = irr_climate_inputs();
              irr_in.sensor_fault = mode == SENSOR_FAULT;
              irr_in.safety_cool = mode == SAFETY_COOL;
              irr_in.sensor_degraded = irr_degraded;
              irr_in.vpd_emergency = climate_vpd_emergency;
              // Climate wetting that only a drip holds back (the climate yield, D-IRP-03).
              // C2: the engine's input keeps today's clock term exactly.
              // Phase 3: the law's request in place of the mode's; the zone and global
              // stress terms read retired climate settings and the law's request implies
              // them (house VPD above vpd_high + 0.30), so they are dropped (wiring note 6).
              const bool climate_mist_wanted = law.mist && any_mister_wet_allowed
                  && !budget_block && !occupancy_blocks && wall_clock_valid;
              irr_in.climate_demand = climate_mist_wanted || climate_fog_wanted;
              irr_in.occupied = occupancy_moisture_block;
              // The RH ceiling and the dew margin read the measured indoor air: the average
              // probes, else the controller-case probe while it answers (this loop's own fallback
              // for Tin and RHin; its 50 % and 65°F defaults are never a measurement). A missing
              // RH never blocks. degraded_only mist (D-IRP-12) runs only while the averages are
              // out and needs a known dew margin, so the case probe is what lets it run.
              const bool irr_case_fresh = probe_sample_fresh(now_ms, id(last_case_ms), kZoneProbeStaleMs);
              const verdify_irr::IrrAirInputs irr_air = verdify_irr::irr_air_inputs(
                  avg_ok ? id(average_temperature).state : irr_case_fresh ? id(case_temperature).state : NAN,
                  avg_ok ? id(average_humidity).state : irr_case_fresh ? id(case_humidity).state : NAN,
                  float(climate_law::WET_DEW_MARGIN_F));  // package 3.2 (B3): compiled
              irr_in.rh_pct = irr_air.rh_pct;
              irr_in.dew_margin_known = irr_air.dew_margin_known;
              irr_in.dew_breach = irr_air.dew_breach;
              const float irr_budget_gal = pol(verdify_policy::kPF_mister_water_budget_gal, id(mister_water_budget_gal));
              irr_in.soft_budget_centigal = (std::isfinite(irr_budget_gal) && irr_budget_gal > 0.0f)
                  ? uint32_t(irr_budget_gal * 100.0f + 0.5f) : 0u;
              irr_in.mister_min_off_s = uint16_t(climate_law::MISTER_MIN_OFF_S);  // package 3.2 (B3): compiled
              irr_set_vpd_sources(zone_vpd_with_fallback(ZONE_SOUTH, zp, VPD, now_ms).source,
                                  zone_vpd_with_fallback(ZONE_WEST, zp, VPD, now_ms).source);
            }
          }

          /**************** 14 — Telemetry & debug *******************************/
          // Phase 3: the 11.1 label of the relays as they are (climate_law::legacy_state()),
          // so every consumer of the mode vocabulary keeps working; the boot grace stays IDLE.
          // T3: the same label (published_label()) drives climate_action and the axis below.
          climate_law::LegacyInputs legacy_in{};
          legacy_in.sensor_fault = mode == SENSOR_FAULT;
          legacy_in.T = Tin;
          legacy_in.vpd = VPD;
          legacy_in.band = law_band;
          legacy_in.vent_on = id(vent_rly)->state;
          legacy_in.fog_on = id(fog_rly)->state;
          legacy_in.mister_on = id(south_wall_mister).state || id(west_wall_mister).state || id(center_mister).state;
          legacy_in.heat1_on = id(heat1_rly)->state;
          legacy_in.heat2_on = id(heat2_rly)->state;
          legacy_in.drying = law.drying;
          const climate_law::LegacyState legacy =
              climate_law::published_label(climate_law::legacy_state(legacy_in), boot_wait);
          if (!boot_wait) mode = legacy.mode;
          ctl_state.mist_stage = legacy.mist_stage;  // the label's suffix only; nothing decides on it
          // F9 (#1161): the force-off words come from the same rule as the fog gate and
          // the relay (fog_force_off_reason()), so while survival fog runs in SAFETY_COOL
          // this never reads irrigation, resource_budget or water_ceiling, and no leak.
          // T3: computed here so climate_fog_block_reason (below) and fog_block_reason
          // (OBS-1e) read the one ladder.
          char fog_block_reason[64];
          {
            const char* fog_forced_reason = fog_force_off_reason(mode, fog_rails);
            if(fog_forced_reason[0] != '\0') {
              snprintf(fog_block_reason, sizeof(fog_block_reason), "%s", fog_forced_reason);
            } else if(manual_fog_requested && manual_fog_safety_block[0] != '\0') {
              snprintf(fog_block_reason, sizeof(fog_block_reason), "%s", manual_fog_safety_block);
            } else if(id(fog_rly)->state) {
              snprintf(fog_block_reason, sizeof(fog_block_reason), "served");
            } else {
              // Phase 3: the law's fog waiting the fogger's minimum off time, held by the
              // dew-point margin (RULINGS AG2, phase 2's "dew_margin"), or not asked for.
              snprintf(fog_block_reason, sizeof(fog_block_reason), "%s",
                       climate_law::law_fog_wait_word(law.fog, law_request.fog));
            }
          }
          // Phase 3 (contract phase3-entities): the drying meter, the law's state record
          // (on every change but the cost, and every 60 s), the meter (every 300 s) and the
          // constants hash (every 3,600 s), the last two once within 15 s of boot. Static
          // buffers; the text sensor's own string is the only allocation per publish.
          {
            static climate_law::DryingMeter drying_meter;
            climate_law::drying_meter_step(drying_meter, law_state, law, id(vent_rly)->state,
                                           id(fan1_rly)->state || id(fan2_rly)->state, law_in, raw_dt_ms);  // F5
            static char law_record[256];
            static char law_record_key[256] = "";
            static uint32_t law_record_ms = 0;
            static bool law_record_sent = false;
            climate_law::Output keyed = law;
            keyed.dry_cost = NAN;  // the cost alone does not trigger a publish
            static char key[256];
            climate_law::format_state_record(key, sizeof(key), law_state, keyed, law_in.dry_cost_limit,
                                             law_band_repaired, law_band);
            // T6 F8/C-m1: nothing during the boot grace (the law has no temperature yet).
            // T6 C-m7: on a change at most every 5 s, and the 60 s heartbeat; never every second.
            if (climate_law::law_record_due(boot_wait, law_record_sent, strcmp(key, law_record_key) != 0, now_ms,
                                            law_record_ms)) {
              climate_law::format_state_record(law_record, sizeof(law_record), law_state, law,
                                               law_in.dry_cost_limit, law_band_repaired, law_band);
              id(gh_climate_law_state).publish_state(law_record);
              snprintf(law_record_key, sizeof(law_record_key), "%s", key);
              law_record_ms = now_ms;
              law_record_sent = true;
            }
            static uint32_t meter_ms = 0, constants_ms = 0;
            static bool meter_sent = false, constants_sent = false;
            const bool boot_publish_due = millis() >= 10000UL;  // "within 15 s of boot"
            if ((!meter_sent && boot_publish_due) || (meter_sent && now_ms - meter_ms >= 300000UL)) {
              static char meter_text[128];
              climate_law::format_drying_meter(meter_text, sizeof(meter_text), drying_meter);
              id(gh_climate_drying_meter).publish_state(meter_text);
              meter_ms = now_ms;
              meter_sent = true;
            }
            if ((!constants_sent && boot_publish_due) || (constants_sent && now_ms - constants_ms >= 3600000UL)) {
              id(gh_climate_law_constants).publish_state(climate_law::constants_hash());
              constants_ms = now_ms;
              constants_sent = true;
            }
          }
          char lbl[48];
          if(mode == SEALED_MIST){
            snprintf(lbl, sizeof(lbl), "SEALED_MIST_%s", MIST_NAMES[ctl_state.mist_stage]);
          }else{
            snprintf(lbl, sizeof(lbl), "%s", MODE_NAMES[mode]);
          }
          {
            static char last_gh_state[48] = "";
            if(strcmp(last_gh_state, lbl) != 0){
              id(gh_state).publish_state(lbl);
              snprintf(last_gh_state, sizeof(last_gh_state), "%s", lbl);
            }
          }

          /*** ClimateIntent controller decision — primary path telemetry ***/
          {
            // T3: the law's label, drying run and fog threshold (climate_law_glue.h), not the
            // mode machine's never-stepped ctl_state.
            ClimateActionDecision climate_decision = climate_law::describe_law_decision(
                legacy, sensor_in, law, law_band, law_in.out_ok, fog_block_reason);
            const char* climate_action = CLIMATE_ACTION_NAMES[climate_decision.climate_action];
            const char* priority_axis = CLIMATE_PRIORITY_AXIS_NAMES[climate_decision.priority_axis];
            // X1 (P1): the assist state, zone and next mist come from the law and mister_step
            // (climate_law::moisture_assist()), not the mode machine's state.
            const bool mister_relay_on =
              id(south_wall_mister).state
              || id(west_wall_mister).state
              || id(center_mister).state;
            const int pulse_zone = id(mister_pulse_zone);
            const climate_law::MoistureAssist assist = climate_law::moisture_assist(
                law.mist, mister_relay_on,
                pulse_zone == 1 ? "south" : pulse_zone == 2 ? "west" : pulse_zone == 3 ? "center" : "none",
                mister_law_now);
            const char* effective_moisture_state = assist.state;
            const char* effective_moisture_zone = assist.zone;
            const float effective_next_mist_s = assist.next_mist_s;
            climate_decision.next_mist_eligible_s = assist.next_mist_s;
            char temp_error[24];
            char vpd_error[24];
            char fog_margin[24];
            char next_mist[24];
            char resource_cost[112];
            // #963: compact v1 keys expand to the unchanged estimator schema
            // in the ingestor. The buffer caps every published HA state at255.
            char moisture_exchange[256];
            snprintf(temp_error, sizeof(temp_error), "%.2f", climate_decision.temp_error_f);
            snprintf(vpd_error, sizeof(vpd_error), "%.3f", climate_decision.vpd_error_kpa);
            snprintf(fog_margin, sizeof(fog_margin), "%.3f", climate_decision.fog_margin_kpa);
            if(effective_next_mist_s >= 0.0f) {
              snprintf(next_mist, sizeof(next_mist), "%.0f", effective_next_mist_s);
            } else {
              snprintf(next_mist, sizeof(next_mist), "none");
            }
            snprintf(resource_cost, sizeof(resource_cost),
                     "{\"water_gal\":%.3f,\"electric_kwh\":%.3f,\"gas_therm\":%.3f}",
                     climate_decision.resource_cost_estimate.water_gal,
                     climate_decision.resource_cost_estimate.electric_kwh,
                     climate_decision.resource_cost_estimate.gas_therm);
            // #410 canonical names remain settled after wire expansion:
            // vh = vent_held_vpd_gain_kpa; hr = hold_required.
            const int moisture_exchange_len = snprintf(moisture_exchange, sizeof(moisture_exchange),
                     "{\"_mx\":1,\"a\":\"%s\",\"r\":\"%s\",\"vg\":%.3f,"
                     "\"vh\":%.3f,"
                     "\"hg\":%.3f,\"of\":%s,"
                     "\"oa\":%u,"
                     "\"vo\":%s,\"hc\":%s,"
                     "\"hr\":%s,"
                     "\"ha\":%s,\"ht\":%.0f}",
                     climate_decision.moisture_exchange_action,
                     climate_decision.moisture_exchange_reason,
                     climate_decision.moisture_vent_vpd_gain_kpa,
                     climate_decision.moisture_vent_held_vpd_gain_kpa,
                     climate_decision.moisture_heat_vpd_gain_kpa,
                     climate_decision.moisture_outdoor_fresh ? "true" : "false",
                     sensor_in.outdoor_data_age_s,
                     climate_decision.moisture_vent_overcools ? "true" : "false",
                     climate_decision.moisture_heat_assist_corun ? "true" : "false",
                     climate_decision.moisture_hold_required ? "true" : "false",
                     climate_decision.moisture_heat_assist_active ? "true" : "false",
                     float(climate_decision.moisture_heat_assist_timer_ms) / 1000.0f);
            if(moisture_exchange_len < 0
               || static_cast<size_t>(moisture_exchange_len) >= sizeof(moisture_exchange)) {
              ESP_LOGE("climate", "Moisture-exchange telemetry truncated: required=%d capacity=%u",
                moisture_exchange_len, unsigned(sizeof(moisture_exchange)));
              // Do not publish partial JSON or retain stale detail as current.
              snprintf(moisture_exchange, sizeof(moisture_exchange),
                "{\"raw\":\"moisture_exchange_payload_unavailable\"}");
            }
            const uint32_t climate_diag_now_ms = millis();
            static uint32_t last_climate_continuous_diag_ms = 0;
            static uint32_t last_climate_band_diag_ms = 0;
            static uint32_t last_consumed_band_evidence_ms = 0;
            const bool climate_continuous_diag_due = last_climate_continuous_diag_ms == 0
              || (climate_diag_now_ms - last_climate_continuous_diag_ms) >= 60000UL;
            const bool climate_band_diag_due = last_climate_band_diag_ms == 0
              || (climate_diag_now_ms - last_climate_band_diag_ms) >= 300000UL;

            const bool consumed_band_evidence_due = last_consumed_band_evidence_ms == 0
              || (climate_diag_now_ms - last_consumed_band_evidence_ms) >= 15000UL;
            // Fresh computed evidence has a 30s source contract. Keep its six
            // consumed Setpoints, branch and sample clock in one 15s batch;
            // publish the marker last. This does not request API cached state.
            if (consumed_band_evidence_due) {
              id(gh_consumed_temp_low_f).publish_state(setpts.temp_low);
              id(gh_consumed_temp_high_f).publish_state(setpts.temp_high);
              id(gh_consumed_vpd_low_kpa).publish_state(setpts.vpd_low);
              id(gh_consumed_vpd_high_kpa).publish_state(setpts.vpd_high);
              id(gh_house_temp_target).publish_state(setpts.temp_target);
              id(gh_house_vpd_target).publish_state(setpts.vpd_target);
              id(gh_band_source).publish_state(band_source_name(band_source));
              id(gh_consumed_band_sample_epoch).publish_state(
                band_clock_trusted ? std::to_string(sntp_now.timestamp) : "");
              last_consumed_band_evidence_ms = climate_diag_now_ms;
            }

            // ── Firmware-v2 EVIDENCE SURFACE (per-zone bands + solar) ─────────
            // Compute the per-zone VPD bands on-chip from the NVS anchor curves
            // at the current solar phase, score each zone's delta-to-target,
            // run the priority arbiter, and publish the new-architecture
            // telemetry so the dispatcher/DB can verify the data is flowing.
            // Keep slowly varying solar/per-zone/wet/delta diagnostics at five
            // minutes; consumed Setpoints evidence has its own fresh cadence.
            if (climate_band_diag_due) {
              auto zcurve = [&](float sr, float sm, float ss, float mid) -> float {
                BandAnchors a = {sr, sm, ss, mid};
                return band_value_at_phase(a, cl_phase);
              };
              ZoneBand zb[ZONE_COUNT];
              zb[ZONE_CENTER] = zone_band_at_phase({id(zone_vpd_target_center_sr),id(zone_vpd_target_center_sm),id(zone_vpd_target_center_ss),id(zone_vpd_target_center_mid)}, id(zone_vpd_width_below_center), id(zone_vpd_width_above_center), cl_phase);
              zb[ZONE_SOUTH]  = zone_band_at_phase({id(zone_vpd_target_south_sr),id(zone_vpd_target_south_sm),id(zone_vpd_target_south_ss),id(zone_vpd_target_south_mid)}, id(zone_vpd_width_below_south), id(zone_vpd_width_above_south), cl_phase);
              zb[ZONE_WEST]   = zone_band_at_phase({id(zone_vpd_target_west_sr),id(zone_vpd_target_west_sm),id(zone_vpd_target_west_ss),id(zone_vpd_target_west_mid)}, id(zone_vpd_width_below_west), id(zone_vpd_width_above_west), cl_phase);
              zb[ZONE_EAST]   = zone_band_at_phase({id(zone_vpd_target_east_sr),id(zone_vpd_target_east_sm),id(zone_vpd_target_east_ss),id(zone_vpd_target_east_mid)}, id(zone_vpd_width_below_east), id(zone_vpd_width_above_east), cl_phase);
              // Zone VPD readings resolved as zone choice resolves them (F8): own
              // probe while fresh, else peers, else house; center → house.
              float zvpd[ZONE_COUNT];
              for (int z = 0; z < ZONE_COUNT; z++) zvpd[z] = zone_vpd_with_fallback(ZoneId(z), zp, VPD, now_ms).vpd_kpa;
              ZoneWetIntent zi[ZONE_COUNT];
              for (int z = 0; z < ZONE_COUNT; z++) zi[z] = zone_wet_intent(zvpd[z], zb[z]);
              const int prank[ZONE_COUNT] = { id(zone_priority_center), id(zone_priority_south), id(zone_priority_west), id(zone_priority_east) };
              const bool zact[ZONE_COUNT] = { true, true, true, false };  // EAST has no mister relay
              const int won = arbitrate_wet_zone(zi, prank, zact);
              // Publish solar + house targets/deltas + per-zone target/delta.
              id(gh_solar_phase).publish_state(sv2_phase);
              id(gh_solar_sunrise_min).publish_state(sv2_solar.sunrise_min);
              id(gh_solar_noon_min).publish_state(sv2_solar.solar_noon_min);
              id(gh_solar_sunset_min).publish_state(sv2_solar.sunset_min);
              id(gh_house_temp_delta).publish_state(Tin - setpts.temp_target);
              id(gh_house_vpd_delta).publish_state(VPD - setpts.vpd_target);
              id(gh_zone_vpd_target_center).publish_state(zb[ZONE_CENTER].target);
              id(gh_zone_vpd_target_south).publish_state(zb[ZONE_SOUTH].target);
              id(gh_zone_vpd_target_west).publish_state(zb[ZONE_WEST].target);
              id(gh_zone_vpd_target_east).publish_state(zb[ZONE_EAST].target);
              id(gh_zone_vpd_delta_center).publish_state(zvpd[ZONE_CENTER] - zb[ZONE_CENTER].target);
              id(gh_zone_vpd_delta_south).publish_state(std::isfinite(zvpd[ZONE_SOUTH]) ? zvpd[ZONE_SOUTH] - zb[ZONE_SOUTH].target : NAN);
              id(gh_zone_vpd_delta_west).publish_state(std::isfinite(zvpd[ZONE_WEST]) ? zvpd[ZONE_WEST] - zb[ZONE_WEST].target : NAN);
              id(gh_zone_vpd_delta_east).publish_state(std::isfinite(zvpd[ZONE_EAST]) ? zvpd[ZONE_EAST] - zb[ZONE_EAST].target : NAN);
              id(gh_zone_wet_granted).publish_state(won < 0 ? "none" : ZONE_NAMES[won]);
              last_climate_band_diag_ms = climate_diag_now_ms;
            }

            static char last_climate_action[48] = "";
            if(strcmp(last_climate_action, climate_action) != 0){
              id(gh_climate_action).publish_state(climate_action);
              snprintf(last_climate_action, sizeof(last_climate_action), "%s", climate_action);
            }
            static char last_climate_priority_axis[24] = "";
            if(strcmp(last_climate_priority_axis, priority_axis) != 0){
              id(gh_climate_priority_axis).publish_state(priority_axis);
              snprintf(last_climate_priority_axis, sizeof(last_climate_priority_axis), "%s", priority_axis);
            }
            static char last_climate_candidate_summary[160] = "";
            if(strcmp(last_climate_candidate_summary, climate_decision.candidate_summary) != 0){
              id(gh_climate_candidate_summary).publish_state(climate_decision.candidate_summary);
              snprintf(last_climate_candidate_summary, sizeof(last_climate_candidate_summary), "%s", climate_decision.candidate_summary);
            }
            static char last_climate_moisture_state[24] = "";
            if(strcmp(last_climate_moisture_state, effective_moisture_state) != 0){
              id(gh_climate_moisture_assist_state).publish_state(effective_moisture_state);
              snprintf(last_climate_moisture_state, sizeof(last_climate_moisture_state), "%s", effective_moisture_state);
            }
            static char last_climate_moisture_zone[24] = "";
            if(strcmp(last_climate_moisture_zone, effective_moisture_zone) != 0){
              id(gh_climate_moisture_zone).publish_state(effective_moisture_zone);
              snprintf(last_climate_moisture_zone, sizeof(last_climate_moisture_zone), "%s", effective_moisture_zone);
            }
            static char last_climate_temp_error[24] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_temp_error, temp_error) != 0){
              id(gh_climate_temp_error_f).publish_state(temp_error);
              snprintf(last_climate_temp_error, sizeof(last_climate_temp_error), "%s", temp_error);
            }
            static char last_climate_vpd_error[24] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_vpd_error, vpd_error) != 0){
              id(gh_climate_vpd_error_kpa).publish_state(vpd_error);
              snprintf(last_climate_vpd_error, sizeof(last_climate_vpd_error), "%s", vpd_error);
            }
            static char last_climate_fog_margin[24] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_fog_margin, fog_margin) != 0){
              id(gh_climate_fog_margin_kpa).publish_state(fog_margin);
              snprintf(last_climate_fog_margin, sizeof(last_climate_fog_margin), "%s", fog_margin);
            }
            static char last_climate_fog_block[48] = "";
            if(strcmp(last_climate_fog_block, climate_decision.fog_block_reason) != 0){
              id(gh_climate_fog_block_reason).publish_state(climate_decision.fog_block_reason);
              snprintf(last_climate_fog_block, sizeof(last_climate_fog_block), "%s", climate_decision.fog_block_reason);
            }
            static char last_climate_resource_cost[112] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_resource_cost, resource_cost) != 0){
              id(gh_climate_resource_cost_estimate).publish_state(resource_cost);
              snprintf(last_climate_resource_cost, sizeof(last_climate_resource_cost), "%s", resource_cost);
            }
            static char last_climate_next_mist[24] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_next_mist, next_mist) != 0){
              id(gh_climate_next_mist_eligible_s).publish_state(next_mist);
              snprintf(last_climate_next_mist, sizeof(last_climate_next_mist), "%s", next_mist);
            }
            static char last_climate_moisture_exchange[256] = "";
            if(climate_continuous_diag_due && strcmp(last_climate_moisture_exchange, moisture_exchange) != 0){
              // #963: HA gets a short action; the ingestor retains the exact
              // structured payload through a default-disabled native entity.
              id(gh_climate_moisture_exchange).publish_state(climate_decision.moisture_exchange_action);
              id(gh_climate_moisture_exchange_details).publish_state(moisture_exchange);
              snprintf(last_climate_moisture_exchange, sizeof(last_climate_moisture_exchange), "%s", moisture_exchange);
            }
            if(climate_continuous_diag_due){
              last_climate_continuous_diag_ms = climate_diag_now_ms;
            }
          }

          /*** OBS-1e — Silent-override audit (Sprint 16) ***/
          // C-m6 (package 4.3): the tags of the old mode machine's gates (fog RH/temp/window
          // gates, relief cycles, seal and summer-vent gates, the VPD dry override, fog heat
          // assist) are gone with it. Two still act under the law: the occupancy inhibit holding
          // a wet request back, and a vent assist the label serves (fog or a mister with the vent).
          {
            char obuf[224]; obuf[0] = '\0'; size_t n = 0;
            auto add = [&](const char* tag){
              if(n > 0 && n + 1 < sizeof(obuf)) obuf[n++] = ',';
              size_t len = strlen(tag);
              if(n + len < sizeof(obuf)){ memcpy(obuf + n, tag, len); n += len; }
            };
            if(occupancy_moisture_block && (law.fog || law.mist)) add("occupancy_blocks_equipment");
            if(legacy.action == CLIMATE_VENT_COOL_FOG_ASSIST || legacy.action == CLIMATE_VENT_COOL_MIST_ASSIST)
              add("vent_mist_assist");
            obuf[n] = '\0';
            const char* overrides = n > 0 ? obuf : "none";
            static char last_overrides[224] = "";
            if(strcmp(last_overrides, overrides) != 0){
              id(gh_overrides).publish_state(overrides);
              snprintf(last_overrides, sizeof(last_overrides), "%s", overrides);
            }

            // fog_block_reason: the ladder computed with the label above (T3).
            static char last_fog_block_reason[64] = "";
            if(strcmp(last_fog_block_reason, fog_block_reason) != 0){
              id(gh_fog_block_reason).publish_state(fog_block_reason);
              snprintf(last_fog_block_reason, sizeof(last_fog_block_reason), "%s", fog_block_reason);
            }
          }

          // Sprint-15.1 fix 8: publish mode_reason. The literal is owned
          // by determine_mode() (short static C string, no heap). Guard
          // against nullptr so an unknown branch never crashes the publish.
          {
            // Phase 3: boot grace `init`, no indoor temperature `sensor_fault` (as phase 2),
            // otherwise `law` (contract phase3-entities).
            const char* reason = boot_wait ? "init" : (mode == SENSOR_FAULT ? "sensor_fault" : "law");
            const char* safe_reason = reason ? reason : "unknown";
            static char last_mode_reason[48] = "";
            if(strcmp(last_mode_reason, safe_reason) != 0){
              id(gh_mode_reason).publish_state(safe_reason);
              snprintf(last_mode_reason, sizeof(last_mode_reason), "%s", safe_reason);
            }
          }

          // SAF-1 / SF1: surface the sensor-degraded fallback to operators so a
          // single-probe loss (avg probes down, running on the case-probe/
          // fabricated value with VPD-chasing suppressed) is visible, not
          // silent. Only publish on change.
          {
            static int last_degraded = -1;
            const int degraded_now = sensor_in.sensor_degraded ? 1 : 0;
            if(degraded_now != last_degraded){
              id(sensor_degraded_active).publish_state((float)degraded_now);
              last_degraded = degraded_now;
              if(degraded_now)
                ESP_LOGW("sensor","DEGRADED — avg probes down; VPD-chasing suppressed, timed wetting after 300 s");
              else
                ESP_LOGI("sensor","Sensor-degraded cleared — VPD control restored");
            }
          }

          /*** AI-control diagnostics — requested vs served actuator paths ***/
          {
            // X6 (P3): keyed on the published label and the law's wet request after the
            // dew-point margin (AG2: the gated law_request, as the relays and the engine read it).
            const bool wet_on = id(fog_rly)->state || id(south_wall_mister).state
                || id(west_wall_mister).state || id(center_mister).state;
            const climate_law::VentAssistStatus vent_assist =
                climate_law::vent_assist_status(legacy, id(vent_rly)->state, law_request, wet_on);
            char vent_status[128];
            if(vent_assist == climate_law::VentAssistStatus::kServed) {
              snprintf(vent_status, sizeof(vent_status), "served");
            } else if(vent_assist == climate_law::VentAssistStatus::kBlocked) {
              snprintf(vent_status, sizeof(vent_status), "blocked:%s",
                       law_request.fog && !law_request.mist ? fog_block_reason : moisture_block_reason);
            } else {
              snprintf(vent_status, sizeof(vent_status), "inactive");
            }

            static char last_moisture_block_reason[96] = "";
            if(strcmp(last_moisture_block_reason, moisture_block_reason) != 0){
              id(gh_moisture_block_reason).publish_state(moisture_block_reason);
              snprintf(last_moisture_block_reason, sizeof(last_moisture_block_reason), "%s", moisture_block_reason);
            }

            static char last_direct_wet_zone_mask[48] = "";
            if(strcmp(last_direct_wet_zone_mask, direct_wet_zone_mask) != 0){
              id(gh_direct_wet_zone_mask).publish_state(direct_wet_zone_mask);
              snprintf(last_direct_wet_zone_mask, sizeof(last_direct_wet_zone_mask), "%s", direct_wet_zone_mask);
            }

            static char last_vent_status[128] = "";
            if(strcmp(last_vent_status, vent_status) != 0){
              id(gh_vent_mist_assist_status).publish_state(vent_status);
              snprintf(last_vent_status, sizeof(last_vent_status), "%s", vent_status);
            }
          }

          /*** OBS-3 — Relief-cycle state exposure (Sprint 18) ***/
          {
            static uint8_t ctl_diag_ctr = 59;
            if(++ctl_diag_ctr >= 60){
              ctl_diag_ctr = 0;
              id(ctl_relief_cycle_count).publish_state((float)ctl_state.relief_cycle_count);
              id(ctl_vent_latch_timer_s).publish_state((float)(ctl_state.vent_latch_timer_ms / 1000));
              id(ctl_sealed_timer_s).publish_state((float)(ctl_state.sealed_timer_ms / 1000));
              id(ctl_vpd_watch_timer_s).publish_state((float)(ctl_state.vpd_watch_timer_ms / 1000));
              id(ctl_mist_backoff_timer_s).publish_state((float)(ctl_state.mist_backoff_timer_ms / 1000));
              id(ctl_vent_mist_assist_active).publish_state(ctl_state.vent_mist_assist_active ? 1.0f : 0.0f);
            }
          }

          /*** A1 — State transition logging ***/
          {
            static Mode prev_log_mode = IDLE;
            static MistStage prev_log_mist = MIST_WATCH;
            if(mode != prev_log_mode || (mode == SEALED_MIST && ctl_state.mist_stage != prev_log_mist)){
              char trans[80];
              auto hm = id(sntp_time).now();
              if(hm.is_valid()){
                snprintf(trans, sizeof(trans), "%s→%s @ %02d:%02d",
                         lbl, lbl, hm.hour, hm.minute);
              }else{
                snprintf(trans, sizeof(trans), "→%s", lbl);
              }
              ESP_LOGI("transition","State change: %s", trans);
              id(ts_last_transition).publish_state(trans);
              prev_log_mode = mode;
              prev_log_mist = ctl_state.mist_stage;
            }
          }

          /*** B5 — forensic DLI proxy accumulation (real elapsed time) ***/
          {
            // #295: a circuit flagged out_of_service emits no light, so its
            // switch-ON state must NOT credit supplemental DLI (phantom-DLI
            // suppression — the dead west grow circuit was self-deceivingly
            // crediting 0.4515 mol/m²/h with dark fixtures).
            const float dli_dt_s = raw_dt_ms > 0
              ? (float)raw_dt_ms / 1000.0f
              : 0.0f;
            id(dli_accumulator) += lighting_dli_increment(
              id(greenhouse_light_lux).state,
              id(tempest_lux),
              id(grow_light_main).state,
              id(grow_light_grow).state,
              dli_dt_s,
              id(gl_main_out_of_service),
              id(gl_grow_out_of_service));
          }

          /*** B6 — Per-circuit lighting state machines (evaluate 5s; publish 60s/change) ***/
          {
            static LightingState gl_main_state = initial_lighting_state();
            static LightingState gl_grow_state = initial_lighting_state();
            static bool prev_main_want_on = false;
            static bool prev_grow_want_on = false;
            static const char* prev_main_reason = "init";
            static const char* prev_grow_reason = "init";
            auto publish_lighting_epoch = [](auto *sensor, time_t epoch){
              char buf[24];
              snprintf(buf, sizeof(buf), "%lld", (long long)epoch);
              sensor->publish_state(buf);
            };

            const bool lighting_heartbeat_due = (now_ms - id(gl_last_check_ms)) >= 60000;
            auto time = id(sntp_time).now();
            if(!time.is_valid()){
              if(id(grow_light_main).state){
                id(grow_light_main).turn_off();
                ESP_LOGW("grow_light","main OFF: time_invalid");
              }
              if(id(grow_light_grow).state){
                id(grow_light_grow).turn_off();
                ESP_LOGW("grow_light","grow OFF: time_invalid");
              }
              const bool changed = prev_main_want_on || prev_grow_want_on
                || strcmp(prev_main_reason, "time_invalid") != 0
                || strcmp(prev_grow_reason, "time_invalid") != 0;
              if(lighting_heartbeat_due || changed){
                id(gl_main_state_text).publish_state("OFF");
                id(gl_main_reason).publish_state("time_invalid");
                id(gl_grow_state_text).publish_state("OFF");
                id(gl_grow_reason).publish_state("time_invalid");
                id(gl_main_decision_epoch).publish_state("invalid");
                id(gl_grow_decision_epoch).publish_state("invalid");
                id(gl_last_check_ms) = now_ms;
              }
              prev_main_want_on = false;
              prev_grow_want_on = false;
              prev_main_reason = "time_invalid";
              prev_grow_reason = "time_invalid";
            } else {
              float exterior_lux = id(tempest_lux);
              uint32_t tempest_age_s = 99999UL;
              if(id(tempest_last_obs_ms) != 0){
                tempest_age_s = (now_ms - id(tempest_last_obs_ms)) / 1000UL;
              }
              const bool exterior_lux_fresh = !isnan(exterior_lux)
                && tempest_age_s <= (uint32_t)pol(verdify_policy::kPF_outdoor_staleness_max_s, id(outdoor_staleness_max_s));

              float cur_lux = exterior_lux;
              if(isnan(cur_lux)) cur_lux = id(greenhouse_light_lux).state;
              if(isnan(cur_lux)) cur_lux = 0.0f;
              const float lighting_dt_s = dt_ms > 0 ? ((float)dt_ms / 1000.0f) : 0.0f;

              // #295: wire the on-chip solar minute fields so each circuit can
              // solar-phase its photoperiod (sv2_solar is computed earlier in
              // this same 1s lambda). minute-of-day = time.hour:time.minute.
              LightingInputs light_in = {
                .natural_lux = cur_lux,
                .exterior_lux = exterior_lux,
                .exterior_lux_fresh = exterior_lux_fresh,
                .local_hour = time.hour,
                .occupied = id(greenhouse_occupied),
                .local_minute = time.minute,
                .sunrise_min = sv2_solar.sunrise_min,
                .sunset_min = sv2_solar.sunset_min
              };
              LightingSetpoints main_sp = {
                .target_light_minutes = (uint32_t)id(gl_main_target_light_minutes),
                .lux_on_threshold = id(gl_main_lux_threshold),
                .lux_hysteresis = id(gl_main_lux_hysteresis),
                .start_hour = id(gl_main_sunrise_hour),
                .cutoff_hour = id(gl_main_sunset_hour),
                .min_on_ms = (uint32_t)id(gl_main_min_on_s) * 1000UL,
                .min_off_ms = (uint32_t)id(gl_main_min_off_s) * 1000UL,
                .auto_enabled = id(gl_main_auto_enabled),
                .solar_phasing = id(gl_main_solar_phasing),
                .sunrise_offset_min = id(gl_main_sunrise_offset_min),
                .sunset_offset_min = id(gl_main_sunset_offset_min),
                .out_of_service = id(gl_main_out_of_service),
                // #1370: the main (people) light follows occupancy at any hour;
                // grow_sp keeps the photoperiod for the Vandas' dark period.
                .occupancy_any_hour = true
              };
              LightingSetpoints grow_sp = {
                .target_light_minutes = (uint32_t)id(gl_grow_target_light_minutes),
                .lux_on_threshold = id(gl_grow_lux_threshold),
                .lux_hysteresis = id(gl_grow_lux_hysteresis),
                .start_hour = id(gl_grow_sunrise_hour),
                .cutoff_hour = id(gl_grow_sunset_hour),
                .min_on_ms = (uint32_t)id(gl_grow_min_on_s) * 1000UL,
                .min_off_ms = (uint32_t)id(gl_grow_min_off_s) * 1000UL,
                .auto_enabled = id(gl_grow_auto_enabled),
                .solar_phasing = id(gl_grow_solar_phasing),
                .sunrise_offset_min = id(gl_grow_sunrise_offset_min),
                .sunset_offset_min = id(gl_grow_sunset_offset_min),
                .out_of_service = id(gl_grow_out_of_service)
              };

              // #1335: a timed manual switch (manual_override light_*) holds
              // its circuit until the deadline, across a window edge too, then
              // the schedule decides again. An expired deadline is zeroed so a
              // millis() wrap can never make it look active again.
              if(id(gl_main_hold_until_ms) != 0 && !manual_latch_active(id(gl_main_hold_until_ms), now_ms)){
                id(gl_main_hold_until_ms) = 0;
              }
              if(id(gl_grow_hold_until_ms) != 0 && !manual_latch_active(id(gl_grow_hold_until_ms), now_ms)){
                id(gl_grow_hold_until_ms) = 0;
              }
              LightingDecision main_dec = evaluate_lighting_held(
                light_in, main_sp, gl_main_state, id(grow_light_main).state, now_ms, lighting_dt_s,
                id(gl_main_hold_until_ms), id(gl_main_hold_on));
              LightingDecision grow_dec = evaluate_lighting_held(
                light_in, grow_sp, gl_grow_state, id(grow_light_grow).state, now_ms, lighting_dt_s,
                id(gl_grow_hold_until_ms), id(gl_grow_hold_on));

              auto apply_light = [&](const char* label, esphome::switch_::Switch* sw, LightingDecision dec){
                if(dec.want_on && !sw->state){
                  sw->turn_on();
                  ESP_LOGI("grow_light","%s ON: %s | lux=%.0f | exterior=%.0f fresh=%d | light=%.0f/%.0f min | h=%d",
                           label, dec.reason, cur_lux, exterior_lux, exterior_lux_fresh,
                           dec.qualified_light_minutes, dec.target_light_minutes, time.hour);
                } else if(!dec.want_on && sw->state){
                  sw->turn_off();
                  ESP_LOGI("grow_light","%s OFF: %s | lux=%.0f | exterior=%.0f fresh=%d | light=%.0f/%.0f min | h=%d",
                           label, dec.reason, cur_lux, exterior_lux, exterior_lux_fresh,
                           dec.qualified_light_minutes, dec.target_light_minutes, time.hour);
                }
              };
              apply_light("main", id(grow_light_main), main_dec);
              apply_light("grow", id(grow_light_grow), grow_dec);

              const bool main_changed = main_dec.want_on != prev_main_want_on
                || strcmp(prev_main_reason, main_dec.reason) != 0;
              const bool grow_changed = grow_dec.want_on != prev_grow_want_on
                || strcmp(prev_grow_reason, grow_dec.reason) != 0;
              if(lighting_heartbeat_due || main_changed || grow_changed){
                id(gl_main_state_text).publish_state(main_dec.want_on ? "ON" : "OFF");
                id(gl_main_reason).publish_state(main_dec.reason);
                id(gl_grow_state_text).publish_state(grow_dec.want_on ? "ON" : "OFF");
                id(gl_grow_reason).publish_state(grow_dec.reason);
                publish_lighting_epoch(id(gl_main_decision_epoch), time.timestamp);
                publish_lighting_epoch(id(gl_grow_decision_epoch), time.timestamp);
                id(gl_last_check_ms) = now_ms;
              }
              prev_main_want_on = main_dec.want_on;
              prev_grow_want_on = grow_dec.want_on;
              prev_main_reason = main_dec.reason;
              prev_grow_reason = grow_dec.reason;
            }
          }

              // Log a concise summary at debug level. To see these logs,
              // temporarily raise logger.level in the top-level config.
              ESP_LOGD("summary","%s | Tin %.1f°F VPD %.2f kPa | "
                                 "H1:%d H2:%d F1:%d F2:%d Fog:%d Vent:%d",
                       lbl, Tin, VPD,
                       willHeat1, willHeat2, willFan1, willFan2,
                       willFog, willVent);

              {
                static uint8_t state_log_ctr = 11;
                static Mode state_log_mode = IDLE;
                static MistStage state_log_mist = MIST_WATCH;
                bool state_changed = mode != state_log_mode || (mode == SEALED_MIST && ctl_state.mist_stage != state_log_mist);
                if(state_changed || ++state_log_ctr >= 60){
                  state_log_ctr = 0;
                  state_log_mode = mode;
                  state_log_mist = ctl_state.mist_stage;
                  ESP_LOGI("state","Mode=%s Tin=%.1f°F VPD=%.2f kPa", lbl, Tin, VPD);
                }
              }

              // Expose runtime metrics to global variables for HA sensors
              id(runtime_heat1_ms) = R[0].runtime_ms;
              id(runtime_heat2_ms) = R[1].runtime_ms;
              id(runtime_fan1_ms)  = R[2].runtime_ms;
              id(runtime_fan2_ms)  = R[3].runtime_ms;
              id(runtime_fog_ms)   = R[4].runtime_ms;
              id(runtime_vent_ms)  = R[5].runtime_ms;
          gh_record_control_loop_duration_us(micros() - control_loop_started_us);
          gh_note_heap_sample();
          App.feed_wdt();
  ################################################################################
  # Sensor-bus watchdog (phase 2): one restart rule, independent of the clock.
  # Every probe on the bus (case, four walls, exterior intake) stamps
  # last_external_update (millis()) when it answers. When no probe has answered
  # for > id(fallback_window_s) (3600 s), counted from boot if none ever did, the
  # controller restarts, so at most once an hour (sensor_bus_restart_due(),
  # lib/running_alone.h; unsigned millisecond arithmetic, wrap-safe).
  # Doubly blind (no valid indoor temperature and no outdoor reading; RULINGS
  # Q2, U1): restart after 10 minutes the first time, then every 60 minutes while
  # it lasts (doubly_blind_restart_step()); the 10-minute window comes back only
  # after 60 minutes of readings (X2), and never while water runs (X3). Every
  # climate relay is already off then.
  # Both restarts go through App.safe_reboot() (RULINGS Q1), which runs
  # on_shutdown and saves the relay counters; esp_restart() skipped it.
  ################################################################################
  - interval: 60s
    then:
      - lambda: |-
          static DoublyBlindRestart blind_restart;
          const int8_t blind = id(doubly_blind_state);
          const uint32_t blind_window_ms =
              id(doubly_blind_restarted) ? DOUBLY_BLIND_REPEAT_RESTART_MS : DOUBLY_BLIND_FIRST_RESTART_MS;
          // X3: never while water runs: a wet relay open, or an irrigation run active
          // (the engine's grants, a drip, a fog run-once); retried at the next tick.
          const bool water_busy = id(fog_rly)->state || id(center_mister).state
              || id(south_wall_mister).state || id(south_wall_mister_fertilized).state
              || id(west_wall_mister).state || id(west_wall_mister_fertilized).state
              || id(wall_drips).state || id(wall_drips_fertilized).state
              || id(center_drips).state || id(center_drips_fertilized).state
              || id(fertilizer_master_valve).state
              || id(irr_grant_mask) != 0 || irr_drip_active() || irr_fog_run();
          if (doubly_blind_restart_step(blind_restart, id(doubly_blind_restarted), blind >= 0, blind == 1, millis(),
                                        water_busy)) {
            ESP_LOGE("watchdog", "No indoor temperature and no outdoor reading for more than %u s - restarting",
                     unsigned(blind_window_ms / 1000u));
            App.safe_reboot();
            return;
          }
          if(sensor_bus_restart_due(millis(), id(last_external_update), id(fallback_window_s) * 1000UL)){
            ESP_LOGE("watchdog","No probe answered for more than %u s - restarting", id(fallback_window_s));
            App.safe_reboot();
          }


  ################################################################################
  # 14b — IRRIGATION: the irrigation engine (#1160) replaced the job machine.
  #
  # Drips, fertilizer runs, scheduled mist windows and run-now run in the 5 s
  # engine loop of greenhouse/irrigation_engine.yaml (lib/irrigation_program.h);
  # every wet relay opens only with its bit in irr_grant_mask (hardware.yaml).
  # The climate path above reads the engine through irr_drip_active(),
  # irr_l03_hold(), irr_saf4_tripped() and irr_climate_zone_allowed() (F6: one
  # rule per mister zone), asks for the mist manifold with
  # irr_vpd_grant()/irr_vpd_release() for any VPD-member zone, runs the D-IRP-19
  # mister watchdog (irr_mister_watchdog(), F10) each second, and never closes a
  # relay the engine's own run holds. leak_detected holds and cancels nothing (Q-05).
  ################################################################################

################################################################################
# HEAP PROFILE — low-rate fallback fragmentation telemetry.
################################################################################
  - interval: 900s
    startup_delay: 900s
    then:
      - lambda: |-
          const float free_kb = gh_free_heap_kb();
          const float min_free_kb = gh_min_free_heap_kb();
          const float largest_kb = gh_largest_free_heap_block_kb();
          const uint32_t loop_last_us = gh_control_loop_last_us();
          const uint32_t loop_max_us = gh_take_control_loop_max_us();
          const uint32_t loop_overruns = gh_take_control_loop_overrun_count();
          const bool floor_met = gh_pre_ota_heap_floor_met(free_kb, largest_kb);
          // Global logging stays WARN to protect heap, so this intentionally
          // uses one WARN packet per 15 minutes instead of opening INFO logs.
          const auto api_heap = id(ha_api).heap_snapshot();
          ESP_LOGW("heap_profile",
                   "free=%.1fKB lifetime_min=%.1fKB largest=%.1fKB floor=%s "
                   "loop_last=%uus loop_15m_max=%uus loop_15m_overruns=%u reset=%d api_peers=%u api_rm=%u api_sync=%u api_ov_n=%u api_ov_b=%u api_pending_b=%u api_batch_n=%u api_batch_b=%u api_rx_b=%u api_shared_b=%u",
                   free_kb, min_free_kb, largest_kb, floor_met ? "PASS" : "FAIL",
                   loop_last_us, loop_max_us, loop_overruns, int(esp_reset_reason()),
                   unsigned(api_heap.peers), unsigned(api_heap.removing), unsigned(api_heap.syncing), unsigned(api_heap.overflow_entries), unsigned(api_heap.overflow_bytes), unsigned(api_heap.pending_bytes), unsigned(api_heap.batch_items), unsigned(api_heap.batch_bytes), unsigned(api_heap.rx_bytes), unsigned(api_heap.shared_bytes));
          if(!floor_met || loop_overruns > 0) {
            ESP_LOGW("heap", "Pre-OTA runtime floor violation: heap=%s loop_overruns=%u",
                     floor_met ? "PASS" : "FAIL", loop_overruns);
          }
          // RULINGS W1/W2: the device's partition table, NVS use and flash chip (read-only).
          const char* flash_parts = "";
          const char* flash_nvs = "";
          gh_flash_profile(&flash_parts, &flash_nvs);
          ESP_LOGW("flash_profile", "parts=%s", flash_parts);
          ESP_LOGW("flash_profile", "%s", flash_nvs);

################################################################################
