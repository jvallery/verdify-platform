    id: north_wall_temperature
    name: "North Temp (°F)"
    modbus_controller_id: north_wall_probe
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    device_class: temperature
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: ${modbus_temp_lambda}
    on_value:
      then:
        - lambda: |-
            id(last_external_update) = millis();
            id(last_north_ms) = millis();
  - platform: modbus_controller
