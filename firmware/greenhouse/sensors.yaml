    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: "return x > 110.0f ? NAN : x;"  # 0x7FFF sentinel → NAN
  - platform: template
    id: vpd_north
    name: "North VPD (kPa)"
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      float T  = id(north_wall_temperature).state;
      float RH = id(north_wall_humidity).state;
      if(isnan(T) || isnan(RH)) return NAN;
      ${vpd_lambda}

