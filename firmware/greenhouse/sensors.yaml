    update_interval: 10s
    lambda: |-
      if(isnan(id(average_temperature).state) || isnan(id(average_humidity).state)){
        return id(case_temperature).state;
      }else{
        return id(average_temperature).state;
      }

  - platform: template
    id: control_vpd_kpa
    name: "Control VPD (kPa)"
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float Tin;
      float RHin;
      if(isnan(id(average_temperature).state) || isnan(id(average_humidity).state)){
        Tin = id(case_temperature).state;
        RHin = id(case_humidity).state;
      }else{
        Tin = id(average_temperature).state;
        RHin = id(average_humidity).state;
      }
      float tc=(Tin-32.0f)*5.0f/9.0f;
      float es=0.6108f*expf((17.27f*tc)/(tc+237.3f));
      if(isnan(RHin)) return NAN;
      float vpd = es*(1.0f-RHin/100.0f);
      return vpd < 0.0f ? 0.0f : vpd;

################################################################################
# 7. CONFIGURATION / SET‑POINT OUTPUTS  – entity_category fixed to “diagnostic”
#
# Readback truth decision (tranche 2, #586, audit §8.9): cfg_* readbacks of
# policy wire fields are DEVICE-CONFIRMED TRUTH — while an experiment manifest
# is armed they report the ACTIVE policy value (verdify_policy::policy_read /
# _read_b), i.e. exactly what the control tick consumes; while inactive they
# report the legacy global, unchanged from pre-Lane-E behavior. The
# cfg_first_pull_ok NAN guard applies only to the legacy path: it exists to
# avoid echoing unconfirmed NVS defaults as registry truth, whereas an armed
# policy value is engine truth independent of any registry push, so it is
# never blanked (guards on migrated readbacks are `!cfg_first_pull_ok &&
# !policy_experiment_active()`).
################################################################################

