    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).valid_from};

  - platform: template
    id: dli_valid_to
    name: "DLI Valid To"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {interior_dli_evidence(id(dli_accumulator)).valid_to};

  # Full Unix epochs exceed ESPHome sensor float precision. Publish them as
  # strings and let the ingestor parse exact bigint values.
  - platform: template
    id: controller_time_epoch
    name: "Controller Time Epoch"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto now = id(sntp_time).now();
      if(!now.is_valid()) return {};
      char buf[24];
      snprintf(buf, sizeof(buf), "%lld", (long long)now.timestamp);
      return {buf};

  - platform: template
    id: gl_main_decision_epoch
    name: "GL Main Decision Epoch"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: gl_grow_decision_epoch
    name: "GL Grow Decision Epoch"
    entity_category: diagnostic
    update_interval: never

  # A1: State machine transition logging
  - platform: template
    id: ts_last_transition
    name: "Last State Transition"
    entity_category: diagnostic

  # A2: Per-probe health monitoring. Preserve the earlier 120s warning
  # (aggregate eligibility is 300s); recent NaN/Inf values report INVALID.
  # Case has only temperature/RH; wall probes also require their VPD field.
  # #368: a fresh, finite probe whose temperature stepped more than 6 F between
  # samples reads JUMP for 10 minutes; one whose temperature and RH have not
  # changed for 60 minutes reads FLAT (probe_validity.h). Diagnostic only: no
  # aggregate, zone fallback or SENSOR_FAULT decision reads these words.
  - platform: template
    id: probe_health
    name: "Probe Health"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint32_t now = millis();
      const uint32_t STALE_MS = 120000;
      char result[96];
      size_t n = 0;
      result[0] = '\0';
      struct { const char* name; uint32_t last; bool values_finite; float temp; float rh; } probes[] = {
        {"Case", id(last_case_ms), probe_pair_finite(id(case_temperature).state, id(case_humidity).state), id(case_temperature).state, id(case_humidity).state},
        {"North", id(last_north_ms), probe_triple_finite(id(north_wall_temperature).state, id(north_wall_humidity).state, id(vpd_north).state), id(north_wall_temperature).state, id(north_wall_humidity).state},
        {"West", id(last_west_ms), probe_triple_finite(id(west_wall_temperature).state, id(west_wall_humidity).state, id(vpd_west).state), id(west_wall_temperature).state, id(west_wall_humidity).state},
        {"South", id(last_south_ms), probe_triple_finite(id(south_wall_temperature).state, id(south_wall_humidity).state, id(vpd_south).state), id(south_wall_temperature).state, id(south_wall_humidity).state},
        {"East", id(last_east_ms), probe_triple_finite(id(east_wall_temperature).state, id(east_wall_humidity).state, id(vpd_east).state), id(east_wall_temperature).state, id(east_wall_humidity).state}
      };
      static ProbeTrend trends[5];
      bool all_ok = true;
      auto append = [&](const char* s) {
        while (*s != '\0' && n + 1 < sizeof(result)) {
          result[n++] = *s++;
        }
        result[n] = '\0';
      };
      for(size_t i = 0; i < 5; ++i){
        auto &p = probes[i];
        const bool fresh = probe_sample_fresh(now, p.last, STALE_MS);
        if(!fresh || !p.values_finite){
          trends[i] = ProbeTrend{};
          if(!all_ok) append(", ");
          append(p.name);
          append(fresh ? " INVALID" : " STALE");
          all_ok = false;
          continue;
        }
        const ProbeTrendState trend = probe_trend_update(trends[i], p.temp, p.rh, now);
        if(trend != ProbeTrendState::kOk){
          if(!all_ok) append(", ");
          append(p.name);
          append(trend == ProbeTrendState::kJump ? " JUMP" : " FLAT");
          all_ok = false;
        }
      }
      return all_ok ? std::string("OK") : std::string(result);

