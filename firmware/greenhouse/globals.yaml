###############################################################################
# greenhouse/globals.yaml -- global variables and initial values
#
# Variables declared here reset on reboot unless restore_value is explicitly
# enabled.  Daily counters reset at midnight via the time component.
###############################################################################

globals:

  # ─── Temperature band (°F) ───
  # Wide defaults; the dispatcher pushes the real crop band every planner
  # cycle. If the dispatcher is silent, these permissive values let the
  # safety rails (safety_min_f/safety_max_f below) take over without
  # firmware narrowing to a mid-range guess.
  - id: target_temp_low_f
    type: float
    restore_value: no
    initial_value: '45.0'  # safety_min 40 + 5: the band stays inside the guardrails
  - id: target_temp_high_f
    type: float
    restore_value: no
    initial_value: '95.0'

  # Phase 3 (#1671, rule 7): the drying cost limit, kWh of heat carried out per kg of
  # water. Owner-only; climate_law::dry_cost_limit() clamps it and turns an unreadable
  # value into the compiled default.
  - id: dry_cost_limit
    type: float
    restore_value: yes
    initial_value: '0.7'

  # ─── Humidity / VPD (kPa) ───
  # Wide defaults — see comment on target_temp_low_f.
  - id: target_vpd_low_kpa
    type: float
    restore_value: no
    initial_value: '0.35'
  - id: target_vpd_high_kpa
    type: float
    restore_value: no
    initial_value: '2.80'

  # ─── Economiser (enthalpy thresholds) ───
  - id: site_pressure_hpa
    type: float
    restore_value: no
    initial_value: '840.0'  # adjust to local elevation

  # ─── Fog / evap-assist thresholds ───
  # (removed unused fog_offset_f and AH thresholds)

  # (vent_debounce_ms removed: vent timing enforced via relay min_on/off)

  # ─── Misc state ───
  - id: fan_lead_is_fan1
    type: bool
    restore_value: no
    initial_value: 'true'

  # ─── Watchdog / failsafe ───
  - id: last_external_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: fallback_window_s
    type: uint32_t
    restore_value: no
    initial_value: '3600'
  # Doubly blind restart (RULINGS Q2, doubly_blind_restart_step() in
  # lib/running_alone.h): the control loop's judgement (-1 not judged yet: the
  # boot wait; 0 no; 1 no valid indoor temperature and no outdoor reading), and
  # the flag kept across the restart so the second and later restarts wait 60
  # minutes. It changes only at a doubly blind restart and when a reading returns.
  - id: doubly_blind_state
    type: int8_t
    restore_value: no
    initial_value: '-1'
  - id: doubly_blind_restarted
    type: bool
    restore_value: yes
    initial_value: 'false'

  # ─── Per-probe health timestamps (ms, A2) ───
  - id: last_north_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_west_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_south_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_east_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_case_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Phase 2: the wired exterior intake probe's own sample stamp (millis(), 0 = none
  # since boot), the second outdoor source after the weather station.
  - id: last_intake_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ─── Phase 2: relay start counters and fan run seconds (lifetime) ───
  # Kept in RAM by the control loop and copied here at most once an hour
  # (relay_counters_save_due(), lib/running_alone.h), so flash is written at
  # most hourly. Restored at boot; published as the Relay Counters JSON.
  - id: persist_starts_heat1
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_starts_heat2
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_starts_fan1
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_starts_fan2
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_starts_fog
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_starts_vent
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_fan1_run_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: persist_fan2_run_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  # ─── Controller time failure detection (A3) ───
  - id: sntp_acquired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sntp_failed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sntp_heartbeat_misses
    type: int
    restore_value: no
    initial_value: '0'
  - id: sntp_last_sync_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ─── B13 / M2: CO2 inverted-diurnal fix + plausibility calibration ───
  # The analog CO2 module on GPIO36 outputs a voltage that DECREASES as CO2
  # rises (MG811-style). The old linear `raw_v * K` map therefore produced an
  # INVERTED diurnal: it read LOW at night (when respiration raises CO2 →
  # voltage falls) and HIGH midday (photosynthesis draws CO2 down → voltage
  # rises) — backwards from real plant physiology. The corrected transform is a
  # two-point INVERTED-linear map anchored on (v_lo_ppm @ v at LOW ppm) and
  # (v_hi_ppm @ v at HIGH ppm): ppm falls as voltage rises.
  #
  # IMPORTANT: these anchors are PLACEHOLDERS that only fix the inversion +
  # bound the range. A trustworthy absolute ppm needs a TWO-POINT field
  # calibration against a reference NDIR meter (e.g. fresh-air ~420 ppm and a
  # known elevated point): set co2_cal_v_lo_ppm / co2_cal_v_hi_ppm to the
  # measured ADC voltages at co2_cal_lo_ppm / co2_cal_hi_ppm. Until then the
  # value is directionally correct (de-inverted) but not absolutely accurate —
  # surfaced via the co2_plausible flag.
  - id: co2_cal_lo_ppm
    type: float
    restore_value: no
    initial_value: '400.0'    # reference LOW concentration (fresh-air ~420 ppm)
  - id: co2_cal_hi_ppm
    type: float
    restore_value: no
    initial_value: '2000.0'   # reference HIGH concentration
  - id: co2_cal_v_lo_ppm
    type: float
    restore_value: no
    initial_value: '2.7'      # measured ADC volts AT co2_cal_lo_ppm (HIGH v at LOW ppm; placeholder)
  - id: co2_cal_v_hi_ppm
    type: float
    restore_value: no
    initial_value: '1.2'      # measured ADC volts AT co2_cal_hi_ppm (LOW v at HIGH ppm; placeholder)
  # Plausibility band: a valid CO2 reading for a vented planted greenhouse sits
  # roughly 300–5000 ppm; the raw ADC voltage must also be inside a sane window
  # (a disconnected/short sensor pegs near 0 or rail). Out-of-band → flagged.
  - id: co2_plausible_min_ppm
    type: float
    restore_value: no
    initial_value: '300.0'
  - id: co2_plausible_max_ppm
    type: float
    restore_value: no
    initial_value: '5000.0'
  - id: co2_raw_v_min
    type: float
    restore_value: no
    initial_value: '0.05'     # below this the analog line is likely disconnected/shorted low
  - id: co2_raw_v_max
    type: float
    restore_value: no
    initial_value: '3.2'      # above this the line is likely railed (ADC ~3.3V ceiling at 12db)
  - id: co2_plausible
    type: bool
    restore_value: no
    initial_value: 'true'     # published flag: last CO2 reading inside the plausibility band

  # ─── DLI accumulator (B5) ───
  - id: dli_accumulator
    type: float
    restore_value: no
    initial_value: '0.0'

  # ─── Grow light automation (B6) ───
  # #1477: the shared gl_* lighting globals and gl_auto_enabled are retired.
  - id: gl_last_check_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ─── Per-circuit lighting automation (planner-managed) ───
  - id: gl_main_target_light_minutes
    type: int
    restore_value: no
    initial_value: '960'

  - id: gl_main_sunrise_hour
    type: int
    restore_value: no
    initial_value: '7'

  - id: gl_main_sunset_hour
    type: int
    restore_value: no
    initial_value: '19'

  # Cold-start fallback ONLY — matches the registry default + fn_lighting_circuit_policy
  # default (40000 ON / 8000 hyst => 48000 OFF). The live value is the AI-tunable
  # policy, re-asserted by the dispatcher on every cycle/reconnect; this default
  # just keeps the brief post-reboot window (before the dispatcher reconnects)
  # from cutting grow lights at dawn (the 2026-06-16 incident, where the old
  # 3000/1500 cold default ran for hours after a reboot).
  - id: gl_main_lux_threshold
    type: float
    restore_value: no
    initial_value: '40000.0'

  - id: gl_main_lux_hysteresis
    type: float
    restore_value: no
    initial_value: '8000.0'

  - id: gl_main_min_on_s
    type: int
    restore_value: no
    initial_value: '120'

  - id: gl_main_min_off_s
    type: int
    restore_value: no
    initial_value: '60'

  - id: gl_main_auto_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  # #295: solar-phase the MAIN circuit photoperiod. When enabled, the window
  # anchors to the on-chip sunrise/sunset (sunrise+offset .. sunset+offset)
  # instead of the static gl_main_sunrise_hour/gl_main_sunset_hour. Default OFF
  # ⇒ byte-identical fixed-hour behavior (backward-safe; legacy clock window).
  - id: gl_main_solar_phasing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gl_main_sunrise_offset_min
    type: int
    restore_value: no
    initial_value: '0'

  - id: gl_main_sunset_offset_min
    type: int
    restore_value: no
    initial_value: '0'

  # #295: dead-fixture / phantom-DLI suppression for the MAIN circuit. When the
  # operator flags the fixture dead (shorted/unplugged), the circuit's switch-ON
  # state no longer credits supplemental DLI or accrues qualified light minutes.
  # Default OFF ⇒ unchanged accounting. (Hardware lux/Shelly-PM plausibility
  # check is OUT OF SCOPE — needs hardware; this is the software half of #295.)
  - id: gl_main_out_of_service
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gl_grow_target_light_minutes
    type: int
    restore_value: no
    initial_value: '960'

  - id: gl_grow_sunrise_hour
    type: int
    restore_value: no
    initial_value: '7'

  - id: gl_grow_sunset_hour
    type: int
    restore_value: no
    initial_value: '19'

  # Cold-start fallback ONLY (see gl_main_lux_threshold above) — 40000 ON /
  # 8000 hyst => 48000 OFF, matching the registry + policy default.
  - id: gl_grow_lux_threshold
    type: float
    restore_value: no
    initial_value: '40000.0'

  - id: gl_grow_lux_hysteresis
    type: float
    restore_value: no
    initial_value: '8000.0'

  - id: gl_grow_min_on_s
    type: int
    restore_value: no
    initial_value: '120'

  - id: gl_grow_min_off_s
    type: int
    restore_value: no
    initial_value: '60'

  - id: gl_grow_auto_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  # #295: solar-phasing for the GROW circuit (see gl_main_solar_phasing). OFF by
  # default ⇒ legacy fixed-hour window.
  - id: gl_grow_solar_phasing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gl_grow_sunrise_offset_min
    type: int
    restore_value: no
    initial_value: '0'

  - id: gl_grow_sunset_offset_min
    type: int
    restore_value: no
    initial_value: '0'

  # #295: dead-fixture / phantom-DLI suppression for the GROW (west) circuit —
  # the dead circuit this issue was filed about. Set this while the west grow
  # lights are shorted/unplugged so the dark fixture stops crediting phantom DLI
  # (0.4515 mol/m²/h) and qualified light minutes. Default OFF.
  - id: gl_grow_out_of_service
    type: bool
    restore_value: no
    initial_value: 'false'

  # ─── Direct-wet policy ───
  # #1477: the activity-day mirror globals are retired (nothing read them).
  - id: direct_wet_min_temp_f
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: direct_wet_gate_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: direct_wet_stress_min_dew_margin_f
    type: float
    restore_value: no
    initial_value: '8.0'

  # Retired compatibility state. The commissioned wall sequence never arms a
  # global post-feed hold: fertilizer turns off and wall-local clean flush starts
  # immediately. Kept at zero so older readback consumers remain harmless.
  # feed_hold_until_ms is the millis() deadline (uint32, wrap-aware compare)
  # until which ALL clean wetting is blocked after a fertilizer feed. Armed by
  # the irrigation state machine when a fert job finishes; the post-fert clean
  # flush is relocated to fire AFTER the hold. 0 = no hold armed.
  - id: feed_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Retired fixed-clock feed-window compatibility readbacks. Commissioned wall
  # feed uses the solar scheduler; these values are inert and fixed at zero.
  - id: feed_start_hour
    type: int
    restore_value: no
    initial_value: '0'

  - id: feed_end_hour
    type: int
    restore_value: no
    initial_value: '0'

  # (CYC-4 overnight micro-pulse path DELETED in firmware-v2: night emergency
  # is now `vpd > band_high` via the normal SEALED_MIST path under existing
  # interlocks — the night band edges govern. See contract §B4.)

  # ══════════════════════════════════════════════════════════════════════════
  # FIRMWARE-V2: deterministic solar band engine (contract §B2)
  # ══════════════════════════════════════════════════════════════════════════
  # The dispatcher STOPS pushing temp_low/high & vpd_low/high as control inputs;
  # instead it pushes these NVS-persisted anchors (restore_value: yes →
  # offline-first: one push survives reboot indefinitely). Each cycle
  # controls.yaml reconstructs the served band via band_value_at_phase() from
  # the 4 anchors (SR / solar-noon / SS / solar-midnight) and writes them into
  # the existing Setpoints.temp_low/high/vpd_low/high fields.
  #
  # SINGLE SOURCE OF TRUTH for the band = verdify_schemas/band_defaults.yaml
  # (loaded by the tunable registry, seeded into the DB by migration 177). These
  # initial_values are NOT a third opinion: they are a deliberately DRIER, in-clamp
  # cold-start FAIL-SAFE view of that canonical band (a factory-fresh chip seeds
  # these, then the dispatcher reconciles to the live DB within one cycle). The
  # 2026-06-15 wet-night regression came from a too-WET cold default, so the
  # cold-start must fail to the dry side for the bare-root Vandas. The relationship
  # (firmware vpd_target >= canonical, all anchors within clamps) is CI-enforced by
  # verdify_schemas/tests/test_band_defaults_single_source.py — change the band in
  # band_defaults.yaml, never by hand-editing one store.

  # ─── B2: house TEMPERATURE band anchor curves (°F) ───
  # low / target / high; SR SM SS MID order.
  - id: band_temp_low_sr
    type: float
    restore_value: yes
    initial_value: '60'
  - id: band_temp_low_sm
    type: float
    restore_value: yes
    initial_value: '76'
  - id: band_temp_low_ss
    type: float
    restore_value: yes
    initial_value: '66'
  - id: band_temp_low_mid
    type: float
    restore_value: yes
    initial_value: '62'

  - id: band_temp_target_sr
    type: float
    restore_value: yes
    initial_value: '66'
  - id: band_temp_target_sm
    type: float
    restore_value: yes
    initial_value: '84'
  - id: band_temp_target_ss
    type: float
    restore_value: yes
    initial_value: '73'
  - id: band_temp_target_mid
    type: float
    restore_value: yes
    initial_value: '65'

  - id: band_temp_high_sr
    type: float
    restore_value: yes
    initial_value: '72'
  - id: band_temp_high_sm
    type: float
    restore_value: yes
    initial_value: '86'
  - id: band_temp_high_ss
