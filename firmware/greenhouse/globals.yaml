  # ─── FIRMWARE-V2 new control globals (contract §B4/§B5) ───
  # Master enable for the on-chip deterministic band engine. When ON,
  # controls.yaml drives the band from the anchors above; when OFF, falls back
  # to the dispatcher-pushed target_* fields.
  - id: sw_onchip_band_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Item-3 per-zone arbiter master enable (default OFF). When true, the mister
  # zone selector uses arbitrate_wet_zone (deterministic per-zone band + owner
  # priority) instead of the legacy stress scoring. Ships inert; flip after a
  # corpus zone-distribution review.
  - id: sw_arbiter_zone_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Push-button latch timeout (minutes) for the deadline latches below.
  - id: manual_override_timeout_min
    type: int
    restore_value: yes
    initial_value: '10'

  # ─── B5: manual button deadline latches (epoch-ms deadlines) ───
  # While now_ms < <x>_until_ms the latch is active. restore_value: no — a
  # manual override must NOT survive a reboot. 0 = no latch. Written only by
  # the panel push buttons (greenhouse.yaml), the manual_override service
  # (irrigation_engine.yaml) and the override layer's expiry (controls.yaml),
  # which reads them (VD-47).
  - id: manual_fans_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: manual_fog_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: vent_bypass_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # #1335: the per-circuit manual light holds. API-20's timed switch sends
  # manual_override light_<main|grow>_<on|off> with its minutes, which sets the
  # deadline and the held state; light_<main|grow>_auto (Back to automatic)
  # zeroes the deadline. controls.yaml's lighting block holds the circuit while
  # the deadline is ahead and zeroes it once it passes. Not restored: a hold
  # never survives a reboot.
  - id: gl_main_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: gl_main_hold_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gl_grow_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: gl_grow_hold_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # ─── Daily ON-cycle counters (reset at midnight) ───
  - id: cnt_fan1_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_fan2_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_heat1_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_heat2_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_fog_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_vent_today
    type: int
    restore_value: no
    initial_value: '0'

  # Sprint-7: per-zone mister + drip cycle counters. Incremented at rising
  # edge in turn_on_zone() and the irrigation dispatch. Closes the audit
  # gap where fan/heat/fog/vent had cycle counters but irrigation relays
  # only had runtime. The ingestor-side comparison view pairs these with
  # equipment_state-derived counts to detect firmware/db drift.
  - id: cnt_mister_south_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_mister_west_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_mister_center_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_drip_wall_today
    type: int
    restore_value: no
    initial_value: '0'
  - id: cnt_drip_center_today
    type: int
    restore_value: no
    initial_value: '0'

  # ─── Runtime metrics (ms since midnight) ───
  # These values accumulate the total on‑time for each relay in milliseconds.
  # They are reset to 0 at local midnight and updated each control loop.
  - id: runtime_heat1_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: runtime_heat2_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: runtime_fan1_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: runtime_fan2_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: runtime_fog_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: runtime_vent_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # fog_closes_vent: when true, the vent damper is forced closed during active
  # fog pulses to prevent dry outside air from negating humidity gains.
  - id: fog_closes_vent
    type: bool
    restore_value: no
    initial_value: 'true'

    # ─── Mister state machine (HUMID_S2/S3) ───
  - id: mister_state
    type: int
    restore_value: no
    initial_value: '0'
    # 0=off, 1=HUMID_S2 (targeted), 2=HUMID_S3 (all zones)

  - id: mister_selected_zone
    type: int
    restore_value: no
    initial_value: '0'
    # 0=none, 1=south_wall, 2=west_wall, 3=center

  - id: mister_duty_phase
    type: int
    restore_value: no
    initial_value: '0'
    # 0=idle, 1=ON, 2=OFF (evaporation dwell)

  - id: mister_duty_timer_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: humid_s1_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: humid_s2_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: humid_idle_holdoff_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Gallons today through the misters and fog: a mirror of the irrigation engine's RTC block
  # (centi-gallons / 100), which SAF-4 and the soft budget read. The block keeps it across a
  # soft reset and zeroes it on a new local day (#1160).
  - id: mister_water_today
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: mister_engage_delay_s
    type: int
    restore_value: no
    initial_value: '45'

  - id: mister_on_s
    type: int
    restore_value: no
    initial_value: '300'

  - id: mister_off_s
    type: int
    restore_value: no
    initial_value: '600'

  - id: mister_all_on_s
    type: int
    restore_value: no
    initial_value: '480'

  - id: mister_all_off_s
    type: int
    restore_value: no
    initial_value: '420'

  # #1641, decision 11: the soft water budget is kept across a restart (it was
  # 300 again after every boot until the dispatcher pushed it).
  - id: mister_water_budget_gal
    type: float
    restore_value: yes
    initial_value: '300.0'

  # ─── IRR-2: mister VPD hysteresis floor (kPa) ───
  # Raises the MISTER_HYST floor from the legacy 0.05 to 0.10 so the climate
  # mister state machine cannot chatter inside a tight band. The effective
  # hysteresis is still capped by the band width (band_vpd_hysteresis) and the
  # engage-kPa-derived term; this is only the lower bound.
  - id: mister_hysteresis_kpa
    type: float
    restore_value: no
    initial_value: '0.10'

  # ─── Mister runtime counters ───
  # Mirrors of the irrigation engine's RTC block (zone seconds x 1000: south is L07 + L08,
  # west L09 + L10, center L04), written each engine tick. The block zeroes them on a new
  # local day and keeps them across a soft reset (#1160).
  - id: runtime_mister_south_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: runtime_mister_west_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: runtime_mister_center_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ─── Per-zone last-fire timestamps (ms, sprint-2 fairness watchdog) ───
  # Stamped by turn_on_zone() in controls.yaml. select_overdue_zone() reads
  # these to steer misting to stressed zones the scoring formula would
  # otherwise under-serve. `0` means "never fired since boot" — handled
  # naturally by `now_ms - 0 == now_ms` which only exceeds the 10 min
  # fairness window after 10 min of uptime.
  - id: last_fire_south_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_fire_west_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_fire_center_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Per-zone last turn-OFF stamp (ms). Powers the mister re-fire dwell fence
  # (mister_min_off_s): a zone may not re-energize within mister_min_off_s of
  # its own last off, collapsing sub-gap chatter without touching zone choice.
  - id: last_off_south_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_off_west_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_off_center_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Daily counter of fairness-watchdog overrides (reset at midnight).
  - id: cnt_mister_fairness_overrides_today
    type: int
    restore_value: no
    initial_value: '0'

  # ─── Irrigation engine (#1160) ───
  # The engine grant (F5): bit = device_idx (L01 = 0 to L10 = 9). Written only by the
  # irrigation engine (lib/irrigation_engine_esphome.h): it sets a bit before the relay's
  # turn_on() and clears it after the turn_off(); a climate VPD pulse gets its bit through
  # irr_vpd_grant(). Every wet relay guard in hardware.yaml refuses an ON without its bit.
  # Fog (fog_rly) is climate only and outside the grant.
  - id: irr_grant_mask
    type: uint16_t
    restore_value: no
    initial_value: '0'

  # Daily irrigation runtime counters: mirrors of the irrigation engine's RTC block
  # (L01, L05 and L03 seconds x 1000), zeroed by the block on a new local day (#1160).
  - id: runtime_wall_drip_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: runtime_center_drip_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: runtime_fert_master_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ─── Mister pulse-rotation model ───
  - id: mister_pulse_zone
    type: int
    restore_value: no
    initial_value: '0'

  - id: mister_pulse_timer_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mister_rotation_index
    type: int
    restore_value: no
    initial_value: '0'

  # Mister re-fire dwell floor (s). A zone may not re-energize within this of
  # its own last turn-off — suppresses the sub-gap on/off chatter the misters
  # (uniquely among relays) had no min-on/off protection against. Default 45s
  # == the designed pulse gap, so it only fences re-fires FASTER than the
  # intended cadence (never extends a normal pulse / never over-waters).
  # Planner-tunable for cycling reduction; firmware-clamped to a sane minimum.
  - id: mister_min_off_s
    type: int
    restore_value: no
    initial_value: '45'

  # Item-4 night-dry lever: planner-pushable VPD bias added to the overnight band
  # (clamped 0..0.25 kPa, smooth sin^2 weight peaking at solar midnight). Lets the
  # AI pre-empt a humid night without touching the crop_band_anchors curve.
  - id: night_vpd_bias_kpa
    type: float
    restore_value: no
    initial_value: '0.0'

  # Fog safety gates
  - id: fog_rh_ceiling_pct
    type: int
    restore_value: no
    initial_value: '90'

  - id: fog_min_temp_f
    type: int
    restore_value: no
    initial_value: '55'

  - id: mister_closes_vent
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: mister_vpd_at_start
    type: float
    restore_value: no
    initial_value: 'NAN'

  # ─── Legacy pulled outdoor data fallback ───
  - id: pulled_outdoor_temp_f
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: pulled_outdoor_rh_pct
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: pulled_data_age_s
    type: uint32_t
    restore_value: no
    initial_value: '99999'  # Start stale; direct Tempest is primary.

  # Sprint-14: gate cfg_* readback publishes until the first direct band push
  # lands. Without this gate, cfg_* sensors publish the
  # firmware-default globals at boot (before the dispatcher has pushed
  # real values) and the resulting rows poison setpoint_snapshot
  # analytics (observed: min=0 for temp_high/vpd_low/safety_* across
  # the 30-day trailing window). The four band number set_actions flip this
  # true. cfg_* sensors return NAN while false; ingestor skips NAN.
  - id: cfg_first_pull_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: outdoor_staleness_max_s
    type: int
    restore_value: no
    initial_value: '600'     # sprint-15.1: 10 min — 2× dispatcher cadence, covers push jitter

  # ─── Occupancy-based mist inhibit ───
  - id: greenhouse_occupied
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: occupancy_inhibit_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: occupancy_last_true_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

