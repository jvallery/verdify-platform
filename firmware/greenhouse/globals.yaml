    restore_value: yes
    initial_value: '0.90'
  - id: band_vpd_low_sm
    type: float
    restore_value: yes
    initial_value: '0.95'
  - id: band_vpd_low_ss
    type: float
    restore_value: yes
    initial_value: '0.90'
  - id: band_vpd_low_mid
    type: float
    restore_value: yes
    initial_value: '0.88'

  - id: band_vpd_target_sr
    type: float
    restore_value: yes
    initial_value: '1.05'
  - id: band_vpd_target_sm
    type: float
    restore_value: yes
    initial_value: '1.10'
  - id: band_vpd_target_ss
    type: float
    restore_value: yes
    initial_value: '1.05'
  - id: band_vpd_target_mid
    type: float
    restore_value: yes
    initial_value: '1.05'

  - id: band_vpd_high_sr
    type: float
    restore_value: yes
    initial_value: '1.25'
  - id: band_vpd_high_sm
    type: float
    restore_value: yes
    initial_value: '1.50'
  - id: band_vpd_high_ss
    type: float
    restore_value: yes
    initial_value: '1.25'
  - id: band_vpd_high_mid
    type: float
    restore_value: yes
    initial_value: '1.22'

