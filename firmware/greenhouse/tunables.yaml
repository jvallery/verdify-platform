###############################################################################
# greenhouse/tunables.yaml -- user-adjustable settings exposed to Home Assistant
#
# Policy tranche 2 (#586, audit §8.9): entity STATE lambdas for policy wire
# fields are runtime-gated (verdify_policy::policy_read / _read_b) — while an
# experiment manifest is armed the entity displays the ACTIVE policy value the
# control tick actually consumes; while inactive it shows the legacy global,
# bit-identical to pre-Lane-E behavior.
#
# set_action WRITERS deliberately stay on the legacy globals: they ARE the
# write path being demoted. While an experiment is armed the planner-side
# writers are already demoted host-side (#584/#597: MCP set_tunable/set_plan
# and the forecast engine record proposals instead of writing), and any write
# that still lands here only touches the legacy global, which no armed
# consumer reads — it cannot actuate until the experiment disarms. These
# writer sites are explicitly allowlisted in
# firmware/policy_consumer_manifest.json with this justification.
###############################################################################

number:
  # --- Temperature band (°F) -----------------------------------------
  # Wide min/max — dispatcher pushes real crop band each planner cycle.
  - platform: template
    id: num_temp_low
    name: "Set Temp Low °F"
    min_value: 30
    max_value: 80
    step: 0.5
    lambda: "return id(target_temp_low_f);"
    set_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(target_temp_low_f) = x;
          id(num_temp_low).publish_state(x);

  - platform: template
    id: num_temp_high
    name: "Set Temp High °F"
