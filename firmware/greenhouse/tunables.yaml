# ─────────────────────────────── BOOL SWITCHES ────────────────────────────────
# These template switches expose boolean configuration flags to Home Assistant.
# Users can toggle these switches in the UI, which updates the corresponding
# global variables.  Each switch publishes its new state so HA stays in sync.
switch:

  - platform: template
    id: sw_direct_wet_gate_enabled
    name: "Direct Wet Gate Enabled"
    optimistic: false
    restore_mode: RESTORE_DEFAULT_ON
    lambda: "return verdify_policy::policy_read_b(verdify_policy::kPF_sw_direct_wet_gate_enabled, id(direct_wet_gate_enabled));"
    turn_on_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(direct_wet_gate_enabled) = true;
          id(sw_direct_wet_gate_enabled).publish_state(true);
    turn_off_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(direct_wet_gate_enabled) = false;
          id(sw_direct_wet_gate_enabled).publish_state(false);

  - platform: template
    id: sw_gl_main_auto
    name: "GL Main Auto Mode"
    icon: mdi:lightbulb-auto
    optimistic: false
    restore_mode: RESTORE_DEFAULT_ON
    lambda: "return id(gl_main_auto_enabled);"
    turn_on_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(gl_main_auto_enabled) = true;
          id(sw_gl_main_auto).publish_state(true);
    turn_off_action:
      - lambda: |
          id(cfg_first_pull_ok) = true;
          id(gl_main_auto_enabled) = false;
          id(sw_gl_main_auto).publish_state(false);

  - platform: template
