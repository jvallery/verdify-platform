# verdify-platform image builds and the digest pin PR on the estate's ARC
# runners (#1397). This workflow is the only image build and pin path: the native
# in-cluster pipeline is retired, and the repository variable VERDIFY_GHA_BUILD
# (true since 2026-11-06) gates the push trigger and the pin job. A manual
# dispatch from main builds the impacted images and pushes them by digest
# (tag gha-<sha12>); it opens a pin PR only while VERDIFY_GHA_BUILD is true.
#
# impact: the classifier (ci/gha/path-impact.sh --push) selects the images whose
# Dockerfile inputs changed since the last main commit whose push build
# succeeded (#1534), so the changes of a build GitHub displaced while it was
# pending, or of a build that failed, are built by the next one; a digest-only
# pin push builds nothing. The dispatch input `base` overrides the base.
# Builds run on verdify-platform-build (Kaniko sidecar plus the repository's zot
# writer; default-branch push/dispatch only). PRs build the same images without
# push on verdify-platform-buildcheck (ci.yml, "ci / buildcheck").
# pin: one estate-ci pin-bump job, the only writer. It opens one PR that moves the
# five candidate entries in deploy/k8s/overlays/prod/kustomization.yaml (prod runs
# release-pins.yaml, so merging it deploys nothing) and the dashboard-web digest in
# deploy/k8s/dashboard/kustomization.yaml; an operator merges it.
#
# Portability (Forgejo/Gitea Actions): the impact job is checkout plus one script;
# builds and the pin are /opt/estate-ci/image-build.sh and pin-bump.sh.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Optional full SHA on main to diff against (for example the last pinned
          build), so one dispatch builds every image changed since it.
        required: false
        default: ""

permissions:
  contents: read

# Serial on main, so pin PRs open in commit order. GitHub may replace a pending
# run with a newer one; the impact base (last successful push build) makes the
# newer run build what the displaced one would have.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  impact:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VERDIFY_GHA_BUILD == 'true' }}
    runs-on: verdify-platform-ci
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the last successful build run on main (ci/gha/last_built_main.py)
    outputs:
      mode: ${{ steps.impact.outputs.mode }}
      api: ${{ steps.impact.outputs.api }}
      mcp: ${{ steps.impact.outputs.mcp }}
      ingestor: ${{ steps.impact.outputs.ingestor }}
      migrate: ${{ steps.impact.outputs.migrate }}
      orchestrator: ${{ steps.impact.outputs.orchestrator }}
      planner: ${{ steps.impact.outputs.planner }}
      setpoint-server: ${{ steps.impact.outputs.setpoint-server }}
      lab-publisher: ${{ steps.impact.outputs.lab-publisher }}
      dashboard-web: ${{ steps.impact.outputs.dashboard-web }}
      grafana-image-renderer: ${{ steps.impact.outputs.grafana-image-renderer }}
      hermes-agent: ${{ steps.impact.outputs.hermes-agent }}
      timescaledb: ${{ steps.impact.outputs.timescaledb }}
      esphome-ci: ${{ steps.impact.outputs.esphome-ci }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: impact
        shell: bash
        env:
          VERDIFY_IMPACT_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base || '' }}
          VERDIFY_BASE_LAST_BUILT: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/gha/path-impact.sh --push

  api:
    needs: [impact]
    if: ${{ needs.impact.outputs.api == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-api
      dockerfile: api/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  mcp:
    needs: [impact]
    if: ${{ needs.impact.outputs.mcp == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-mcp
      dockerfile: mcp/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  ingestor:
    needs: [impact]
    if: ${{ needs.impact.outputs.ingestor == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-ingestor
      dockerfile: ingestor/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  migrate:
    needs: [impact]
    if: ${{ needs.impact.outputs.migrate == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-migrate
      dockerfile: db/Dockerfile.migrate
      push: true

  orchestrator:
    needs: [impact]
    if: ${{ needs.impact.outputs.orchestrator == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-experiment-v2-orchestrator
      dockerfile: experiment_orchestrator/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  planner:
    needs: [impact]
    if: ${{ needs.impact.outputs.planner == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-planner
      dockerfile: planner_graph/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  setpoint-server:
    needs: [impact]
    if: ${{ needs.impact.outputs.setpoint-server == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-setpoint-server
      dockerfile: scripts/Dockerfile.setpoint-server
      push: true

  lab-publisher:
    needs: [impact]
    if: ${{ needs.impact.outputs.lab-publisher == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-lab-publisher-k3s
      dockerfile: scripts/Dockerfile.lab-publisher
      push: true

  dashboard-web:
    needs: [impact]
    if: ${{ needs.impact.outputs.dashboard-web == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-dashboard-web
      dockerfile: dashboard/Dockerfile
      push: true
      build-args: GIT_SHA=${{ github.sha }}

  # #1113: not in the pin job; the renderer digest in grafana.yaml is hand-pinned.
  grafana-image-renderer:
    needs: [impact]
    if: ${{ needs.impact.outputs.grafana-image-renderer == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-grafana-image-renderer
      dockerfile: grafana/Dockerfile.image-renderer
      push: true

  # #1458: not in the pin job; the hermes-agent digest in hermes-iris.yaml is hand-pinned.
  hermes-agent:
    needs: [impact]
    if: ${{ needs.impact.outputs.hermes-agent == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-hermes-agent
      dockerfile: hermes/Dockerfile.hermes-agent
      push: true

  # #1458: not in the pin job. verdify-db (and the other verdify-timescaledb consumers) are
  # hand-pinned; a repin restarts the database, so it stays a separate attended release.
  timescaledb:
    needs: [impact]
    if: ${{ needs.impact.outputs.timescaledb == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-timescaledb
      dockerfile: db/Dockerfile.timescaledb
      push: true

  # #1535: the firmware-secretless-compile job image. Not in the pin job; the
  # ci-esphome job_image digest lives in jvallery/estate-ci runners.yaml.
  esphome-ci:
    needs: [impact]
    if: ${{ needs.impact.outputs.esphome-ci == 'true' }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: verdifyconsultancy/verdify-esphome-ci
      dockerfile: ci/esphome-ci.Dockerfile
      push: true

  pin:
    needs: [impact, api, mcp, ingestor, migrate, orchestrator, planner, setpoint-server, lab-publisher, dashboard-web]
    # Native pin-digests pins whatever built; a failed build leaves its line empty.
    if: ${{ !cancelled() && vars.VERDIFY_GHA_BUILD == 'true' && needs.impact.outputs.mode == 'build' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: jvallery/estate-ci/.github/workflows/pin-bump.yml@b06d559936a7a8f6c77bea9897533940ffaf9347
    secrets:
      # vallery-pin-bot (D-52): the pin PR is opened by the App, so pull_request CI runs.
      pin-bot-private-key: ${{ secrets.PIN_BOT_PRIVATE_KEY }}
    with:
      pins: |
        deploy/k8s/overlays/prod/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-api ${{ needs.api.outputs.digest }}
        deploy/k8s/overlays/prod/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-mcp ${{ needs.mcp.outputs.digest }}
        deploy/k8s/overlays/prod/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-ingestor ${{ needs.ingestor.outputs.digest }}
        deploy/k8s/overlays/prod/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-migrate ${{ needs.migrate.outputs.digest }}
        deploy/k8s/overlays/prod/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-experiment-v2-orchestrator ${{ needs.orchestrator.outputs.digest }}
        deploy/k8s/dashboard/kustomization.yaml registry.vallery.net/verdifyconsultancy/verdify-dashboard-web ${{ needs.dashboard-web.outputs.digest }}
      checks-workflow: ci.yml   # fallback only, without the pin-bot secret
