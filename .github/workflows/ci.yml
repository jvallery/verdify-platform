# verdify-platform CI on the estate's self-hosted ARC runners (issue #1397).
#
# Every job is the estate-ci reusable checks workflow (checkout + one repository
# script) on a jvallery/verdify-platform scale set; the scripts in ci/gha/ are
# the only copy of these checks (the native in-cluster pipeline is retired).
# Required and advisory contexts, and their exceptions: docs/ci/ci-contexts.md.
# Every caller job is named "ci", so each check context is "ci / <check>" (for
# example "ci / validate"). No required context is skipped by an `if:` (a skipped
# reusable-workflow caller reports no "ci / <check>" context and would block the
# merge): a check that path impact does not select passes as "not impacted", so
# every context always reports. Only shard matrices and the PR build-check's
# helper jobs are conditional; their aggregate contexts always report.
#
# Light paths (CI audit 2026-11-16): the path-impact job classifies the change
# (ci/gha/verdify_path_impact.py) and its outputs select the checks:
#   light=pins  every change is a digest (or comment) line of a pin file: only the
#               validate "pins" part (both renders, zero Secret, pin shape) runs
#   light=docs  every change is Markdown no test, script or CI file names: no
#               validate part, campaign-qualification or platform check runs
#   light=verified  (push to main only, #1716 C1) the commit's exact tree already
#               passed a pull_request run (ci/gha/verified_on_pr.py): no validate
#               part, campaign shard, firmware compile or dashboard check runs again
#   full=true   anything else: every check, as before
#   firmware-check  the ESPHome compile runs only when the firmware tree or the
#               CI plumbing changes
# A nightly scheduled run is always full (no base). secret-scan, lint, dashboard
# (its own impact flag) and buildcheck run as before.
#
# "ci / platform-static", "ci / platform-tests" and "ci / firmware-logic" keep
# their names but aggregate the validate parts (#1716 C2): their work (ruff, the
# platform tests, the firmware logic and replay suites) runs inside the parts.
#
# Scale sets (estate-ci runners.yaml, repository jvallery/verdify-platform):
#   verdify-platform-ci            job image python:3.13-bookworm (native validate image)
#   verdify-platform-ci-tools      job image agents-ci-tools (uv, verdify-campaign-ci)
#   verdify-platform-ci-esphome    job image ESPHome 2026.6.5; next verdify-esphome-ci, the
#                                  same plus the PlatformIO toolchain (ci/esphome-ci.Dockerfile)
#   verdify-platform-ci-dashboard  job image weather-ci (node, pnpm, Playwright)
#   verdify-platform-buildcheck    Kaniko, no push credential (PR image build-check)
#   verdify-platform-ci-gate       runner container only (estate-ci#229 C3): trusted-precheck,
#                                  path-impact, buildcheck-impact and every aggregate, so a
#                                  docs-only or pin-only run never queues behind work shards
#
# Portability (Forgejo/Gitea Actions): each job is checkout plus one `run:` of a
# ci/gha/ script and /opt/estate-ci helpers; vendor checks.yml if the forge
# cannot call a cross-repository reusable workflow.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # estate-ci pin-bump dispatches this on its pin branch
  schedule:
    - cron: "17 9 * * *"   # one full run of main per night (#1716 C1)

permissions:
  contents: read

# One group per PR (a new push supersedes the PR's older run) and one group per
# commit on main (#1535). cancel-in-progress: false alone does not
# protect main: GitHub keeps one pending run per group and replaces it with the
# next one, so a shared main group left most main commits with no CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trusted-precheck:
    name: ci
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: trusted-precheck
      run: ci/gha/trusted-precheck.sh
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  secret-scan:
    name: ci
    needs: [trusted-precheck]
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: secret-scan
      run: ci/gha/gitleaks.sh
      timeout-minutes: 10

  # A direct job (not the reusable checks workflow) so the other jobs can read its
  # outputs; its name keeps the required context "ci / path-impact". It runs the
  # precheck itself, so it starts beside trusted-precheck instead of after it.
  path-impact:
    name: ci / path-impact
    runs-on: verdify-platform-ci-gate
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read         # the pull request's ci run and its path-impact log (ci/gha/verified_on_pr.py)
      pull-requests: read   # the merged pull request of a main commit
    outputs:
      light: ${{ steps.impact.outputs.light }}
      full: ${{ steps.impact.outputs.full }}
      validate-parts: ${{ steps.impact.outputs.validate-parts }}
      firmware-check: ${{ steps.impact.outputs.firmware-check }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: impact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERDIFY_VERIFY_ON_PR: "true"
        run: ci/gha/trusted-precheck.sh && ci/gha/path-impact.sh

  # Native `validate`: scripts/ci-local.sh with the diff gates, run as four
  # parallel parts (VALIDATE_PART, #1459); each part stays serial inside so the
  # wall-clock assertions keep their own CPU. The required context
  # "ci / validate" is the aggregate, which fails unless every part succeeded.
  # Path impact lists the parts: the four, only "pins" (pin-only), or none (docs-only
  # or verified). "ci / platform-static", "ci / platform-tests" and "ci / firmware-logic"
  # aggregate the same parts (#1716 C2).
  validate-part:
    name: ci
    needs: [trusted-precheck, path-impact]
    if: ${{ needs.path-impact.outputs.validate-parts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.path-impact.outputs.validate-parts) }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: validate-${{ matrix.part }}
      run: VALIDATE_PART=${{ matrix.part }} ci/gha/validate.sh
      runner: verdify-platform-ci
      in-job-image: true
      timeout-minutes: 45

  validate:
    name: ci
    needs: [trusted-precheck, path-impact, validate-part]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: validate
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} validate-parts=${{ needs.path-impact.outputs.validate-parts == '[]' && 'not-impacted' || needs.validate-part.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # The validation steps from the retired native repo-validate profile (ci/gha/registry-step.sh);
  # platform-static and platform-tests aggregate the validate parts (#1716 C2).
  platform-static:
    name: ci
    needs: [trusted-precheck, path-impact, validate-part]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: platform-static
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} validate-parts=${{ needs.path-impact.outputs.validate-parts == '[]' && 'not-impacted' || needs.validate-part.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  platform-tests:
    name: ci
    needs: [trusted-precheck, path-impact, validate-part]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: platform-tests
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} validate-parts=${{ needs.path-impact.outputs.validate-parts == '[]' && 'not-impacted' || needs.validate-part.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # campaign-qualification runs the tool's default selection (38 files, among them
  # every tests/test_dashboard_db_*.py, about 40 min serially) as four parallel
  # shards (CAMPAIGN_SHARD, #1535). Two required contexts aggregate the
  # same shards: "ci / campaign-qualification" and "ci / campaign" (the old campaign
  # job ran the dashboard-db subset of this selection a second time; CI audit
  # 2026-11-16). A light (docs or pins) change runs no shard.
  campaign-qualification-shard:
    name: ci
    needs: [trusted-precheck, path-impact]
    if: ${{ needs.path-impact.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: campaign-qualification-${{ matrix.shard }}of4
      run: CAMPAIGN_SHARD=${{ matrix.shard }}/4 ci/gha/registry-step.sh campaign-qualification
      runner: verdify-platform-ci-tools
      in-job-image: true
      timeout-minutes: 30

  campaign-qualification:
    name: ci
    needs: [trusted-precheck, path-impact, campaign-qualification-shard]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: campaign-qualification
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} campaign-qualification-shards=${{ needs.path-impact.outputs.full == 'false' && 'not-impacted' || needs.campaign-qualification-shard.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # firmware-logic aggregates the validate parts too: containment-firmware runs its suites (#1716 C2).
  firmware-logic:
    name: ci
    needs: [trusted-precheck, path-impact, validate-part]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: firmware-logic
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} validate-parts=${{ needs.path-impact.outputs.validate-parts == '[]' && 'not-impacted' || needs.validate-part.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # The two firmware targets compile as two parallel shards on the baked
  # verdify-esphome-ci image (FIRMWARE_TARGET, #1535); the greenhouse
  # shard also runs the generated-cpp negative. "ci / firmware-secretless-compile"
  # is the aggregate. Only a change to the firmware tree or the CI plumbing
  # (path impact firmware-check) compiles.
  firmware-secretless-compile-target:
    name: ci
    needs: [trusted-precheck, path-impact]
    if: ${{ needs.path-impact.outputs.firmware-check == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: [greenhouse, greenhouse-recovery]
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: firmware-secretless-compile-${{ matrix.target }}
      run: FIRMWARE_TARGET=${{ matrix.target }} ci/gha/registry-step.sh firmware-secretless-compile
      runner: verdify-platform-ci-esphome
      in-job-image: true
      timeout-minutes: 30

  firmware-secretless-compile:
    name: ci
    needs: [trusted-precheck, path-impact, firmware-secretless-compile-target]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: firmware-secretless-compile
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} firmware-secretless-compile-targets=${{ needs.path-impact.outputs.firmware-check == 'false' && 'not-impacted' || needs.firmware-secretless-compile-target.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # Native `dashboard`: classification in the runner container, checks in the
  # set's job image (ci/gha/dashboard.sh).
  dashboard:
    name: ci
    needs: [trusted-precheck, path-impact]
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: dashboard
      run: VERDIFY_LIGHT=${{ needs.path-impact.outputs.light }} ci/gha/dashboard.sh
      runner: verdify-platform-ci-dashboard
      timeout-minutes: 50

  # "ci / campaign" (required): the tests/test_dashboard_db_*.py files, each on its
  # own private TimescaleDB. They are part of the campaign-qualification selection,
  # so this context aggregates the same shards instead of running them again.
  campaign:
    name: ci
    needs: [trusted-precheck, path-impact, campaign-qualification-shard]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: campaign
      run: bash ci/gha/require-success.sh path-impact=${{ needs.path-impact.result }} campaign-qualification-shards=${{ needs.path-impact.outputs.full == 'false' && 'not-impacted' || needs.campaign-qualification-shard.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # PR image build-check (#1534): every image whose Dockerfile inputs
  # the PR changes is built without push on verdify-platform-buildcheck (Kaniko,
  # no registry write credential), so a broken Dockerfile fails before merge.
  # Off until the repository variable VERDIFY_BUILDCHECK is "true", which is set
  # once the estate-ci buildcheck set is live; "ci / buildcheck" then reports the
  # result and passes as "not enabled" before that.
  buildcheck-impact:
    if: ${{ github.event_name == 'pull_request' && vars.VERDIFY_BUILDCHECK == 'true' }}
    runs-on: verdify-platform-ci-gate
    timeout-minutes: 10
    outputs:
      images: ${{ steps.impact.outputs.images }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: impact
        shell: bash
        run: ci/gha/buildcheck-impact.sh

  buildcheck-image:
    needs: [buildcheck-impact]
    if: ${{ needs.buildcheck-impact.outputs.images != '' && needs.buildcheck-impact.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.buildcheck-impact.outputs.images) }}
    uses: jvallery/estate-ci/.github/workflows/image-build.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args }}
      push: false

  buildcheck:
    name: ci
    needs: [buildcheck-impact, buildcheck-image]
    if: ${{ !cancelled() }}
    uses: jvallery/estate-ci/.github/workflows/checks.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      name: buildcheck
      run: bash ci/gha/buildcheck-result.sh impact=${{ needs.buildcheck-impact.result }} images=${{ needs.buildcheck-image.result }}
      runner: verdify-platform-ci-gate
      timeout-minutes: 5

  # Estate rules R1-R3 on this repository's workflows: context "ci / lint".
  workflow-lint:
    name: ci
    uses: jvallery/estate-ci/.github/workflows/lint.yml@6c3b7227e9e256391f8b88179c24caeb4e4b86a3
    with:
      strict: true
      runner: verdify-platform-ci
