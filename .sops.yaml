# SOPS ruleset for this repository.
#
# Secret values for verdify-prod and verdify-dashboard are delivered by the central
# KSOPS lane (Applications verdify-prod-secrets-local-prod and
# verdify-dashboard-secrets, declared in jvallery/agents today and planned for
# jvallery/estate-platform). This repo keeps Secret names and keys only
# (deploy/k8s/SECRETS.md); add no new SOPS files here (AGENTS.md). This rule stays
# so that any remaining deploy/k8s/*.sops.yaml file can still be decrypted or
# moved to the central lane.
#
# encrypted_regex: encrypt only the Secret values (data / stringData), leaving
# apiVersion/kind/metadata/type in cleartext so manifests still parse and key
# names stay visible without their values.
# Recipients (SSH trust Stage 1 / D1, Jason 2026-10-24): age-fleet (age1jd6c7lm…d5k,
# operator Mac + offline escrow) and age-cluster (age1xqatkma…0a8r, held only in
# argocd/sops-age).
creation_rules:
  - path_regex: deploy/k8s/.*\.sops\.ya?ml$
    encrypted_regex: "^(data|stringData)$"
    age: age1jd6c7lm7vhj56gve6dvj59mepwpukhnyyh8wyca9y7mrjfeyqs8qjvqd5k,age1xqatkmaluhuutg342tm27d2wrdy7snts0lgjc40q04sjswxywchq9r0a8r
