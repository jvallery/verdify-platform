# Two-replica PNG cache for public Grafana renders. The live interactive
# Grafana route continues to target verdify-grafana directly; only `/render/`
# enters this small proxy. No database or credential is mounted here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-grafana-render-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana-render-cache
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana-render-cache
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: grafana-render-cache
    spec:
      # #1363: the zot origin denies anonymous reads.
      imagePullSecrets:
        - name: zot-origin-cluster-pull
      automountServiceAccountToken: false
      nodeSelector:
        agentfleet.vallery.net/control-plane: "false"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          # Exclude cordoned and tainted nodes (node8 dedicated=frigate) from
          # the skew math.
          nodeTaintsPolicy: Honor
          # Count the new ReplicaSet independently while old pods retire.
          matchLabelKeys: [pod-template-hash]
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: grafana-render-cache
      containers:
        - name: render-cache
          image: registry.vallery.net/jvallery/mirror-docker-io-library-nginx:1.30.7-alpine-slim-8c950211a641@sha256:8c950211a641ec5b23f265450517001f6bcca533666120ebe36cb4cff3d00a55
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /cache-health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /cache-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            # The official nginx image defaults to root; run as its nginx UID.
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: config
          configMap:
            name: verdify-grafana-render-cache-config
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: verdify-grafana-render-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana-render-cache
spec:
  # STD-HA-06 (jvallery/estate-platform#115): 2 replicas, one disrupted at a time, and an
  # unhealthy pod never blocks a drain.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana-render-cache
---
apiVersion: v1
kind: Service
metadata:
  name: verdify-grafana-render-cache
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana-render-cache
spec:
  type: ClusterIP
  # Each replica has its own bounded emptyDir cache. Keep a given ingress
  # source on one replica long enough for an immediate repeat render to hit
  # the same cache instead of cold-rendering once per endpoint.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 600
  selector:
    app.kubernetes.io/component: grafana-render-cache
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-render-cache-from-ingress
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: grafana-render-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: grafana-render-cache
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: edge-traefik
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-grafana-render-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: grafana-render-cache
      ports:
        - protocol: TCP
          port: 8080
