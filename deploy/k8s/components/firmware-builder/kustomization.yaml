apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - firmware-builder.yaml
  - firmware-flasher.yaml
configMapGenerator:
  - name: verdify-firmware-release-tools
    files:
      - firmware_release.py
  - name: verdify-firmware-release-trust
    files:
      - cosign.pub
      - offline-signing.json
# verdify-prod-dark has prune off, so a superseded hash-suffixed ConfigMap stays
# live after a content change. IgnoreExtraneous keeps that leftover from holding
# the Application OutOfSync (the deploy/k8s/dashboard pattern, #1536); it does not
# remove it: the leftover is deleted by name once no Job or Pod mounts it.
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
