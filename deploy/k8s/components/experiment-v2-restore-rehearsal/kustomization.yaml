apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# One-release, GitOps-managed PreSync schema/ACL rehearsal for protocol v2.
# It validates a recent dump under disposable non-superuser roles; it is not
# proof that PostgreSQL superusers are denied database object privileges.
# The production overlay references it for this repair release after the
# candidate migrate image has been digest-pinned. After one successful retained
# log, remove that single overlay component reference. The deny policy has an
# exact pod selector and remains harmless when no rehearsal pod exists.
resources:
  - restore-rehearsal-script.yaml
  - restore-rehearsal-job.yaml
  - restore-rehearsal-network-policy.yaml

# Digest for a render that no pinning overlay wraps (STD-K8S-05, #1572): the
# overlays/prod release pin at the time of writing. The logical name is kept
# (no newName), so a wrapping overlay's images: entry and release-pins.yaml
# still replace name and digest when this component is wired.
images:
  - name: ghcr.io/verdifyconsultancy/verdify-migrate
    digest: sha256:48e0f0a3945dc939cc922e11716995e02d0199b947374d532ce0a9a1335b74fa
