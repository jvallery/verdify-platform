apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kustomize COMPONENT: the namespaced prod DB backup substrate (M3.3; refs
# #84/#28/#130). An env opts in by listing ../../components/db-backup under its
# overlay `components:` (same pattern as planner/mqtt-broker/www). overlays/prod
# lists it, so it renders into verdify-prod through verdify-prod-dark.
#
# Contains the NAMESPACED resources only (they inherit the overlay namespace):
#   - dumps-pvc.yaml      verdify-db-dumps PVC (binds storage-infra's static NFS PV)
#   - backup-cronjob.yaml nightly pg_dump -Fc + retention + db-backup->db allow
#   - restore-networkpolicy.yaml unchanged restore-to-db ingress (#993)
#
# It carries no cluster-scoped object: verdify-db-dumps binds a static NFS PV
# owned by storage-infra.
#
# SINGLE-WRITER SAFE: the CronJob reads the DB with pg_dump (SELECT-only) and
# only writes the dumps PVC. It is not a second DB writer and does not touch the
# device path, so it is safe to enable independently of the M5 prod ingestor
# gate.
resources:
  - dumps-pvc.yaml
  - backup-cronjob.yaml
  - restore-networkpolicy.yaml
# Backup freshness comes from kube-state-metrics CronJob status
# (monitoring-stack backup.freshness.ksm -> VerdifyDBBackupStale and
# VerdifyDBBackupMetricsUnavailable); the NFS-mounting exporter was retired (#1541).
