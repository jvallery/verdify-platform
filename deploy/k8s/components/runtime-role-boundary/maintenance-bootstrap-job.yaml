apiVersion: batch/v1
kind: Job
metadata:
  name: verdify-maintenance-runtime-role-bootstrap
  labels:
    app.kubernetes.io/part-of: verdify
    app.kubernetes.io/component: runtime-role-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '4'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: verdify
        app.kubernetes.io/component: migrate
        app.kubernetes.io/name: verdify-maintenance-runtime-role-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A new pod's first connection can go unanswered for a few seconds, until the
        # network path that admits it is programmed. backoffLimit is 0, so that one
        # miss would fail the whole sync. Wait here until the database answers; this
        # container holds no credential.
        # -U names a user: the image's UID 1000 has no passwd entry, and without one
        # pg_isready exits 3 ("no attempt") before it contacts the server.
      - name: wait-for-db
        image: ghcr.io/verdifyconsultancy/verdify-migrate
        command: ["/bin/sh", "-ec"]
        args:
          - |
            attempt=0
            until pg_isready -q -t 3 -h "${DB_HOST}" -p "${DB_PORT}" -U verdify; do
              attempt=$((attempt + 1))
              [ "${attempt}" -lt 20 ] || { echo "[wait-for-db] the database did not answer" >&2; exit 1; }
              sleep 2
            done
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef: {name: verdify-config, key: DB_HOST}
          - name: DB_PORT
            valueFrom:
              configMapKeyRef: {name: verdify-config, key: DB_PORT}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: "25m", memory: "32Mi"}
          limits: {cpu: "250m", memory: "128Mi"}
      containers:
      - name: bootstrap-and-attest
        image: ghcr.io/verdifyconsultancy/verdify-migrate
        command:
        - python3
        - /scripts/bootstrap-maintenance-runtime-roles.py
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: verdify-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: verdify-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: verdify-config
              key: DB_NAME
        - name: DB_ADMIN_USER
          valueFrom:
            configMapKeyRef:
              name: verdify-config
              key: DB_USER
        - name: DB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: verdify-app-secrets
              key: POSTGRES_PASSWORD
        - name: MATVIEW_REFRESH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: verdify-matview-refresh-runtime-db
              key: password
        # Optional: without a value the bootstrap skips the dashboard login's duty (#1143).
        - name: DASHBOARD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: verdify-dashboard-runtime-db
              key: password
              optional: true
        - name: PGAPPNAME
          value: verdify-maintenance-runtime-role-bootstrap
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
