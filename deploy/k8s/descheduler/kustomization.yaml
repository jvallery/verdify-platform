# The manual Argo CD Application verdify-descheduler renders these nine objects:
# the adopted Namespace, the ServiceAccount, Role and RoleBinding, the policy
# ConfigMap, the CronJob, the two egress NetworkPolicies (vendored
# management-set deny plus the kube-API allow, network-infra#839) and the
# namespace-wide ingress default-deny.
# The cluster-scoped ClusterRole and ClusterRoleBinding verdify-descheduler are
# declared in jvallery/estate-platform, which also declares the Application,
# its pin and the AppProject. Existing namespace labels are preserved.
# See descheduler-arm.md for delivery, verification, pause and the inverse.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - policy-configmap.yaml
  - cronjob.yaml
  - egress-deny-management.yaml
  - egress-allow-management.yaml
  - ingress-default-deny.yaml

patches:
  - path: source-owned-fields-ssa.patch.yaml
  # network-infra#839: the vendored deny carries no namespace; pin it here (no global
  # `namespace:` so the adopted Namespace object stays untouched).
  - target:
      kind: NetworkPolicy
      name: egress-deny-management
    patch: |-
      - op: add
        path: /metadata/namespace
        value: verdify-descheduler
