  # Lab publisher: source 7cdddc3fb3be (#1451 public-output guard fix on top of #1436), GHA build run
  # 42336369914. Rollback: 822d19776c28 (source eaf572287c6a; fails the guard on /reference/ai-tunables).
  - name: ghcr.io/verdifyconsultancy/verdify-lab-publisher-k3s
