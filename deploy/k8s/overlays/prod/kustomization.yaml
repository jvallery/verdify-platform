  - name: ghcr.io/verdifyconsultancy/verdify-ingestor
    newName: registry.vallery.net/verdifyconsultancy/verdify-ingestor
    digest: sha256:b8fc59f85d64fca61ce439f4641163ff754ca12a82bf9154c5ccea9cba339307
  - name: ghcr.io/verdifyconsultancy/verdify-migrate
    newName: registry.vallery.net/verdifyconsultancy/verdify-migrate
    digest: sha256:aa8046700a890fa24a864d9f291d3b1af84c13d828d68b49517bdb9c69bbcd31
  # Hand-pinned grow-light writer: source 5ebe309308d5 (W7 release 8: #1494 relay_physical, #1495 per-setting
  # write lock), GHA build run 42415895024. Rollback: 0f40c6514b21 (source 130a954e0ce7, build run 42294583580). The #399 HA call allowlist confines
  # this prod-only writer to the declared main/grow light switches.
