apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# D7 two-tier Verdify edge (apps Traefik .7.10 -> verdify-traefik -> services).
# Referenced from overlays/prod/kustomization.yaml. Namespace is inherited
# (verdify-prod) from the parent overlay.
resources:
  - verdify-traefik-rbac.yaml
  - verdify-traefik-deployment.yaml
  - verdify-traefik-netpol.yaml
  - verdify-traefik-routes.yaml
  - verdify-tier1-apps-forward.yaml
  - verdify-mcp-tunnel-forward.yaml

# A content-hashed ConfigMap makes every route change a zero-unavailable rollout.
# IngressRoute/Middleware files remain the single authoring contract; the proxy
# reads this generated projection and does not watch Kubernetes.
configMapGenerator:
  - name: verdify-traefik-routing
    files:
      - routes.yaml=generated-routes.yaml
# verdify-prod-dark has prune off, so a superseded hash-suffixed ConfigMap stays
# live after a content change. IgnoreExtraneous keeps that leftover from holding
# the Application OutOfSync (the deploy/k8s/dashboard pattern, #1536); it does not
# remove it: the leftover is deleted by name once no Job or Pod mounts it.
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
