# INGESTOR RESILIENCE (L1 Phase 2) — liveness probe + soft node anti-affinity.
#
# Strategic-merge onto the single-writer verdify-ingestor Deployment. Applying
# this RESTARTS the sole ESP32 writer (Recreate tears the old pod down first —
# no double-writer) and is therefore a root-executed safeguarded action at the
# device-write window, NOT autonomous. Landed here ready-to-sync.
#
# 1. LIVENESS (audit §8 P1.5; #1748): process health only. ingestor-liveness.py
#    passes while the event loop and the task supervisor both beat (process_liveness.py;
#    files under /tmp, the pod's emptyDir) within 90 s. It reads no climate row
#    and no database: a silent controller (WiFi down, restarting) or a database
#    outage is outside the pod, a restart repairs neither, and the old
#    climate-age probe restart-looped the single writer every ~4.5 min through
#    every controller silence (2026-11-17: 6 kills 03:50-04:12Z, 6 more
#    11:28-11:50Z). Data freshness stays a metric and an alert
#    (verdify_table_last_row_age_seconds{table="climate"}, sensor_offline);
#    ingestor-healthz.py remains a manual climate-age check. Generous
#    thresholds: ~120 s warmup, then 5 x 30 s of stale beats before a restart.
#
# 2. SOFT nodeAffinity AWAY from the storage-flaky node6 (audit D3: node6
#    iSCSI/NFS FailedMount churned the writer twice in ~50 min and timed out the
#    lab-publisher). PREFERRED, not required: the writer must stay on a
#    device-VLAN-reachable node, and the real fix is storage-infra repairing
#    node6 (coordination request filed). This is a stopgap scheduling nudge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdify-ingestor
spec:
  template:
    metadata:
      annotations:
        # Reload only the existing encrypted MQTT fields; no release-pin change.
        homeassistant.vallery.net/mqtt-identity-generation: "20261021-isolated-v1"
    spec:
      affinity:
        nodeAffinity:
          # 3. EGRESS SET (D-127): the writer's ESP32/Shelly egress source set is
          #    the node4/node5 SNAT addresses (staged gateway rule GAP #11), so it
          #    is pinned to those hosts by name, not by node class (node classes
          #    now follow hardware, and node4/node5 become gpu).
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["vm-k3s-node4", "vm-k3s-node5"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["vm-k3s-node6"]
      containers:
        - name: ingestor
          livenessProbe:
            exec:
              command: ["python", "ingestor-liveness.py"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
