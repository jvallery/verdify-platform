# Verdify operator dashboard API (OpenAPI 3.1)
#
# The private operator API (verdify-operator-api, /v1) and the BFF sign-in and session routes behind
# dashboard.verdify.ai. One write path for people and agents: validation on submit, last write wins, a manual
# flag that Iris skips, and requested -> confirmed from device readback. No holds, dry runs or step-up.
#
# Status: Draft v2 (2026-11-02, decisions Q-01 to Q-14 applied)
# Docs: ../README.md · ../product.md · ../screens.md · ../architecture.md · ../irrigation.md ·
#       ../design-system.md · ../execution-plan.md · dashboard-api.v1.yaml (this file)
openapi: 3.1.0
info:
  title: Verdify operator dashboard API
  version: 1.0.0-draft.4
  summary: Private operator API and BFF session routes for dashboard.verdify.ai
  description: |
    The browser signs in through the BFF (native Authentik OIDC) and calls `/api/v1/...`. The BFF forwards each call
    to `verdify-operator-api` (`/v1/...`, ClusterIP :8090, never routed) with the shared bearer token, the session in
    `X-Dashboard-Session` and `X-Request-Id`. The operator API reads `verdify-db` and writes through
    `verdify_services`, the functions MCP also uses, so people and agents get the same validation, attribution and
    readback.

    Status: Draft v2 (2026-11-02, decisions Q-01 to Q-14 applied). This file is hand-maintained and canonical
    (R1): new operations land here first, every FastAPI route sets `operation_id` to its id, and a test checks each
    served method, path, operationId and schema against this file (committed operations not yet served are allowed). Docs:
    [README](../README.md) · [product](../product.md) · [screens](../screens.md) · [architecture](../architecture.md) ·
    [irrigation](../irrigation.md) · [design system](../design-system.md) · [execution plan](../execution-plan.md).

    | Topic | Rule |
    |---|---|
    | Ids | `operationId` is the design id: API-01 to API-24 and API-30 to API-37 (API-07, the plan, and API-25, the planner history, retired in release C; API-26 to API-28, the planner study, retired with the planner's write role; API-29 is left unused), API-IRR-01 to API-IRR-13, API-CROP-01 to API-CROP-12, BFF-01 to BFF-03, INT-01, INT-02, OPS-01, OPS-02 and OPS-04. API-08, API-18, API-IRR-09 and OPS-03 are reserved (cut); ids are never reused |
    | Data | JSON. Times are ISO 8601 with an offset; days are America/Denver. Units are in field names or `unit` (°F, %, kPa, gal, min, s). `null` means unavailable, never 0; gaps stay gaps |
    | Roles | GET: `viewer` and `operator`. Every other method: `operator` (403 `forbidden`) |
    | Writes | Validated on submit (registry min/max, enums, step snap). The newest write wins. No agent writes a climate value (climate refactor 4.2: `set_plan` and `set_tunable` are retired, and an agent's `set_setting` reaches only the operator switches). On a `manual: true` item Iris's irrigation writes are refused with `manual`; people and other agents may overwrite it, attributed, and each write stores the `manual` it carries. Every write appends one `activity_log` row: source (`dashboard`, `iris`, `agent:<name>` or `system`), actor, time, reason, and the experiment id while one is armed |
    | Idempotency | Every write takes an optional `Idempotency-Key` (MCP `request_id`). The same key and payload return the stored result again with `Idempotency-Replayed: true`; the same key with a different payload is 422 `request_id_reused` |
    | Readback | Setting and program writes return the stored object with `state: requested`; later reads show `confirmed` or `not_confirmed`. Display only, never a gate. Commands return 202 and a `Command` (`pending`, then `sent` or `failed`); relay edges and `irr_state` show what happened |
    | BFF | Non-GET `/api/*` needs `Origin: https://dashboard.verdify.ai` exactly (403 `origin_mismatch`). A path with a `.` or `..` segment, or containing `%2e`, `%2f`, `%5c` or a backslash, gets 400 `invalid_request`. While `DASHBOARD_WRITES_ENABLED` is not `true`, every non-GET `/api/*` except API-IRR-07 (Stop) gets 503 `writes_disabled`. `/api` and `/auth` responses are `Cache-Control: no-store`. Paths with `x-served-by` are served by the BFF (or by both tiers) |
    | Errors | `application/problem+json`: 400 `invalid_request`, 401 `unauthenticated`, 403 `forbidden` or `origin_mismatch`, 404 `not_found` (unknown id on a read), 422 validation and refusal codes (`unknown_target` on a write, as on MCP), 503 `writes_disabled`, `query_timeout` (narrow the window) or `unavailable`. `retryable` is true only for `line_busy`, `manifold_busy`, `query_timeout` and `unavailable`. Until the engine firmware is on the controller, an operation that needs it is 503 `unavailable` with `retryable: false` and the detail "arrives with the irrigation firmware" |
servers:
  - url: https://dashboard.verdify.ai/api
    description: Browser, through the BFF with the session cookie; /api/v1/* is proxied to the operator API /v1/*
  - url: http://verdify-operator-api.verdify-prod.svc:8090
    description: Operator API, in-cluster; only verdify-dashboard-web pods reach it (NetworkPolicy)
tags:
  - {name: session, description: 'Who am I, sign-in, sign-out and the BFF-only session routes'}
  - {name: now, description: The Now hero}
  - {name: graphs, description: 'Metric registry, series, equipment states and band ribbons'}
  - {name: settings, description: 'Every registry setting, writes and history'}
  - {name: equipment, description: Equipment board}
  - {name: alerts, description: 'In-app alerts (alert_log); critical ones page through Alertmanager (OPS-04), never Slack (#1352)'}
  - {name: activity, description: 'activity_log: every write by people, Iris, agents and the system'}
  - {name: irrigation, description: 'Lines L01-L11, schedules, runs, minutes by zone and commands'}
  - {name: crops, description: 'Plantings on the location tree: zones, shelves and cells, moves, harvests and history'}
  - {name: law, description: 'What the controller''s climate law is doing now and why, and its decisions over time'}
  - {name: record, description: 'The daily record: band compliance, relay starts and run time, utilities and drying per local day'}
  - {name: review, description: 'The daily reviewer''s written reviews and band proposals'}
  - {name: system, description: 'Controller health, data continuity and setting delivery'}
  - {name: ops, description: Health and readiness}
security:
  - sessionCookie: []
  - operatorToken: []
    dashboardSession: []

paths:
  # ---------------------------------------------------------------- core (architecture §8)
  /v1/me:
    get:
      operationId: API-01
      tags: [session]
      summary: Signed-in user, role, writes flag and API revision
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/now:
    get:
      operationId: API-02
      tags: [now]
      summary: Now hero
      description: >-
        Indoor and outdoor climate with ages, the band in force (the dispatcher's DERIVED band rows) with a verdict
        per metric, mode, Iris status, equipment running, bursts from the controller's readback, the leak flag, the
        open-alert count, source freshness with the ingestor heartbeat, the device writer and the greenhouse snapshot.
        The climate law's state carries the band the controller is using; review is the daily review's state today
        (as API-34's today); outdoor.source says where the outdoor reading comes from; controller carries the three
        health facts the shell's banner reads. Polled every 15 s; the shell banners read `freshness`, `writer`, `leak`
        and `alerts`. Water and occupancy come from API-IRR-01.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Now'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/metrics:
    get:
      operationId: API-03
      tags: [graphs]
      summary: Metric registry over every numeric climate column, controller vitals and the daily scorecard keys
      description: >-
        Column names never come from the browser. Light carries the canopy PAR meter's `climate.ppfd_umol_m2_s` and
        `daily.dli_mol_m2_day` (#1184), which reads `v_dli_daily` and is null with its reason until a full local day of
        PPFD is covered.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: '#/components/schemas/MetricDef'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/series:
    get:
      operationId: API-04
      tags: [graphs]
      summary: Downsampled series for uPlot
      description: >-
        time_bucket_gapfill over [from, to). The bucket is the smallest of 1 min, 5 min, 15 min, 1 h, 3 h and 1 d that
        gives at most `points` buckets. Over 31 days, or when `from` is older than the raw retention of a requested
        metric that has a daily binding, the bucket is 1 d and every metric with a daily binding reads `daily_summary` (its
        `source` says so, and so does the chart); `daily.*` keys read `v_daily_scorecard`, except `daily.dli_mol_m2_day`,
        which reads `v_dli_daily`. A request of `daily.*` keys alone is 1 d buckets on America/Denver days for any window.
        Windows up to 400 days
        (else 422 `window_too_large`); buckets before a metric's `retained_from` are beyond its retention, not gaps.
        An unknown key is 422 `unknown_target`; the 10 s statement timeout is 503 `query_timeout`.
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric key from API-03; repeat for up to 8
          schema: {type: array, minItems: 1, maxItems: 8, items: {type: string}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: points
          in: query
          schema: {type: integer, minimum: 10, maximum: 2000, default: 1500}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Series'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/states:
    get:
      operationId: API-05
      tags: [graphs]
      summary: Equipment on/off intervals for the lanes
      description: >-
        From equipment_state, seeded with the state at `from` (fn_equip_at). Wet lines carry their cause from the run
        ledger. Unknown stays unknown. Windows up to 31 days. The grow lights have two lanes each: the Lutron readback
        (grow_light_main, grow_light_grow; unknown 600 s after its newest row) and the controller's switch intent
        (grow_light_main_intent, grow_light_grow_intent; Q-09), which the lanes compare with the readback (#1356).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: equipment
          in: query
          description: Only these lanes; default all
          schema: {type: array, items: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StateLanes'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/band:
    get:
      operationId: API-06
      tags: [graphs]
      summary: The house band in force and the reconstructed crop band
      description: >-
        band is the history of the dispatcher's house band rows (setpoint_snapshot band_role): DERIVED from
        crop_band_anchors with the controller's formula, kept 90 days, null before that. crop is reconstructed from
        today's anchors over the whole window: fn_band_setpoints(ts) over the step series, which gives the same crop
        values as fn_band_timeline. Release C retired the zone bands (center, south, west, east): zones are probes,
        and the law has one band. The step matches the window: at least 5
        min and at most 2,000 points. With achievable (house, windows up to 35 days; #1433), achievable adds the
        band the house can be expected to hold: at night the band widened to the expected VPD ribbon of a rolling
        14-day indoor-dewpoint fit (verdify_schemas.vpd_envelope), by day the band itself, and each night graded
        against both bands.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: zone
          in: query
          description: 'house: the law has one band, and zones are probes'
          schema: {type: string, enum: [house], default: house}
        - name: achievable
          in: query
          description: The house's achievable VPD band and its nightly grades (#1433); windows up to 35 days
          schema: {type: boolean, default: false}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BandTimeline'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings:
    get:
      operationId: API-09
      tags: [settings]
      summary: Every registry row with its device value, desired row and state, and the Band in force rows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, server_time]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Setting'}}
                  server_time: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/{param}:
    parameters: [{$ref: '#/components/parameters/Param'}]
    put:
      operationId: API-10
      tags: [settings]
      summary: Write a setting
      description: >-
        Validates (known and writable, type and range, snap), then appends one desired_state row and one activity_log
        row in one transaction and wakes the dispatcher. Codes: unknown_target, read_only, out_of_range,
        request_id_reused. A crop_band anchor write also updates its crop_band_anchors rows; an irrigation_site setting
        is delivered in the irrigation program, not by the dispatcher (R12). Before the engine firmware an
        irrigation_site write is stored and reads requested with state_reason no_engine until a program compiled
        after it is confirmed. The Equipment page's Back to automatic (a new write of sw_gl_main_auto_mode or
        sw_gl_grow_auto_mode with value 1 and reason "Back to automatic"; the page sends manual false since #1335, so a light on Auto is not counted manual) also starts a resync in the
        operator API, so the light matches the controller when the page has closed (#1300). Once the write reads
        confirmed it leaves the page 22 s for its own API-20 command, then, holding the light's lock that API-20
        shares, sends one when the write is still the newest and confirmed, no light command was recorded since it,
        the controller decided the light within 120 s and not as auto_disabled or time_invalid, no Turn on or Turn off
        started meanwhile, and the intent and the Lutron state are known and differ. Its activity_log row is API-20's
        (light.on or light.off under the writer, reason Back to automatic) with detail.via server_resync and
        detail.write_id. A resync lives in one operator API process, so a restart drops one still waiting; the BFF's
        writes flag does not reach it.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SettingWrite'}}}
      responses:
        '200':
          description: 'Stored, with state requested (or no_readback); snapped_from when snapping changed the value, manual_before when the flag changed'
          content: {application/json: {schema: {$ref: '#/components/schemas/DesiredSetting'}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: API-11
      tags: [settings]
      summary: Release to auto
      description: >-
        Appends a value = null row. The band or the dispatcher's default applies again; a writable setting
        with none of these returns to its registry default (TunableDef.default). manual is cleared.
      parameters: [{$ref: '#/components/parameters/Reason'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: 'The release row (value null, state released)'
          content: {application/json: {schema: {$ref: '#/components/schemas/DesiredSetting'}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/{param}/history:
    get:
      operationId: API-12
      tags: [settings]
      summary: Desired rows and readback steps over a window (also the Graphs setting steps)
      parameters: [{$ref: '#/components/parameters/Param'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SettingHistory'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/equipment:
    get:
      operationId: API-13
      tags: [equipment]
      summary: Equipment now, runtime and cycles today, the grow lights' Lutron state and controller intent, and why
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/alerts:
    get:
      operationId: API-14
      tags: [alerts]
      summary: Open alerts by severity then age, or recently resolved ones, repeats merged, each with its runbook
      parameters:
        - name: status
          in: query
          description: >-
            open (default) = every v_open_alerts row, acknowledged ones included. recent = open plus those resolved in
            the last 24 h. Repeats of one alert_type and sensor_id come back as one row with count and first and last seen;
            a merged row has status open while any of its repeats is unacknowledged. The rows with status open are the
            one open-alert count (API-02 alerts.open)
          schema: {type: string, enum: [open, recent], default: open}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AlertPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/alerts/{id}/ack:
    post:
      operationId: API-15
      tags: [alerts]
      summary: Acknowledge, with an optional note
      description: >-
        Acknowledges every unacknowledged repeat of the alert's alert_type and sensor_id in one transaction, records the
        person and note on each and returns the merged row, so the open-alert count drops by one.
      parameters: [{$ref: '#/components/parameters/AlertId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {note: {type: string, maxLength: 500}}
      responses:
        '200': {description: The acknowledged alert, content: {application/json: {schema: {$ref: '#/components/schemas/Alert'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/alerts/{id}/resolve:
    post:
      operationId: API-16
      tags: [alerts]
      summary: Resolve, with an optional note (never blocked)
      description: >-
        Resolves every unresolved repeat of the alert's alert_type and sensor_id in one transaction, records the person
        and resolution on each and returns the merged row. An alert whose condition persists re-opens on the next
        monitor cycle.
      parameters: [{$ref: '#/components/parameters/AlertId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {resolution: {type: string, maxLength: 500}}
      responses:
        '200': {description: The resolved alert, content: {application/json: {schema: {$ref: '#/components/schemas/Alert'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/activity:
    get:
      operationId: API-17
      tags: [activity]
      summary: Every write by people, Iris, agents and the system, newest first
      parameters:
        - name: source
          in: query
          description: dashboard, iris, system, agent (any agent) or agent:<name>
          schema: {type: string}
        - {name: actor, in: query, schema: {type: string}}
        - name: action
          in: query
          description: Prefix match, e.g. irrigation. or setting.write
          schema: {type: string}
        - name: target
          in: query
          description: Exact target, e.g. L01 or gl_main_lux_threshold
          schema: {type: string}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- Next: band preview, grow lights, daily water use
  /v1/band/preview:
    get:
      operationId: API-19
      tags: [settings]
      summary: Preview a house band anchor edit as the day's diurnal curve, before Save
      description: >-
        Read-only; Save stays API-10. Overlays the draft value on the crop_band_anchors rows fn_crop_band_value reads
        and returns the current and draft curves at 10-min steps with its four-anchor harmonic: the param's axis's
        low, target and high. Release C retired the zone VPD targets and widths (zones are probes, and the law has one
        band). Codes: unknown_target (not a house band anchor), out_of_range (outside planner_effective_bounds).
      parameters:
        - name: param
          in: query
          required: true
          description: 'A house band anchor: band_<series>_<anchor>'
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$', examples: [band_vpd_low_sm, band_temp_high_ss]}
        - name: value
          in: query
          required: true
          description: The draft value, in the setting's unit
          schema: {type: number}
        - name: day
          in: query
          description: America/Denver day; default today
          schema: {type: string, format: date}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BandPreview'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/band/profile:
    get:
      operationId: API-23
      tags: [settings]
      summary: The house band as stored and as drafted in the band editor, over one day, before Save
      description: >-
        Read-only (#1334). Reads the 24 house anchors as fn_crop_band_value resolves them and overlays the draft: any
        simple temperature field recompiles the six temperature anchors from day (solar noon) and night (solar
        midnight) values with sunrise and sunset at their midpoint, so the curve is a pure sinusoid that never leaves
        its noon and midnight values; any VPD field does the same for the VPD anchors. The edge form does the same
        from the band's low and high edges: each low or high series given an edge field compiles from its day and
        night edges with sunrise and sunset halfway between them, on the push step, an edge left out keeping the
        band's own noon or midnight value, and a series given no edge keeps its anchors; a target whose curve would
        leave its new edges anywhere in the day moves to their midpoint at all four anchors in the draft, and one
        whose curve stays between them stays. One axis given in both forms is invalid_request, and the findings of an
        axis given as edges name the edge field (for band order, the edge the target crosses). Then each anchor= item sets one raw anchor (Advanced). Curves are the controller's four-anchor harmonic at 10-min steps of fn_solar_phase,
        so the draft is the curve the controller runs. findings with severity error are what
        API-24 refuses. The expected night VPD ribbon is a 14-day indoor dewpoint fit on quiet deep-night hours and
        the forecast; night_heat_kwh is 0.19 kW/°F over the forecast's night hours. Codes: unknown_target (anchor not
        a house band anchor), out_of_range (outside planner_effective_bounds), read_only (no complete anchor set).
      parameters:
        - {name: temp_day, in: query, description: 'Temperature target at solar noon, °F', schema: {type: number}}
        - {name: temp_night, in: query, description: 'Temperature target at solar midnight, °F', schema: {type: number}}
        - {name: temp_width_day, in: query, description: '± °F around the day target', schema: {type: number, minimum: 0}}
        - {name: temp_width_night, in: query, description: '± °F around the night target', schema: {type: number, minimum: 0}}
        - {name: vpd_day, in: query, description: 'VPD target at solar noon, kPa', schema: {type: number}}
        - {name: vpd_night, in: query, description: 'VPD target at solar midnight, kPa', schema: {type: number}}
        - {name: vpd_below_day, in: query, description: kPa below the day target, schema: {type: number, minimum: 0}}
        - {name: vpd_above_day, in: query, description: kPa above the day target, schema: {type: number, minimum: 0}}
        - {name: vpd_below_night, in: query, description: kPa below the night target, schema: {type: number, minimum: 0}}
        - {name: vpd_above_night, in: query, description: kPa above the night target, schema: {type: number, minimum: 0}}
        - {name: temp_low_day, in: query, description: 'Edge form: the low edge at solar noon, °F', schema: {type: number}}
        - {name: temp_high_day, in: query, description: 'Edge form: the high edge at solar noon, °F', schema: {type: number}}
        - {name: temp_low_night, in: query, description: 'Edge form: the low edge at solar midnight, °F', schema: {type: number}}
        - {name: temp_high_night, in: query, description: 'Edge form: the high edge at solar midnight, °F', schema: {type: number}}
        - {name: vpd_low_day, in: query, description: 'Edge form: the VPD low edge at solar noon, kPa', schema: {type: number}}
        - {name: vpd_high_day, in: query, description: 'Edge form: the VPD high edge at solar noon, kPa', schema: {type: number}}
        - {name: vpd_low_night, in: query, description: 'Edge form: the VPD low edge at solar midnight, kPa', schema: {type: number}}
        - {name: vpd_high_night, in: query, description: 'Edge form: the VPD high edge at solar midnight, kPa', schema: {type: number}}
        - name: anchor
          in: query
          description: 'Advanced: one raw house anchor as param:value, repeatable'
          schema: {type: array, items: {type: string, pattern: '^band_(temp|vpd)_(low|target|high)_(sr|sm|ss|mid):', examples: ['band_temp_low_sr:62.5']}}
        - name: day
          in: query
          description: America/Denver day; default today
          schema: {type: string, format: date}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BandProfilePreview'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: API-24
      tags: [settings]
      summary: Save the band editor's draft, every changed house anchor in one write
      description: >-
        The same draft as API-23 (profile fields or edges, and Advanced anchors). In one transaction: each house
        anchor the draft changes (by more than half the push quantum, 0.1 °F or 0.01 kPa) is an API-10 write, its
        desired_state row with the manual flag and its crop_band_anchors rows, and one activity_log row, action
        band.write, target "house band", detail {desired_ids, changes [{param, desired_id, before, value}],
        anchor_rows, manual, profile, simple, edges, edges_simple}. Under the edge form a target whose curve would
        leave its new edges moves to their midpoint at all four anchors in the same write. One axis given in both forms is
        invalid_request. The dispatcher's anchor sync delivers the anchors; nothing talks to the controller. Codes:
        out_of_range (an API-23 error finding: band order, the 40/100 °F guardrails 5 °F outside the band, the 0.3-3.0
        kPa VPD guardrails or the 0.74 kPa night floor; or an anchor outside its bounds), invalid_request (the draft
        changes nothing), read_only (Iris: the band is operator-owned), unknown_target, request_id_reused.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BandSave'}}}
      responses:
        '200': {description: 'Stored; each changed anchor with state requested', content: {application/json: {schema: {$ref: '#/components/schemas/BandWrite'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/soil-targets:
    get:
      operationId: API-SOIL-01
      tags: [settings]
      summary: Every probe zone's soil-moisture target (#1345)
      description: >-
        One row per probe zone (south_1, south_2, west) from soil_moisture_targets (migration 303): wilt_pct, min_pct,
        max_pct and saturation_pct in percent, always 0 <= wilt < min < max < saturation <= 100; the note; the probe
        (climate column) and sensor it applies to and the crops.zone whose plantings let soil_dryout page; who last
        changed it, when and why. No crop name: targets are plant-agnostic.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SoilTargets'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/soil-targets/{zone}:
    put:
      operationId: API-SOIL-02
      tags: [settings]
      summary: Change one zone's soil-moisture thresholds or note (#1345)
      description: >-
        A field left out keeps its stored value; the merged row must keep 0 <= wilt < min < max < saturation <= 100.
        One transaction: the soil_moisture_targets row (with updated_at, updated_by, updated_source and the reason) and
        one activity_log row, action soil_target.write, target the zone, detail {ref, zone, changed {field: {from,
        to}}}. The ingestor's soil_dryout rule pages on the new wilt_pct from its next cycle; nothing talks to the
        controller. Codes: out_of_range (a value outside 0-100 or the order broken), invalid_request (nothing to
        change), not_found (no such zone), request_id_reused.
      parameters:
        - {name: zone, in: path, required: true, schema: {type: string, examples: [west]}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SoilTargetWrite'}}}
      responses:
        '200': {description: 'Stored', content: {application/json: {schema: {$ref: '#/components/schemas/SoilTarget'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/equipment/lights/{light}/{state}:
    post:
      operationId: API-20
      tags: [equipment]
      summary: Turn a grow light on or off through verdify-setpoint-server (Lutron)
      description: >-
        Calls verdify-setpoint-server POST /lights/{light}/{state} (12 s cap) and records one activity_log row:
        light.on or light.off, target grow_light_main or grow_light_grow, detail {light, state, result, minutes}. A
        manual switch is timed like the Fans burst (#1335): minutes, 15 by default, from the row's ts; then the
        operator API sends the controller's intent through verdify-setpoint-server, recording one more light.on or
        light.off row (actor system light_timer, reason "Timer ended", detail.via timer), so the light is back on
        automatic within about 15 s of the end. During the minutes the controller can still switch the light when its
        own decision changes, which only brings automatic back early. 200 when
        setpoint-server saw Lutron reach the state. When Home Assistant or Lutron does not confirm: 503 unavailable,
        retryable, with result ha_failed, not_confirmed or timeout; the light may still switch late. The board's state
        comes only from API-13's Lutron readback. Back to automatic is API-10 on sw_gl_main_auto_mode or
        sw_gl_grow_auto_mode, which can send one command of its own (API-10). The call and its row hold the light's
        lock: a press waits up to 2.5 s for a Back to automatic resync that holds it, then goes ahead, so it reaches
        setpoint-server after that resync's command and wins. The writes flag gates it like every write, and it never
        touches the ESP32.
      parameters:
        - {name: light, in: path, required: true, schema: {type: string, enum: [main, grow]}}
        - {name: state, in: path, required: true, schema: {type: string, enum: ['on', 'off']}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
                minutes: {type: integer, minimum: 1, maximum: 120, default: 15, description: 'How long the manual switch lasts before the light goes back to automatic'}
      responses:
        '200': {description: Lutron reached the state, content: {application/json: {schema: {$ref: '#/components/schemas/LightCommand'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/water/daily:
    get:
      operationId: API-21
      tags: [irrigation]
      summary: Daily water use from the site meter by line and cause, with no-valve water apart
      description: >-
        One entry per America/Denver day, in whole gallons: the meter's day total, Verdify-valve water by line and by
        cause, and the water that ran while no Verdify valve was open (the hose, sink, hydro or a leak). The parts are
        attributed per run and can sit a gallon off the total; nothing is rescaled. A no_data day is null, never 0.
        There is no rate and no flow flag.
      parameters:
        - name: days
          in: query
          description: Days ending today, today included
          schema: {type: integer, enum: [30, 90], default: 30}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/WaterUse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/lighting:
    get:
      operationId: API-22
      tags: [graphs]
      summary: 'The grow lights by day: on time, starts, the policy in force and qualified light minutes against target'
      description: >-
        Graphs → Lighting (#1357). One entry per America/Denver day the window touches, up to now, for main and grow:
        on time and starts from the Lutron readback over the whole day; the controller's readback of its ON threshold,
        hysteresis, start hour, cutoff hour and target light minutes in force at the day's end; and the qualified light
        minutes, v_lighting_minutes_status_now's rule for every day: each minute from the start hour to the cutoff (or
        now) counts once when its mean Tempest outdoor lux is at or above the ON threshold or the light was on. No DLI
        until the PAR meter (#1184). Windows up to 31 days.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LightingDays'}}}}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- climate law, daily record, daily review and system (dashboard v2)
  /v1/law:
    get:
      operationId: API-30
      tags: [law]
      summary: What the controller's climate law is doing now and why
      description: >-
        From the newest law record, drying meter and constants hash in system_state (climate_law_state,
        climate_drying_meter, climate_law_constants, outdoor_source, lead_fan), the newest non-null diagnostics value
        per column over 15 min, the newest equipment_state row per relay with its start, the newest climate row,
        fn_band_setpoints(now()) for the host's band, v_desired_state_current for the owner's drying cost limit, today's
        daily_record row and the law constants this API build was generated from. Every threshold is computed from the
        band in use and those constants. A value the controller has not reported is null, never 0. Polled every 15 s
        by Climate, System and Now.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LawView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/law/history:
    get:
      operationId: API-31
      tags: [law]
      summary: The law's requests, latches, drying, outdoor source, drying price and band over a window
      description: >-
        From the climate_law_state and outdoor_source rows in [from, to), compressed to change intervals in the
        database. A span of more than 180 s with no law record is unknown. cost and band use API-04's bucket ladder
        with at most 1,500 points. request.fan1 is at least one fan, request.fan2 both fans. Windows up to 31 days
        (else 422 window_too_large); the 10 s statement timeout is 503 query_timeout.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LawHistory'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/record/days:
    get:
      operationId: API-32
      tags: [record]
      summary: The daily record per local day with its 7- and 30-day means
      description: >-
        One row per America/Denver day, oldest first: compliance from daily_band_compliance, relay starts and run time
        from the daily relay record (v_dashboard_relay_day), utilities, water and drying from daily_record, and the
        alert counts from v_daily_scorecard. The means cover complete days only. Up to 400 days (else 422
        window_too_large); the default is the 30 days ending today.
      parameters:
        - {name: from, in: query, description: 'First local day; default 29 days before to', schema: {type: string, format: date}}
        - {name: to, in: query, description: 'Last local day, inclusive; default today', schema: {type: string, format: date}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DailyRecord'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/record/relay-check:
    get:
      operationId: API-33
      tags: [record]
      summary: The controller's own relay counters against the stored daily relay record
      description: From v_relay_counter_reconciliation_daily, newest day first.
      parameters:
        - name: days
          in: query
          description: Days ending today, today included
          schema: {type: integer, enum: [7, 14, 30], default: 7}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCheck'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/reviews:
    get:
      operationId: API-34
      tags: [review]
      summary: The daily reviewer's reviews, newest first, today's review state and the proposal waiting for the owner
      description: >-
        From v_dashboard_review, the open daily_review_missed alert and the activity_log rows with action band.write.
        A proposal is waiting on the newest written review that carries one when no band.write followed its
        written_at; answered when one did; superseded when a newer written review exists. tokens.rise_pct compares the
        newest review with the 7-review mean of the reviews before it.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 60, default: 30}}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/system/controller:
    get:
      operationId: API-35
      tags: [system]
      summary: The controller's hardware budget now, against its limits
      description: >-
        The newest non-null diagnostics value per column over 15 min, by the same SQL as the operator API's product
        metrics (CONTROLLER_SQL and HEALTH_SQL), with system_state ingestor_counters and climate_law_constants. limits
        are the hardware-budget thresholds from their one existing definition. Trends come from API-04.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ControllerHealth'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/system/data:
    get:
      operationId: API-36
      tags: [system]
      summary: Whether telemetry is flowing, what was lost and what the gap log restored
      description: >-
        From v_data_gaps_unreplayed, v_dashboard_gap_replay, the product metrics' FRESHNESS_SQL, FLOW_SQL and
        PROBES_SQL, system_state (ingestor_heartbeat, ingestor_counters, setpoint_snapshot_pass, dispatcher_stage) and
        diagnostics.gap_log_state, over the days ending now.
      parameters:
        - name: days
          in: query
          description: Days ending now
          schema: {type: integer, enum: [1, 7, 30], default: 1}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DataContinuity'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/system/delivery:
    get:
      operationId: API-37
      tags: [system]
      summary: Whether the controller took what the host pushed
      description: >-
        From setpoint_changes in the window (by ts), system_state dispatcher_stage and setpoint_snapshot_pass, and the
        product metrics' DELIVERY_SQL and OLDEST_UNCONFIRMED_SQL, so the dashboard and the estate dashboard agree.
      parameters:
        - name: hours
          in: query
          description: Hours ending now
          schema: {type: integer, enum: [24, 168], default: 24}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Delivery'}}}}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- irrigation (irrigation.md §8.1)
  /v1/irrigation:
    get:
      operationId: API-IRR-01
      tags: [irrigation]
      summary: Lines, active runs, program sync and the engine flag, minutes today, limits, leak and occupancy
      description: >-
        Polled every 15 s, and every 5 s while a program write is requested or a command is pending. Before the engine
        firmware, engine is false, program.src is null with its reason, and line states come from relay edges only.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/IrrigationStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/schedules:
    get:
      operationId: API-IRR-02
      tags: [irrigation]
      summary: Schedules with sync state, the 7-day week planned against actual, bounds per line kind and solar times
      parameters:
        - name: days
          in: query
          description: Days ahead from the start of today
          schema: {type: integer, minimum: 1, maximum: 7, default: 7}
        - name: past_days
          in: query
          description: Past days of occurrences with their outcomes
          schema: {type: integer, minimum: 0, maximum: 7, default: 0}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleAgenda'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: API-IRR-03
      tags: [irrigation]
      summary: Create a schedule
      description: >-
        Codes: out_of_range, too_close (30 min on one line), too_many_schedules (24), unknown_target,
        request_id_reused. A schedule on a disabled line, one over the line's daily cap, and a mist
        schedule on a zone with schedule_member off are all accepted; their occurrences end skipped or cap, with the
        reason in words.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleCreate'}}}
      responses:
        '201':
          description: 'Created, sync requested until the controller''s program hash matches'
          content: {application/json: {schema: {$ref: '#/components/schemas/Schedule'}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/schedules/{slot_id}:
    parameters: [{$ref: '#/components/parameters/SlotId'}]
    put:
      operationId: API-IRR-04
      tags: [irrigation]
      summary: Edit, enable or disable a schedule; set manual
      description: >-
        Omitted fields keep their value, except manual: a REST edit that omits it stores true (R3). Same codes as
        API-IRR-03; Iris only, on a manual schedule, manual.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInput'}}}
      responses:
        '200': {description: 'Stored, sync requested', content: {application/json: {schema: {$ref: '#/components/schemas/Schedule'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: API-IRR-05
      tags: [irrigation]
      summary: Delete a schedule (its slot_id is never reused)
      parameters: [{$ref: '#/components/parameters/Reason'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Deleted; the program banner shows the push}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/lines/{line_id}/run:
    post:
      operationId: API-IRR-06
      tags: [irrigation]
      summary: Run now
      description: >-
        Starts at once or is refused: line_busy, manifold_busy, cap_reached, line_disabled, line_paused, line_faulted,
        not_schedule_member (mist, until the controller runs #1343's firmware). Any wired, enabled line runs once
        (#1343), and fog (L11) runs once for minutes (#1343 follow-up), 503 unavailable until the controller runs the
        firmware that takes it. The master valve L03 takes no run of its own: it opens only with a fertilized relay
        (L02, L06, L08, L10), never with clean water (#1336). The API refuses what it can see in the newest irr_state
        (422); otherwise the line's irr_state shows whether it started. Before the engine firmware only L01 runs, through the
        btn_wall_clean bridge, for its configured irrig_wall_duration_min (minutes, if sent, must equal it); any other
        line is 503 unavailable and nothing is stored.
      parameters: [{$ref: '#/components/parameters/LineId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/stop:
    post:
      operationId: API-IRR-07
      tags: [irrigation]
      summary: Stop one line, or every line when line_id is omitted
      description: >-
        Never blocked, including by DASHBOARD_WRITES_ENABLED; never heap-deferred; sent ahead of any program push and
        re-sent until the relays read OFF (at most 2 min). Ends what is running now and disables nothing: VPD misting,
        survival fog and the next scheduled run can still start (disable the line to keep it off), and the dashboard's
        Stop result toast (VD-05) and the MCP tool description (VD-64, VD-61) say so. Before the engine firmware it
        works on one line or every line through the run-now bridge: it ends the
        legacy drip job (the sw_irrig_* enables) and turns the open wet relays off; their guards block only turn-on,
        so VPD misting may pulse again.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/LineCommand'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/lines/{line_id}:
    put:
      operationId: API-IRR-08
      tags: [irrigation]
      summary: Enable or disable a line with its check; VPD and Schedule flags on misters; caps; pause or resume; manual
      description: >-
        line_id all accepts only paused_until (pause or resume every line). vpd_member and schedule_member are for
        L04, L07 and L09. Enabling a line with no check, or turning schedule_member on for the first time, needs
        checked true, which only the dashboard sends (check_required). Disabling stops everything on the line, VPD
        misting included. vpd_member true on a line that is and stays disabled is line_disabled: the controller acts on
        VPD membership only while the line is enabled. Pause, resume and the check never change manual; any other edit
        that omits it stores true (R3). Codes: out_of_range, check_required, line_disabled,
        unknown_target, request_id_reused; Iris only, on a manual line, manual.
      parameters:
        - name: line_id
          in: path
          required: true
          schema: {type: string, pattern: '^(L(0[1-9]|1[01])|all)$'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LineUpdate'}}}
      responses:
        '200':
          description: The changed lines, sync requested
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties: {lines: {type: array, items: {$ref: '#/components/schemas/IrrigationLine'}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/minutes:
    get:
      operationId: API-IRR-10
      tags: [irrigation]
      summary: Minutes, pulses and gallons per day by zone, line or cause (v_irrigation_minutes_daily), up to 400 days
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: Inclusive local day, schema: {type: string, format: date}}
        - {name: group_by, in: query, schema: {type: string, enum: [zone, line, cause], default: zone}}
        - {name: purpose, in: query, description: 'Keep irrigation or climate rows only (#1348); omitted, both', schema: {$ref: '#/components/schemas/RunPurpose'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MinutesReport'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/runs:
    get:
      operationId: API-IRR-11
      tags: [irrigation]
      summary: Run ledger, newest first; windows up to 31 days
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - {name: line, in: query, schema: {$ref: '#/components/schemas/LineId'}}
        - {name: cause, in: query, schema: {$ref: '#/components/schemas/IrrigationCause'}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/RunOutcome'}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: purpose, in: query, description: 'Keep irrigation or climate runs only (#1348); omitted, both', schema: {$ref: '#/components/schemas/RunPurpose'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RunPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/equipment/override:
    post:
      operationId: API-IRR-12
      tags: [irrigation, equipment]
      summary: Bursts and restart through manual_override (replaces the Home Assistant buttons)
      description: >-
        fans, humidify and vent_bypass set only the controller's deadline latch for that burst to now + minutes; clear
        zeroes them; restart reboots the controller safely. It never changes occupancy. Now shows a burst from the
        controller's readback, not from this command. No MCP tool in MVP. Before the engine firmware: 503 unavailable.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OverrideRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/irrigation/clear-fault:
    post:
      operationId: API-IRR-13
      tags: [irrigation]
      summary: Clear a mister watchdog latch (irr_command clear_fault)
      description: >-
        With line_id (L04, L07 or L09), clears that zone's D-IRP-19 latch; without it, every latch. There is no drip
        leak latch (Round 2 #3). Before the engine firmware: 503 unavailable.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/LineCommand'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- BFF sign-in (served by the Express BFF)
  # ---------------------------------------------------------------- crops (#1327, #1330)
  /v1/crops/locations:
    get:
      operationId: API-CROP-01
      tags: [crops]
      summary: Every zone, shelf and cell with its layout and water lines, and what each holds now
      description: >-
        A zone or a shelf holds any number of plantings; a cell holds at most one at a time. Water lines are the
        irrigation lines that reach each shelf (shelf_water_lines).
      parameters:
        - {name: zone, in: query, description: Keep one zone (a zone slug), schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Locations'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings:
    get:
      operationId: API-CROP-02
      tags: [crops]
      summary: Plantings, active first and newest first
      parameters:
        - {name: active, in: query, description: 'true keeps active plantings (default), false ended ones; omit with an empty value for both', schema: {type: [boolean, 'null'], default: true}}
        - {name: zone, in: query, description: Plantings that were ever in this zone, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}}
        - {name: since, in: query, description: Planted or ended on or after this day, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlantingList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: API-CROP-07
      tags: [crops]
      summary: Record a planting across the places named
      description: >-
        positions are place texts (EAST-HYDRO-12, EAST-HYDRO-1..10, hydro 1-30, rail A top, west top 1-3, south
        floor, hanging, center); API-CROP-06 previews them. Codes: invalid_request (a place it cannot read),
        ambiguous_position (current lists the candidates), position_occupied (a requested cell is held at planted_at;
        replace ends or trims the occupant instead), request_id_reused. Writes records only: no setting, band or
        target changes (the grow-light window still follows the active crops' DLI targets, fn_lighting_policy).
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingCreate'}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings/{planting_id}:
    parameters: [{$ref: '#/components/parameters/PlantingId'}]
    get:
      operationId: API-CROP-03
      tags: [crops]
      summary: One planting with every place it has been, its events and its harvests
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlantingDetail'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: API-CROP-11
      tags: [crops]
      summary: Correct a planting's variety, count (null is unknown), stage, notes or expected harvest
      description: Only the fields sent change. Places change through API-CROP-08. Codes as API-CROP-07, and unknown_target.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingPatch'}}}
      responses:
        '200': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings/{planting_id}/move:
    parameters: [{$ref: '#/components/parameters/PlantingId'}]
    post:
      operationId: API-CROP-08
      tags: [crops]
      summary: Move a planting; the old and new places both stay in its history
      description: >-
        from_positions (default: every place it is now) close at moved_at and to_positions open then. Codes as
        API-CROP-07, plus planting_ended and unknown_target.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingMove'}}}
      responses:
        '200': {description: Moved, content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings/{planting_id}/harvest:
    parameters: [{$ref: '#/components/parameters/PlantingId'}]
    post:
      operationId: API-CROP-09
      tags: [crops]
      summary: Record a harvest; partial unless final, which ends the planting as harvested
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingHarvest'}}}
      responses:
        '200': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings/{planting_id}/remove:
    parameters: [{$ref: '#/components/parameters/PlantingId'}]
    post:
      operationId: API-CROP-10
      tags: [crops]
      summary: End a planting without a harvest (failed, removed or reconciled)
      description: Every open place closes at `at`. Undo by recording the planting again.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingEnd'}}}
      responses:
        '200': {description: Ended, content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/plantings/{planting_id}/notes:
    parameters: [{$ref: '#/components/parameters/PlantingId'}]
    post:
      operationId: API-CROP-12
      tags: [crops]
      summary: Add a note to a planting's history (ended plantings too)
      description: >-
        The crops service's annotate function, the one MCP annotate_planting uses: one crop_events note row and one
        activity_log row (action planting.note) in one transaction. Codes: unknown_target (no such planting),
        request_id_reused.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlantingNote'}}}
      responses:
        '200': {description: 'Noted; the planting with the note in its history', content: {application/json: {schema: {$ref: '#/components/schemas/Planting'}}}}
        '422': {$ref: '#/components/responses/Invalid'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/positions/{label}/history:
    get:
      operationId: API-CROP-04
      tags: [crops]
      summary: Who has held one cell, current first
      parameters:
        - {name: label, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{0,39}$', examples: [EAST-HYDRO-12]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PositionHistory'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/catalog:
    get:
      operationId: API-CROP-05
      tags: [crops]
      summary: The crop catalog with plain names
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Catalog'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crops/resolve:
    get:
      operationId: API-CROP-06
      tags: [crops]
      summary: Preview what a place text means and which plantings hold those cells; writes nothing
      description: >-
        A GET, so viewers can preview and DASHBOARD_WRITES_ENABLED never blocks it. Codes: invalid_request,
        ambiguous_position (current lists the candidates).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}, examples: {hydro: {value: 'hydro 1-10'}}}
        - {name: at, in: query, description: When (default now), schema: {type: string, format: date-time}}
        - {name: planting, in: query, description: 'Leave this planting out of the conflicts (a move''s own cells)', schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Resolution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /auth/login:
    x-served-by: bff
    servers: [{url: 'https://dashboard.verdify.ai'}]
    get:
      operationId: BFF-01
      tags: [session]
      summary: Start sign-in
      description: >-
        Sets the sealed __Host-verdify_login cookie (state, nonce, PKCE verifier and returnTo; AES-256-GCM; 10 min) and
        redirects to the authorization_endpoint discovered from issuer
        https://auth.vallery.net/application/o/verdify-dashboard/ (https://auth.vallery.net/application/o/authorize/)
        with client_id=verdify-dashboard, scope openid profile email groups and code_challenge_method=S256. A page
        without a session answers 302 to /auth/login?returnTo=<path> (for /, returnTo=%2F); MFA happens at Authentik.
        A refusal answers its status with the SCR-09 card (text/html) at the same URL.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Same-origin relative path; anything else becomes /
          schema: {type: string}
      responses:
        '302':
          description: To Authentik
          headers: {Location: {schema: {type: string}}, Set-Cookie: {schema: {type: string}}}
        '503':
          description: 'Sign-in is unavailable: Authentik cannot be reached (existing sessions keep working)'
          content: {text/html: {schema: {type: string}}}
  /auth/callback:
    x-served-by: bff
    servers: [{url: 'https://dashboard.verdify.ai'}]
    get:
      operationId: BFF-02
      tags: [session]
      summary: Finish sign-in
      description: >-
        Exchanges the code with the client secret and verifier, verifies the ID token (sub, preferred_username, name,
        groups), maps groups to a role (operators wins), creates the session with INT-01 and sets
        __Host-verdify_session (HttpOnly, Secure, SameSite=Lax, Path=/, 12 h). No tokens reach the browser. The login
        cookie is cleared on every outcome; a refusal answers its status with the SCR-09 card (text/html) at the same
        URL.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: To returnTo, with the session cookie set and the login cookie cleared
          headers: {Location: {schema: {type: string}}, Set-Cookie: {schema: {type: string}}}
        '400':
          description: 'Sign-in did not complete (state mismatch, a missing, expired or tampered login cookie, an Authentik error or a refused code exchange); no session cookie'
          content: {text/html: {schema: {type: string}}}
        '403':
          description: 'No access: signed in, but in neither verdify-dashboard-operators nor verdify-dashboard-viewers; no INT-01 call'
          content: {text/html: {schema: {type: string}}}
        '503':
          description: 'Sign-in is unavailable: Authentik (discovery or the token endpoint) cannot be reached, or INT-01 fails; no session cookie'
          content: {text/html: {schema: {type: string}}}
  /auth/logout:
    x-served-by: bff
    servers: [{url: 'https://dashboard.verdify.ai'}]
    post:
      operationId: BFF-03
      tags: [session]
      summary: Sign out
      description: >-
        Needs the exact Origin. Deletes the session (INT-02), clears the cookie and redirects to Authentik's
        end-session endpoint with post_logout_redirect_uri https://dashboard.verdify.ai/. With Authentik's discovery
        unavailable it still deletes and clears, then redirects to /.
      security: [{sessionCookie: []}, {}]
      responses:
        '303':
          description: To the Authentik end-session endpoint, or to / while its discovery is unavailable
          headers: {Location: {schema: {type: string}}, Set-Cookie: {schema: {type: string}}}
        '403': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- BFF-only session routes (operator API, never proxied)
  /internal/sessions:
    servers: [{url: 'http://verdify-operator-api.verdify-prod.svc:8090'}]
    post:
      operationId: INT-01
      tags: [session]
      summary: Create a session after the BFF verified the ID token
      description: >-
        Returns the token once; dashboard_session keeps only its sha256. X-Authentik-* headers are ignored. A request
        that carries X-Dashboard-Session is refused (403): the proxy always sends that header and the BFF's
        session-create call never does, so no proxied user request can reach this route.
      security: [{operatorToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SessionToken'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /internal/sessions/current:
    servers: [{url: 'http://verdify-operator-api.verdify-prod.svc:8090'}]
    delete:
      operationId: INT-02
      tags: [session]
      summary: Delete the session named by X-Dashboard-Session
      security: [{operatorToken: [], dashboardSession: []}]
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- health and readiness (both tiers, unauthenticated)
  /healthz:
    x-served-by: bff+operator-api
    servers:
      - {url: 'https://dashboard.verdify.ai', description: BFF}
      - {url: 'http://verdify-operator-api.verdify-prod.svc:8090', description: Operator API}
    get:
      operationId: OPS-01
      tags: [ops]
      summary: Liveness, static 200 (successful probes are not logged)
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {status: {type: string, const: ok}}}}}}
  /readyz:
    x-served-by: bff+operator-api
    servers:
      - {url: 'https://dashboard.verdify.ai', description: 'BFF: config loaded; Authentik and operator API reachability reported, not gating'}
      - {url: 'http://verdify-operator-api.verdify-prod.svc:8090', description: 'Operator API: SELECT 1 on its attested pool'}
    get:
      operationId: OPS-02
      tags: [ops]
      summary: Readiness with the source revision
      security: []
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}}
        '503': {description: Not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}}
  /metrics:
    x-served-by: operator-api
    servers:
      - {url: 'http://verdify-operator-api.verdify-prod.svc:8090', description: 'Operator API: Prometheus scrapes it (NetworkPolicy allow-operator-api-metrics-scrape)'}
    get:
      operationId: OPS-04
      tags: [ops]
      summary: Open-alert gauge for Alertmanager paging (#1352)
      description: |
        Prometheus text. `verdify_alert_open{severity, alert_type}` counts the merged alerts with status `open`, the
        rows the Now count shows; Alertmanager pages the critical ones. `verdify_alert_metrics_up` is 0 when the read
        failed. No alert text, session or token.
      security: []
      responses:
        '200': {description: OK, content: {text/plain: {schema: {type: string}}}}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-verdify_session
      description: Browser session from BFF-02 (12 h). The BFF sends it on as X-Dashboard-Session with the bearer token.
    operatorToken:
      type: http
      scheme: bearer
      description: Shared BFF-to-API token (Secret verdify-operator-api, key operator-api-token)
    dashboardSession:
      type: apiKey
      in: header
      name: X-Dashboard-Session
      description: The session cookie value; resolved to a dashboard_session row (by sha256, cached 30 s) for user and role

  parameters:
    From: {name: from, in: query, required: true, description: Window start (inclusive), schema: {type: string, format: date-time}}
    To: {name: to, in: query, required: true, description: Window end (exclusive), schema: {type: string, format: date-time}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, description: next_cursor from the previous page, schema: {type: string}}
    Reason: {name: reason, in: query, schema: {type: string, maxLength: 500}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Optional on every write; stored as request_id on the write's activity_log row and logged as the request id.
        The same key and payload return the stored result with the header Idempotency-Replayed: true; the same key
        with a different payload is 422 request_id_reused.
      schema: {type: string, format: uuid}
    Param:
      name: param
      in: path
      required: true
      description: tunable_registry name
      schema: {type: string, pattern: '^[a-z][a-z0-9_]*$', examples: [gl_main_lux_threshold]}
    AlertId: {name: id, in: path, required: true, schema: {type: integer}}
    SlotId: {name: slot_id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 65535}}
    LineId: {name: line_id, in: path, required: true, schema: {$ref: '#/components/schemas/LineId'}}
    PlantingId: {name: planting_id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 2147483647}}

  responses:
    Problem:
      description: Error; see the Errors rule in the API description
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Invalid:
      description: Validation or refusal; code says why and nothing was stored or sent
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            title: Out of range
            status: 422
            code: out_of_range
            detail: Must be 0.50-2.50 kPa
            retryable: false
            field: value
            min: 0.5
            max: 2.5
            current: 1.6
    Accepted:
      description: >-
        Stored for the device writer: pending until sent (at most once), or failed if not sent within 2 min. Relay
        edges and the line's irr_state show what happened.
      content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}

  schemas:
    # ------------------------------------------------------------ shared
    Problem:
      type: object
      description: RFC 9457 problem details. The UI maps code to words and shows an unknown code raw.
      required: [title, status, code, retryable]
      properties:
        type: {type: string, format: uri-reference, default: 'about:blank'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string, description: In plain words}
        code: {$ref: '#/components/schemas/ProblemCode'}
        retryable: {type: boolean}
        field: {type: string, description: 'Request field at fault, e.g. on_s'}
        min: {type: [number, 'null']}
        max: {type: [number, 'null']}
        current: {type: [number, string, boolean, 'null'], description: Current stored or device value}
        retry_after_s: {type: [integer, 'null'], description: 'When a retry may succeed (line_busy, manifold_busy), if known'}
        result: {type: string, enum: [ha_failed, not_confirmed, timeout], description: 'API-20 only, with unavailable: Home Assistant failed the call, Lutron did not reach the state, or no answer within 12 s'}
        request_id: {type: string, description: 'The request id (the Idempotency-Key on a write), as logged'}
    ProblemCode:
      type: string
      description: >-
        Stable codes shared with MCP (architecture §5.3, irrigation §4.3 and §4.7). manual is for Iris only.
        position_occupied, ambiguous_position and planting_ended are the plantings' refusals (API-CROP-06 to -11).
        study_state, the retired planner study's (API-28), was removed in release C
      enum: [invalid_request, unauthenticated, forbidden, origin_mismatch, not_found, writes_disabled, query_timeout,
        unavailable, window_too_large, unknown_target, read_only, out_of_range, manual, request_id_reused,
        check_required, too_close, too_many_schedules, line_disabled, line_paused, line_faulted, not_schedule_member,
        line_busy, manifold_busy, cap_reached, position_occupied, ambiguous_position, planting_ended]
    Actor:
      type: object
      description: 'Who wrote (R4). system is the platform itself, for example the forecast action engine'
      required: [source, name]
      properties:
        source: {type: string, pattern: '^(dashboard|iris|system|agent:[a-z0-9][a-z0-9_-]*)$', examples: [dashboard, iris, 'agent:steward', 'agent:admin']}
        name: {type: string, description: 'Authentik username, iris, the agent name (admin for the admin MCP token) or forecast-engine'}
    Freshness:
      type: object
      description: >-
        How old a source is. A sensor source is stale when its age exceeds twice its cadence; the ingestor heartbeat
        (cadence 60 s) after 180 s; a change-only source (equipment_state, irr_state) only while the controller is
        offline; a source never seen is stale
      required: [observed_at, age_s, stale]
      properties:
        observed_at: {type: [string, 'null'], format: date-time}
        age_s: {type: [integer, 'null']}
        cadence_s: {type: integer}
        stale: {type: boolean}
    Reading:
      type: object
      required: [value, observed_at]
      properties:
        value: {type: [number, 'null']}
        observed_at: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null'], description: 'Why value is null, in words'}
    TimedValue:
      type: object
      required: [at, value]
      properties:
        at: {type: string, format: date-time}
        value: {type: [number, 'null']}
    NullableNumbers: {type: array, items: {type: [number, 'null']}}
    ReadbackState:
      type: string
      description: >-
        Computed on every read (architecture §5.5); display only. A dispatcher clamp reads not_confirmed at once, with
        state_reason clamped (release C retired held, which a clamp or an armed experiment read). Irrigation items and the
        irrigation_site settings use requested, confirmed and not_confirmed against the controller's program hash;
        before the engine firmware they stay requested. not_confirmed is only a request at least 5 min old the
        readback does not match; a setting nobody requested with no readback reads no_readback (#1333).
      enum: [requested, confirmed, not_confirmed, no_readback, overridden, released]
    StateReason:
      type: object
      description: >-
        Why a value is not confirmed, when the platform knows (architecture §5.5): clamped (a dispatcher
        clamp; applied_value), deferred (controller heap low),
        push_failed (setpoint_changes.delivery_status after the request), writer_down (the ingestor heartbeat is older
        than 180 s: "Ingestor not running since HH:MM"), controller_not_reporting (heartbeat fresh, newest climate row
        older than 300 s: "Controller not reporting since HH:MM"), no_engine (an irrigation_site write stored before
        the engine firmware: "applies with the irrigation firmware"; it stays requested) or no_match ("Sent HH:MM; no
        matching readback yet"). since gives each HH:MM
      required: [code]
      properties:
        code: {type: string, enum: [clamped, deferred, push_failed, writer_down, controller_not_reporting, no_engine, no_match]}
        detail: {type: [string, 'null'], description: 'In words, e.g. the guard that clamped it or the push status'}
        applied_value: {type: [number, 'null'], description: 'What the dispatcher sent instead, when clamped'}
        since:
          type: [string, 'null']
          format: date-time
          description: >-
            When the reason began, null when not known. writer_down: the newest ingestor heartbeat.
            controller_not_reporting: the newest climate row. no_match, push_failed and deferred: the push the request
            went out in (the "Sent HH:MM" time). clamped: the clamp row. no_engine: the stored write
    DesiredSetting:
      type: object
      description: The newest desired_state row for a setting and its readback state. value null means released.
      required: [id, param, value, manual, state, actor, created_at]
      properties:
        id: {type: integer}
        param: {type: string}
        value: {type: [number, 'null'], description: Stored value after snapping}
        snapped_from: {type: [number, 'null'], description: Submitted value when snapping changed it (write responses)}
        manual: {type: boolean, description: Iris skips the setting while true}
        manual_before: {type: [boolean, 'null'], description: The flag before this write (write responses)}
        state: {$ref: '#/components/schemas/ReadbackState'}
        state_reason: {anyOf: [{$ref: '#/components/schemas/StateReason'}, {type: 'null'}]}
        confirmed_at: {type: [string, 'null'], format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
        reason: {type: [string, 'null'], maxLength: 500}
        created_at: {type: string, format: date-time}
    Series:
      type: object
      description: uPlot columns. A bucket with no data is null, never 0; count gives coverage.
      required: [from, to, bucket_s, t, series, watermark, server_time]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        bucket_s: {type: integer, enum: [60, 300, 900, 3600, 10800, 86400]}
        t: {type: array, items: {type: integer}, description: 'Bucket starts, epoch seconds'}
        series: {type: object, additionalProperties: {$ref: '#/components/schemas/SeriesColumns'}, description: By metric key}
        watermark: {type: [string, 'null'], format: date-time, description: Newest sample included}
        server_time: {type: string, format: date-time}
        gaps:
          type: array
          description: >-
            The data_gaps rows (telemetry outages the ingestor recorded, kept with no retention) that overlap [from,
            to), oldest first. A null run inside one is that outage; a null run with none has no known reason
          items:
            type: object
            required: [start, end, reason]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
              reason: {type: [string, 'null'], description: 'As stored, e.g. ingestor_restart; the UI words it and shows an unknown one raw'}
    SeriesColumns:
      type: object
      required: [avg, min, max, count, source]
      properties:
        avg: {$ref: '#/components/schemas/NullableNumbers'}
        min: {$ref: '#/components/schemas/NullableNumbers'}
        max: {$ref: '#/components/schemas/NullableNumbers'}
        count: {type: array, items: {type: integer}}
        source: {type: string, enum: [raw, daily_summary, scorecard, forecast], description: 'daily_summary: daily summaries, and the chart says so; forecast: weather_forecast, the newest issue per hour'}
        retained_from: {type: [string, 'null'], format: date-time, description: 'Older buckets are beyond retention_days, not gaps'}
        reason:
          type: array
          items: {type: [string, 'null']}
          description: >-
            daily.* keys only, one per bucket: why a null bucket is null ('band grade kept 3 days', the water day's
            v_water_meter_daily quality, 'no meter data', or v_dli_daily's unavailable_reason such as
            'source_coverage_low'); null where the bucket has a value or no reason is known
        issued_at: {type: [string, 'null'], format: date-time, description: 'forecast.temp_f, forecast.rh_pct and forecast.vpd_kpa only: the newest weather_forecast.fetched_at used; null when the window holds no forecast row'}
    Page:
      type: object
      description: Cursor page; each list schema adds items
      required: [next_cursor]
      properties:
        next_cursor: {type: [string, 'null'], description: Pass as cursor; null on the last page}

    # ------------------------------------------------------------ session, now, graphs
    Me:
      type: object
      required: [username, role, writes_enabled, source_revision]
      properties:
        username: {type: string}
        display_name: {type: [string, 'null']}
        role: {type: string, enum: [operator, viewer]}
        writes_enabled: {type: boolean, description: Set by the BFF from DASHBOARD_WRITES_ENABLED (the operator API returns true)}
        source_revision: {type: string, description: Operator API build commit}
    SessionCreate:
      type: object
      required: [username, role]
      properties:
        username: {type: string, description: preferred_username}
        display_name: {type: [string, 'null'], description: name claim}
        role: {type: string, enum: [operator, viewer]}
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token: {type: string, description: '32 random bytes, base64url; becomes __Host-verdify_session'}
        expires_at: {type: string, format: date-time}
    Readiness:
      type: object
      required: [status, source_revision]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        source_revision: {type: string}
        operator_api: {type: string, enum: [reachable, unreachable], description: 'BFF only; reported, not gating'}
        authentik: {type: string, enum: [reachable, unreachable], description: 'BFF only; reported, not gating'}
    BandPosition:
      type: object
      required: [low, high, verdict]
      properties:
        low: {type: [number, 'null']}
        high: {type: [number, 'null']}
        verdict: {type: string, enum: [in, above, below, unavailable]}
    Occupancy:
      type: object
      description: >-
        Frigate occupancy as the ingestor pushes it to the controller, from Home Assistant's
        binary_sensor.greenhouse_zone_person_occupancy polled every 300 s (the only occupancy input). occupied null
        means unknown, and unknown never holds mist (D-IRP-10).
      required: [occupied, seen_at]
      properties:
        occupied: {type: [boolean, 'null']}
        seen_at: {type: [string, 'null'], format: date-time, description: Last person detection}
        hold_enabled: {type: [boolean, 'null'], description: 'occupancy_inhibit; false means the occupancy mist hold is off'}
    Leak:
      type: object
      description: >-
        leak_detected: flow on the one site meter with every Verdify valve closed, so also the hose, sink or hydro.
        It raises the leak alert ("Water flowing with every Verdify valve closed") and nothing else: nothing latches,
        and the engine firmware forces nothing off (Round 2 #3, Q-05). Until that release the current firmware keeps
        its fog, mister and drip interlock. The flow banner shows while alert_id is set and reads "Flow stopped at
        HH:MM" once stopped_at is set, never an all clear
      required: [active, alert_id, stopped_at]
      properties:
        active: {type: [boolean, 'null']}
        since: {type: [string, 'null'], format: date-time}
        flow_gpm: {type: [number, 'null'], description: 'Whole-gallon meter, so 0 or about 1 in practice'}
        gal_last_10min: {type: [integer, 'null'], description: Whole gallons}
        alert_id: {type: [integer, 'null'], description: 'The open leak_detected alert''s merged-row id (Alert.id); null when none is open'}
        stopped_at: {type: [string, 'null'], format: date-time, description: 'When flow fell under 0.1 gal/min for two meter readings while that alert is open; null while flow continues'}
    Controller:
      type: object
      description: ESP32 diagnostics; a reset of uptime_s confirms a restart
      properties:
        firmware_version: {type: [string, 'null']}
        uptime_s: {type: [integer, 'null']}
        reset_reason: {type: [string, 'null']}
        heap_free_kb: {type: [number, 'null'], description: 'kB, as stored in diagnostics.heap_bytes'}
        heap_largest_block_kb: {type: [number, 'null']}
        rssi_dbm: {type: [number, 'null']}
        observed_at: {type: [string, 'null'], format: date-time}
        heap_minute_low_kb: {type: [number, 'null'], description: 'The lowest free heap in the last minute, kB (diagnostics.heap_min_free_minute_kb, newest non-null over 15 min)'}
        restart_count: {type: [integer, 'null'], description: 'Restarts the controller has counted (diagnostics.restart_count); null until it reports one'}
        gap_log:
          type: [string, 'null']
          description: >-
            The gap log's state (diagnostics.gap_log_state), as LawAlone.gap_log words it: armed, not_armed_yet,
            nvs_small, nvs_full, nvs_slow or nvs_error; a newer state is sent as stored. Null until reported
          examples: [armed, nvs_full]
    LawState:
      type: object
      description: >-
        The climate law's newest state record while it is fresh (its 60 s heartbeat, at most 120 s old). Latches and
        requests are named in bit order; drying is running, refused (the house wants drying and none runs, with the
        controller's first reason) or not_wanted.
      required: [observed_at, latches, requests, drying, drying_refused_reason, drying_cost_kwh_per_kg, drying_cost_limit_kwh_per_kg, band_repaired]
      properties:
        observed_at: {type: string, format: date-time}
        latches: {type: array, items: {type: string, enum: [h1, h2, cool, cool2, wet, mist, dry, air, run]}}
        requests: {type: array, items: {type: string, enum: [heat1, heat2, vent, fog, mist, fan1, fan2, cooling, drying, hot, cold]}}
        drying: {type: string, enum: [running, refused, not_wanted]}
        drying_refused_reason: {type: [string, 'null'], description: "The controller's reason while no run is on: why a wanted run is refused, or why drying is held", examples: [cost, not_drier, no_outdoor, humidity_invalid, no_temperature]}
        drying_cost_kwh_per_kg: {type: [number, 'null'], description: 'kWh of heat per kg of water; null without outdoor data or when the outdoor air is not drier'}
        drying_cost_limit_kwh_per_kg: {type: number, description: The drying cost limit in force on the controller}
        band_repaired: {type: boolean, description: "True when the controller's band check changed the band it received"}
        band:
          description: 'The band the controller is using now (the record''s b field); null when the record carries none'
          anyOf: [{$ref: '#/components/schemas/BandEdges'}, {type: 'null'}]
    BandEdges:
      type: object
      description: A band's four edges at one moment
      required: [temp_low_f, temp_high_f, vpd_low_kpa, vpd_high_kpa]
      properties:
        temp_low_f: {type: number, description: '°F'}
        temp_high_f: {type: number, description: '°F'}
        vpd_low_kpa: {type: number, description: kPa}
        vpd_high_kpa: {type: number, description: kPa}
    HostBandEdges:
      type: object
      description: The host's band at one moment (fn_band_setpoints); an edge it cannot compute is null
      required: [temp_low_f, temp_high_f, vpd_low_kpa, vpd_high_kpa]
      properties:
        temp_low_f: {type: [number, 'null'], description: '°F'}
        temp_high_f: {type: [number, 'null'], description: '°F'}
        vpd_low_kpa: {type: [number, 'null'], description: kPa}
        vpd_high_kpa: {type: [number, 'null'], description: kPa}
    Now:
      type: object
      required: [server_time, indoor, outdoor, band, alerts, running, overrides, leak, freshness, writer]
      properties:
        server_time: {type: string, format: date-time}
        law:
          description: The climate law's state record while it is fresh; null before the law build or while the record is stale (release C retired mode and iris; law and review replace them)
          anyOf: [{$ref: '#/components/schemas/LawState'}, {type: 'null'}]
        hydroponics:
          type: [object, 'null']
          description: Latest actual reservoir samples, independently timestamped; polled with Now, not chart averages.
          required: [ph, ec_us_cm, water_temp_f, stale_after_s]
          properties:
            ph: {$ref: '#/components/schemas/Reading'}
            ec_us_cm: {$ref: '#/components/schemas/Reading'}
            water_temp_f: {$ref: '#/components/schemas/Reading'}
            stale_after_s: {type: integer, minimum: 1}
        indoor:
          type: object
          required: [temp_f, rh_pct, vpd_kpa]
          properties:
            temp_f: {$ref: '#/components/schemas/Reading'}
            rh_pct: {$ref: '#/components/schemas/Reading'}
            vpd_kpa: {$ref: '#/components/schemas/Reading'}
        outdoor:
          type: object
          required: [temp_f, rh_pct]
          properties:
            temp_f: {$ref: '#/components/schemas/Reading'}
            rh_pct: {$ref: '#/components/schemas/Reading'}
            source:
              type: [string, 'null']
              enum: [station, intake, none, null]
              description: >-
                Where the controller's outdoor reading comes from (system_state outdoor_source): the weather station,
                the intake probe, or none; null when the controller has not said
        review:
          description: >-
            The daily review today, as API-34's today, with written_at of the newest written review and whether a band
            proposal waits for the owner; null when the review projection cannot be read
          anyOf:
            - type: 'null'
            - type: object
              required: [review_date, status, missed, written_at, proposal_waiting]
              properties:
                review_date: {type: string, format: date, description: The local day the review covers}
                status: {type: string, enum: [written, delivered, requested, failed, due, not_due], description: 'As ReviewPage.today.status'}
                missed: {type: boolean, description: 'The daily_review_missed alert is open'}
                written_at: {type: [string, 'null'], format: date-time, description: The newest written review's written_at}
                proposal_waiting: {type: boolean, description: A written review's band proposal waits for the owner}
        band:
          type: object
          description: >-
            The band in force now: the dispatcher's newest band rows for zone house (DERIVED); rh_pct is null when
            there is no RH band
          required: [temp_f, vpd_kpa, rh_pct]
          properties:
            temp_f: {$ref: '#/components/schemas/BandPosition'}
            vpd_kpa: {$ref: '#/components/schemas/BandPosition'}
            rh_pct: {anyOf: [{$ref: '#/components/schemas/BandPosition'}, {type: 'null'}]}
            observed_at: {type: [string, 'null'], format: date-time, description: 'ts of the newest house band rows, for the band''s age; null with no rows'}
        alerts:
          type: object
          description: >-
            The one open-alert count every surface shows (nav, Now, Activity, API-14, MCP alerts): the unacknowledged
            (disposition open) v_open_alerts rows with repeats of one alert_type and sensor_id counted once (a merged row
            counts while any of its repeats is unacknowledged), by severity. It equals the rows with status open that
            API-14 returns (verdify_services.alerts.open_count)
          required: [open, critical, warning, info]
          properties:
            open: {type: integer}
            critical: {type: integer}
            warning: {type: integer}
            info: {type: integer}
        running:
          type: array
          description: Equipment commanded on now
          items:
            type: object
            required: [equipment, since]
            properties:
              equipment: {type: string, examples: [heat1, mister_center]}
              line_id: {type: [string, 'null'], pattern: '^L(0[1-9]|1[01])$'}
              cause: {anyOf: [{$ref: '#/components/schemas/IrrigationCause'}, {type: 'null'}]}
              since: {type: [string, 'null'], format: date-time}
        overrides:
          type: array
          description: >-
            Running bursts, from the controller's readback (fan_burst_active, fog_burst_active, vent_bypass_active),
            never from the command alone
          items:
            type: object
            required: [kind, since, ends_at]
            properties:
              kind: {type: string, enum: [fans, humidify, vent_bypass]}
              since: {type: string, format: date-time, description: The readback's ON edge}
              ends_at: {type: [string, 'null'], format: date-time, description: 'ON edge plus the command''s minutes; null for a push-button burst'}
              held_reason: {type: [string, 'null'], description: 'Why the controller holds it off, e.g. from fog_block_reason'}
        leak: {$ref: '#/components/schemas/Leak'}
        freshness:
          type: object
          description: >-
            ingestor is the heartbeat: one system_state row (ingestor_heartbeat) every 60 s from the ingestor's own
            loop, stale after 180 s. Heartbeat stale: the ingestor is not running, and the controller keeps running on
            its own. Heartbeat fresh and climate older than 300 s: the controller is not reporting
          required: [climate, diagnostics, readback, ingestor]
          properties:
            climate: {$ref: '#/components/schemas/Freshness'}
            diagnostics: {$ref: '#/components/schemas/Freshness'}
            readback: {$ref: '#/components/schemas/Freshness'}
            ingestor: {$ref: '#/components/schemas/Freshness'}
        writer:
          type: object
          description: >-
            Device writer health (Round 2 #1): the writer-health tile and the stuck-delivery banner. age_s is the
            setpoints pipeline age (v_data_pipeline_health source setpoints: the newest setpoint push or device-reported
            change). stuck is true while the setpoint_delivery_stuck alert is open. differing counts settings whose
            effective value has differed from the newest readback for more than 10 min, leaving out clamped ones
          required: [age_s, stuck, differing]
          properties:
            last_at: {type: [string, 'null'], format: date-time}
            age_s: {type: [integer, 'null']}
            stuck: {type: boolean}
            differing: {type: integer}
            oldest_since: {type: [string, 'null'], format: date-time}
        controller: {$ref: '#/components/schemas/Controller'}
        snapshot:
          description: >-
            The greenhouse snapshot (#1346): the newest 3-5 sentence summary the local Cortex model wrote from the
            current conditions (CronJob verdify-greenhouse-brief); null when none was written in the last 2 h
          anyOf: [{$ref: '#/components/schemas/Snapshot'}, {type: 'null'}]
    Snapshot:
      type: object
      description: >-
        Read-only text for people, never an input to a plan. stale: as_of is more than 30 min old (old) or a later
        attempt failed or was rejected (failed); show it muted with "as of". outdated: a band verdict or the open-alert
        count changed since it was written; never show it
      required: [text, generated_at, as_of, model, stale, stale_reason, outdated]
      properties:
        text: {type: string}
        generated_at: {type: string, format: date-time}
        as_of: {type: string, format: date-time, description: 'The newer of generated_at and the last run that found the same conditions'}
        model: {type: string, examples: [llm.primary.longctx]}
        stale: {type: boolean}
        stale_reason: {type: [string, 'null'], enum: [old, failed, null]}
        outdated: {type: boolean}
    MetricDef:
      type: object
      required: [key, label, group, unit, cadence_s, retention_days, provenance, daily]
      properties:
        key: {type: string, examples: [climate.temp_avg, climate.vpd_avg, climate.flow_gpm, diagnostics.heap_free_kb]}
        label: {type: string}
        group: {type: string, examples: [house climate, zones, water and soil, light, outdoor, controller, power, daily]}
        unit: {type: string}
        cadence_s: {type: integer}
        retention_days: {type: integer, description: 'Raw retention: climate 365, diagnostics 180, setpoint_snapshot 90'}
        provenance: {type: string, enum: [MEASURED, DERIVED, PLANNED, MANUAL, AI]}
        zone: {type: [string, 'null']}
        daily: {type: boolean, description: 'Has a daily_summary binding, used over 31 days and beyond raw retention'}
        note: {type: [string, 'null']}
    StateLanes:
      type: object
      required: [from, to, lanes]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        lanes:
          type: array
          items:
            type: object
            required: [equipment, group, intervals]
            properties:
              equipment: {type: string, examples: [fan1, mister_center, leak_detected]}
              label: {type: string}
              group: {type: string, enum: [climate, water, light, flag]}
              line_id: {type: [string, 'null'], pattern: '^L(0[1-9]|1[01])$'}
              intervals:
                type: array
                items:
                  type: object
                  required: [start, end, state]
                  properties:
                    start: {type: string, format: date-time}
                    end: {type: string, format: date-time, description: Clamped to the window or now}
                    state: {type: string, enum: ['on', 'off', unknown]}
                    cause: {anyOf: [{$ref: '#/components/schemas/IrrigationCause'}, {type: 'null'}]}
    BandTimeline:
      type: object
      description: One point per step_s
      required: [from, to, step_s, t, band, crop]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        step_s: {type: integer, minimum: 300}
        t: {type: array, items: {type: integer}, description: Epoch seconds}
        band: {$ref: '#/components/schemas/BandColumns', description: 'In force (DERIVED band rows of the requested zone); null beyond 90 days'}
        crop: {$ref: '#/components/schemas/BandColumns', description: 'Reconstructed from today''s anchors (API-06 says how)'}
        achievable:
          description: 'Asked for with achievable: the house''s achievable VPD band and grades; null otherwise, for a zone or past 35 days'
          anyOf: [{$ref: '#/components/schemas/AchievableColumns'}, {type: 'null'}]
    AchievableColumns:
      type: object
      description: >-
        The house VPD band the house can be expected to hold, one point per step (#1433). At night (sunset to sunrise)
        the expected ribbon is es(T) − es(Td_in ± 0.674·RMSE) at the house temperature the step measured (ahead of now,
        the band's temperature), with Td_in from a rolling
        least-squares fit of indoor dewpoint on indoor temperature, outdoor temperature and outdoor dewpoint over the
        14 days of deep-night hours with no vent, fan, fog or mister before the night's local noon (before now for a
        night ahead); outdoor values are measured up to now and forecast after. The achievable band is the band in
        force (else the crop band) with its low edge dropped to the ribbon's p25 and its high edge raised to its p75
        where they lie outside; by day, and with no fit, it is the band.
      required: [vpd_low, vpd_high, expected_low, expected_high, nights, days]
      properties:
        vpd_low: {$ref: '#/components/schemas/NullableNumbers'}
        vpd_high: {$ref: '#/components/schemas/NullableNumbers'}
        expected_low: {$ref: '#/components/schemas/NullableNumbers', description: 'Expected night VPD, p25; null by day or without a fit'}
        expected_high: {$ref: '#/components/schemas/NullableNumbers', description: 'Expected night VPD, p75'}
        days: {type: integer, description: Days of deep-night hours each night's fit reads}
        nights:
          type: array
          description: Each night in the window graded at the step against the served band and the achievable band
          items: {$ref: '#/components/schemas/AchievableNight'}
    AchievableNight:
      type: object
      required: [night, graded, served_in_pct, achievable_in_pct, below_served_pct, below_achievable_pct, fit]
      properties:
        night: {type: string, format: date, description: America/Denver date of the night's evening}
        graded: {type: integer, description: Night steps with a measured house VPD and a band}
        served_in_pct: {type: [number, 'null'], description: Share of graded steps inside the served band}
        achievable_in_pct: {type: [number, 'null'], description: Share of graded steps inside the achievable band}
        below_served_pct: {type: [number, 'null'], description: Share below the served band's low edge}
        below_achievable_pct: {type: [number, 'null'], description: Share below the achievable band's low edge}
        fit:
          description: The rolling dewpoint fit the night used; null with fewer than 24 hours
          anyOf: [{$ref: '#/components/schemas/AchievableFit'}, {type: 'null'}]
    AchievableFit:
      type: object
      required: [hours, rmse_f]
      properties:
        hours: {type: integer, description: Deep-night hours the fit used}
        rmse_f: {type: number, description: 'Root-mean-square dewpoint error, °F'}
    BandColumns:
      type: object
      required: [temp_low, temp_high, vpd_low, vpd_high]
      properties:
        temp_low: {$ref: '#/components/schemas/NullableNumbers'}
        temp_high: {$ref: '#/components/schemas/NullableNumbers'}
        vpd_low: {$ref: '#/components/schemas/NullableNumbers'}
        vpd_high: {$ref: '#/components/schemas/NullableNumbers'}
    BandPreview:
      type: object
      description: 'API-19: the band over one day as stored (current) and with the draft value (draft), one point per step_s'
      required: [param, unit, day, step_s, t, current, draft]
      properties:
        param: {type: string}
        unit: {type: string, examples: ['°F', kPa]}
        day: {type: string, format: date, description: America/Denver day}
        step_s: {type: integer, const: 600}
        t: {type: array, items: {type: integer}, description: Epoch seconds}
        current: {$ref: '#/components/schemas/BandCurve'}
        draft: {$ref: '#/components/schemas/BandCurve'}
    BandCurve:
      type: object
      required: [low, target, high]
      properties:
        low: {$ref: '#/components/schemas/NullableNumbers'}
        target: {$ref: '#/components/schemas/NullableNumbers'}
        high: {$ref: '#/components/schemas/NullableNumbers'}
    BandProfile:
      type: object
      description: 'The house band in the editor''s terms: day (solar noon) and night (solar midnight) values'
      required: [temp_day, temp_night, temp_width_day, temp_width_night, vpd_day, vpd_night, vpd_below_day, vpd_above_day, vpd_below_night, vpd_above_night]
      properties:
        temp_day: {type: number, description: °F}
        temp_night: {type: number, description: °F}
        temp_width_day: {type: number, minimum: 0, description: ± °F}
        temp_width_night: {type: number, minimum: 0, description: ± °F}
        vpd_day: {type: number, description: kPa}
        vpd_night: {type: number, description: kPa}
        vpd_below_day: {type: number, minimum: 0, description: kPa}
        vpd_above_day: {type: number, minimum: 0, description: kPa}
        vpd_below_night: {type: number, minimum: 0, description: kPa}
        vpd_above_night: {type: number, minimum: 0, description: kPa}
    BandProfilePatch:
      type: object
      description: >-
        The simple fields or edges to change; a field left out keeps the band's own value. An axis is given either as
        a target with its width or as edges, never both
      additionalProperties: false
      properties:
        temp_day: {type: [number, 'null']}
        temp_night: {type: [number, 'null']}
        temp_width_day: {type: [number, 'null'], minimum: 0}
        temp_width_night: {type: [number, 'null'], minimum: 0}
        vpd_day: {type: [number, 'null']}
        vpd_night: {type: [number, 'null']}
        vpd_below_day: {type: [number, 'null'], minimum: 0}
        vpd_above_day: {type: [number, 'null'], minimum: 0}
        vpd_below_night: {type: [number, 'null'], minimum: 0}
        vpd_above_night: {type: [number, 'null'], minimum: 0}
        temp_low_day: {type: [number, 'null'], description: 'Edge form: the low edge at solar noon, °F'}
        temp_high_day: {type: [number, 'null'], description: 'Edge form: the high edge at solar noon, °F'}
        temp_low_night: {type: [number, 'null'], description: 'Edge form: the low edge at solar midnight, °F'}
        temp_high_night: {type: [number, 'null'], description: 'Edge form: the high edge at solar midnight, °F'}
        vpd_low_day: {type: [number, 'null'], description: 'Edge form: the VPD low edge at solar noon, kPa'}
        vpd_high_day: {type: [number, 'null'], description: 'Edge form: the VPD high edge at solar noon, kPa'}
        vpd_low_night: {type: [number, 'null'], description: 'Edge form: the VPD low edge at solar midnight, kPa'}
        vpd_high_night: {type: [number, 'null'], description: 'Edge form: the VPD high edge at solar midnight, kPa'}
    BandProfileState:
      type: object
      required: [profile, anchors, simple, edges, edges_simple]
      properties:
        profile: {$ref: '#/components/schemas/BandProfile'}
        anchors: {type: object, additionalProperties: {type: number}, description: 'The 24 band_<series>_<anchor> values'}
        simple: {type: boolean, description: True when sunrise and sunset are the midpoint of noon and midnight}
        edges: {$ref: '#/components/schemas/BandProfileEdges'}
        edges_simple: {$ref: '#/components/schemas/BandEdgesSimple'}
    BandProfileEdges:
      type: object
      description: "The band's low and high edges at solar noon (day) and solar midnight (night), as the anchors hold them"
      additionalProperties: false
      required: [temp_low_day, temp_high_day, temp_low_night, temp_high_night, vpd_low_day, vpd_high_day, vpd_low_night, vpd_high_night]
      properties:
        temp_low_day: {type: number, description: 'temp_low at solar noon, °F'}
        temp_high_day: {type: number, description: 'temp_high at solar noon, °F'}
        temp_low_night: {type: number, description: 'temp_low at solar midnight, °F'}
        temp_high_night: {type: number, description: 'temp_high at solar midnight, °F'}
        vpd_low_day: {type: number, description: 'vpd_low at solar noon, kPa'}
        vpd_high_day: {type: number, description: 'vpd_high at solar noon, kPa'}
        vpd_low_night: {type: number, description: 'vpd_low at solar midnight, kPa'}
        vpd_high_night: {type: number, description: 'vpd_high at solar midnight, kPa'}
    BandEdgesSimple:
      type: object
      description: >-
        Per axis, true when the sunrise and sunset anchors of its low and high series are the midpoint of their noon
        and midnight values on the push step, so the eight edges describe the band in full
      additionalProperties: false
      required: [temp, vpd]
      properties:
        temp: {type: boolean}
        vpd: {type: boolean}
    BandLawLines:
      type: object
      description: "Where the law's rules switch on, as offsets from the band's edges, for the preview to draw (the law constants)"
      additionalProperties: false
      required: [heat1_on_above_low_f, heat2_on_above_low_f, cool_on_above_high_f, fan2_on_above_high_f, dry_on_above_vpd_low_kpa, fog_on_above_vpd_high_kpa, mist_on_above_vpd_high_kpa]
      properties:
        heat1_on_above_low_f: {type: number, description: 'The electric heater comes on below temp_low plus this, °F'}
        heat2_on_above_low_f: {type: number, description: 'The furnace comes on below temp_low plus this, °F'}
        cool_on_above_high_f: {type: number, description: 'Cooling comes on above temp_high plus this, °F'}
        fan2_on_above_high_f: {type: number, description: 'The second fan comes on above temp_high plus this, °F'}
        dry_on_above_vpd_low_kpa: {type: number, description: 'Drying is wanted below vpd_low plus this, kPa'}
        fog_on_above_vpd_high_kpa: {type: number, description: 'The fogger comes on above vpd_high plus this, kPa'}
        mist_on_above_vpd_high_kpa: {type: number, description: 'The misters join above vpd_high plus this, kPa'}
    BandProfilePreview:
      type: object
      description: 'API-23: the house band as stored (current) and drafted, one point per step_s'
      required: [day, step_s, t, sun, current, draft, changed, temp, vpd, guardrails, law_lines, overshoot, night_heat_kwh, envelope, findings, measured, forecast]
      properties:
        day: {type: string, format: date, description: America/Denver day}
        step_s: {type: integer, const: 600}
        t: {type: array, items: {type: integer}, description: Epoch seconds}
        sun:
          type: object
          required: [sunrise, solar_noon, sunset, solar_midnight]
          properties:
            sunrise: {type: [integer, 'null'], description: Epoch seconds}
            solar_noon: {type: [integer, 'null']}
            sunset: {type: [integer, 'null']}
            solar_midnight: {type: [integer, 'null']}
        current: {$ref: '#/components/schemas/BandProfileState'}
        draft: {$ref: '#/components/schemas/BandProfileState'}
        changed: {type: array, items: {type: string}, description: The anchors a Save would write}
        temp:
          type: object
          required: [current, draft]
          properties:
            current: {$ref: '#/components/schemas/BandCurve'}
            draft: {$ref: '#/components/schemas/BandCurve'}
        vpd:
          type: object
          required: [current, draft, expected_low, expected_high]
          properties:
            current: {$ref: '#/components/schemas/BandCurve'}
            draft: {$ref: '#/components/schemas/BandCurve'}
            expected_low: {$ref: '#/components/schemas/NullableNumbers'}
            expected_high: {$ref: '#/components/schemas/NullableNumbers'}
        guardrails:
          type: object
          required: [temp_min_f, temp_max_f, margin_f, vpd_min_kpa, vpd_max_kpa, night_vpd_floor_kpa, min_width_f, min_width_kpa, dry_on_above_vpd_low_kpa]
          properties:
            temp_min_f: {type: number}
            temp_max_f: {type: number}
            margin_f: {type: number}
            vpd_min_kpa: {type: number}
            vpd_max_kpa: {type: number}
            night_vpd_floor_kpa: {type: number, description: 'The drying line (vpd_low + dry_on_above_vpd_low_kpa) stays at or above this all night'}
            min_width_f: {type: number, description: The control law's minimum temperature band width at every point of the day}
            min_width_kpa: {type: number, description: The control law's minimum VPD band width at every point of the day}
            dry_on_above_vpd_low_kpa: {type: number, description: The control law dries the house below vpd_low plus this}
        law_lines: {$ref: '#/components/schemas/BandLawLines'}
        overshoot: {type: object, additionalProperties: {type: number}, description: 'By series, how far the draft curve leaves its anchor range'}
        night_heat_kwh:
          type: object
          required: [current, draft]
          properties:
            current: {type: [number, 'null']}
            draft: {type: [number, 'null']}
        envelope:
          type: [object, 'null']
          required: [hours, days, rmse_f, dewpoint_p10_f]
          properties:
            hours: {type: integer}
            days: {type: integer}
            rmse_f: {type: number}
            dewpoint_p10_f: {type: number}
        findings:
          type: array
          items:
            type: object
            required: [code, severity, field, detail]
            properties:
              code: {type: string, examples: [band_order, guardrail, night_floor, overshoot, dewpoint_unreached, night_floor_unachievable]}
              severity: {type: string, enum: [error, warning]}
              field: {type: string}
              detail: {type: string}
        measured:
          type: object
          description: 'The last 24 h of the measured house average on t, by America/Denver clock time: a step before now holds today''s 10-min bucket, a later step yesterday''s'
          required: [window_start, window_end, at, temp, vpd]
          properties:
            window_start: {type: integer, description: Epoch seconds of the oldest bucket read}
            window_end: {type: integer, description: Epoch seconds at the end of the bucket holding now}
            at: {type: array, items: {type: [integer, 'null']}, description: 'Per step, the bucket its values come from; null if none'}
            temp: {$ref: '#/components/schemas/NullableNumbers', description: 'climate.temp_avg, °F'}
            vpd: {$ref: '#/components/schemas/NullableNumbers', description: 'climate.vpd_avg, kPa'}
        forecast:
          type: object
          description: The day's outdoor forecast on t; every step of an hour holds that hour's newest issue
          required: [temp, vpd, issued_at]
          properties:
            temp: {$ref: '#/components/schemas/NullableNumbers', description: 'Outdoor forecast temperature, °F'}
            vpd: {$ref: '#/components/schemas/NullableNumbers', description: 'Outdoor forecast VPD, kPa'}
            issued_at: {type: [string, 'null'], format: date-time, description: The newest fetched_at behind the values}
    BandSave:
      type: object
      additionalProperties: false
      properties:
        profile: {$ref: '#/components/schemas/BandProfilePatch'}
        anchors: {type: object, additionalProperties: {type: number}, description: 'Advanced: raw house anchors'}
        manual: {type: boolean, default: true}
        reason: {type: string, maxLength: 500}
    BandWrite:
      type: object
      required: [changed]
      properties:
        changed: {type: array, items: {$ref: '#/components/schemas/DesiredSetting'}}
    SoilTarget:
      type: object
      description: One probe zone's soil-moisture target (API-SOIL-01, #1345)
      required: [zone, wilt_pct, min_pct, max_pct, saturation_pct]
      properties:
        zone: {type: string, examples: [south_1, south_2, west]}
        wilt_pct: {type: number, minimum: 0, maximum: 100, description: soil_dryout pages when the live probe stays below this for over 2 h in the day}
        min_pct: {type: number, minimum: 0, maximum: 100}
        max_pct: {type: number, minimum: 0, maximum: 100}
        saturation_pct: {type: number, minimum: 0, maximum: 100}
        notes: {type: [string, 'null']}
        probe: {type: [string, 'null'], description: The climate column the probe writes, for example soil_moisture_west}
        sensor_id: {type: [string, 'null'], examples: [soil.west]}
        occupancy_zone: {type: [string, 'null'], description: The crops.zone whose open plantings let soil_dryout page}
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by:
          anyOf:
            - {$ref: '#/components/schemas/Actor'}
            - {type: 'null'}
        reason: {type: [string, 'null']}
    SoilTargets:
      type: object
      required: [targets]
      properties:
        targets: {type: array, items: {$ref: '#/components/schemas/SoilTarget'}}
    SoilTargetWrite:
      type: object
      additionalProperties: false
      description: The thresholds or note to change; at least one. The merged row must stay ordered.
      properties:
        wilt_pct: {type: [number, 'null'], minimum: 0, maximum: 100}
        min_pct: {type: [number, 'null'], minimum: 0, maximum: 100}
        max_pct: {type: [number, 'null'], minimum: 0, maximum: 100}
        saturation_pct: {type: [number, 'null'], minimum: 0, maximum: 100}
        notes: {type: [string, 'null'], maxLength: 500}
        reason: {type: string, maxLength: 500}

    # ------------------------------------------------------------ settings
    Setting:
      type: object
      description: One tunable_registry row, or a read-only Band in force row, as the Settings screen shows it
      required: [param, label, control_class, group, kind, writable, readback_via, readback, desired, applied_from, state]
      properties:
        param: {type: string, examples: [gl_main_lux_threshold]}
        label: {type: string, description: 'For a registry row, TunableDef.label (VD-29), filled from the setting''s entity name in firmware/greenhouse/tunables.yaml and drift-tested'}
        control_class: {type: string, enum: [planner_policy, scheduled_policy, controller_safety, crop_band, irrigation_site, readback_context, retired]}
        group:
          type: string
          enum: [planner_policy, scheduled_policy, controller_safety, crop_band, site_water_caps, read_only, band_in_force]
          description: 'band_in_force is the "Band in force" group: the dispatcher''s DERIVED band rows (band_<zone>_<role>), house and per zone, read-only'
        kind: {type: string, enum: [numeric, switch, enum]}
        unit: {type: [string, 'null'], description: 'For a registry row, TunableDef.unit (VD-29), filled from the same firmware entity and drift-tested; null when the setting has no unit'}
        min: {type: [number, 'null'], description: planner_effective_bounds (registry intersected with the firmware clamp)}
        max: {type: [number, 'null']}
        step: {type: [number, 'null'], description: 'The registry step (from tunables.yaml; equal to ENTITY_GRIDS for the 48 policy fields)'}
        options:
          type: array
          description: Enum settings only
          items: {type: object, required: [value, label], properties: {value: {type: number}, label: {type: string}}}
        writable: {type: boolean, description: 'false with read_only_reason; the irrigation_site rows are writable before the engine firmware too (their writes wait, state_reason no_engine)'}
        read_only_reason: {type: [string, 'null'], examples: ['legacy wide limit; not the band while the controller runs its on-chip curve']}
        read_only_kind:
          type: [string, 'null']
          enum: [band_in_force, legacy_wide_limit, zone_vpd_target, activity_mirror, band_owner, retired, readback_context, no_entity, no_anchor_row, unknown, null]
          description: 'Why a read-only row cannot be written (#1333): the tunable_registry READ_ONLY_REASONS key, no_anchor_row (a crop-band row with no crop_band_anchors row) or band_in_force (derived band rows); null on a writable row'
        source_params:
          type: array
          items: {type: string}
          description: 'The writable settings a derived row is computed from (the crop-band anchors behind a Band in force row, the main-light schedule behind the activity mirror); empty otherwise'
        help: {anyOf: [{$ref: '#/components/schemas/SettingHelp'}, {type: 'null'}], description: 'Operator text (verdify_schemas.setting_help, #1332); MCP settings serves the same'}
        readback_via:
          type: string
          enum: [cfg, entity, program, none]
          description: 'cfg_* sensor, a native number, switch or equipment_state mirror, the irrigation program hash (irrigation_site), or none'
        readback: {anyOf: [{$ref: '#/components/schemas/Reading'}, {type: 'null'}], description: 'Newest readback; for irrigation_site rows the value in the applied program'}
        desired: {anyOf: [{$ref: '#/components/schemas/DesiredSetting'}, {type: 'null'}]}
        applied_from: {type: string, enum: [manual, desired, band, default], description: 'What the dispatcher applies now (release C retired plan, which no setting has read since climate refactor 4.2)'}
        state: {$ref: '#/components/schemas/ReadbackState', description: 'Of the newest write, else of the applied value against the readback'}
        effect:
          type: string
          enum: [controller, host, none]
          description: >-
            What reads the setting on this build: controller, the connected controller's control loop; host, a host task
            (the lighting schedule, the dispatcher or the alerts); none, stored and echoed but read by nothing. Derived
            from the registry and one reviewed list, guarded by a test
    SettingHelp:
      type: object
      description: >-
        What a setting is and what changing it does to the controller (#1332). One source for the dashboard, MCP and
        the lab ai-tunables page. raise and lower are null on a read-only row; for a switch they say what turning it
        on and off does.
      required: [summary, effect]
      properties:
        summary: {type: string, description: One line, what the setting is}
        effect: {type: string, description: What the controller does with it, naming the mode or equipment it drives}
        raise: {type: [string, 'null'], description: What happens to the greenhouse when the value goes up (a switch turned on)}
        lower: {type: [string, 'null'], description: What happens when the value goes down (a switch turned off)}
        caution: {type: [string, 'null'], description: An interaction or safety note}
        guardrail: {type: boolean, default: false, description: 'A hard safety limit (Safety Min, Safety Max and the VPD pair): the dashboard shows caution and asks to confirm before saving'}
        reference_url: {type: [string, 'null'], description: The setting's entry on the lab ai-tunables reference page}
    SettingWrite:
      type: object
      required: [value]
      properties:
        value: {type: number, description: 'Switches 0 or 1, enums the option value; snapped to step'}
        manual:
          type: boolean
          default: true
          description: 'Iris skips the setting while true. The dashboard default (R3); MCP set_setting defaults false. A write stores exactly the flag it carries'
        reason: {type: string, maxLength: 500}
    SettingHistory:
      type: object
      required: [param, from, to, desired, readback]
      properties:
        param: {type: string}
        unit: {type: [string, 'null']}
        min: {type: [number, 'null']}
        max: {type: [number, 'null']}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        desired: {type: array, items: {$ref: '#/components/schemas/DesiredSetting'}, description: 'Oldest first, from the row in force at from'}
        readback: {type: array, items: {$ref: '#/components/schemas/TimedValue'}, description: cfg_* readback change points}

    # ------------------------------------------------------------ equipment, alerts, activity
    Equipment:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [equipment, label, group, state, observed_at]
            properties:
              equipment: {type: string, examples: [fan1, heat2, mister_center, grow_light_main]}
              label: {type: string}
              group: {type: string, enum: [climate, water, light]}
              line_id: {type: [string, 'null'], pattern: '^L(0[1-9]|1[01])$'}
              state:
                type: string
                enum: ['on', 'off', unknown]
                description: >-
                  The newest row while the controller is online; unknown only while it is offline or there is no row.
                  For the vent, on means open; for the grow lights, the Lutron readback
              since: {type: [string, 'null'], format: date-time, description: Start of the current run of equal states}
              runtime_today_s: {type: [integer, 'null']}
              cycles_today: {type: [integer, 'null'], description: From collapsed ON/OFF edges}
              intent: {type: [string, 'null'], enum: ['on', 'off', unknown, null], description: "Grow lights only: the controller's intent (grow_light_main_intent, grow_light_grow_intent)"}
              observed_at: {type: [string, 'null'], format: date-time}
              manual_until:
                type: [string, 'null']
                format: date-time
                description: >-
                  Grow lights only: when the API-20 manual switch goes back to automatic (its activity_log row's ts plus
                  detail.minutes, the light timer's rule), while that is still ahead; null with no timer running
              auto_reason:
                type: [string, 'null']
                description: >-
                  Grow lights only: the controller's newest reason for its intent (gl_main_reason, gl_grow_reason), for
                  example plant_lux_low, plant_hysteresis_hold, outside_window or auto_disabled; null while the
                  controller is not reporting or before any reason row (#1335)
        fog_block_reason: {$ref: '#/components/schemas/ReasonState', description: 'What holds fog (L11) off'}
        moisture_block_reason: {$ref: '#/components/schemas/ReasonState', description: 'What holds the misters off'}
    ReasonState:
      type: object
      description: The newest system_state row of one controller reason entity. The UI words the code and shows an unknown one raw
      required: [code, since, observed_at]
      properties:
        code: {type: [string, 'null'], description: 'Null while the controller is not reporting, or with no row'}
        since: {type: [string, 'null'], format: date-time, description: 'When the current value began, from the collapsed values; null while code is null'}
        observed_at: {type: [string, 'null'], format: date-time, description: 'The newest row''s ts, kept while code is null'}
    LightCommand:
      type: object
      description: 'API-20: a grow-light switch that Lutron confirmed. A failure is a 503 Problem with its result'
      required: [light, state, result, activity_id]
      properties:
        light: {type: string, enum: [main, grow]}
        state: {type: string, enum: ['on', 'off']}
        result: {type: string, enum: [confirmed], description: setpoint-server saw Lutron reach the state}
        activity_id: {type: integer, description: 'The activity_log row (light.on or light.off)'}
    Alert:
      type: object
      description: One alert_log row, or one merged row for repeats of one alert_type and sensor_id
      required: [id, alert_type, category, severity, message, status, first_seen_at]
      properties:
        id: {type: integer, description: 'The oldest unresolved repeat''s id, stable while new repeats merge (a resolved merged row: its oldest repeat''s); API-15 and API-16 act on every repeat of its alert_type and sensor_id'}
        alert_type: {type: string, examples: [leak_detected, irrigation_fence_breach, irrigation_run_missed, irrigation_line_faulted, setpoint_unconfirmed]}
        category: {type: string, examples: [water, system]}
        severity: {type: string, enum: [critical, warning, info]}
        message: {type: string}
        zone: {type: [string, 'null']}
        metric_value: {type: [number, 'null']}
        threshold_value: {type: [number, 'null']}
        details: {type: object, description: 'As stored, e.g. line_id or equipment'}
        status: {type: string, enum: [open, acknowledged, resolved, false_positive, suppressed], description: 'disposition; a merged row is open while any of its repeats is unacknowledged'}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: [string, 'null'], format: date-time, description: Newest of the merged repeats}
        count: {type: integer, minimum: 1, description: Repeats of this alert_type and sensor_id merged into the row}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        acknowledged_by: {type: [string, 'null'], description: 'Username or agent'}
        notes: {type: [string, 'null']}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by: {type: [string, 'null']}
        resolution: {type: [string, 'null']}
        runbook: {type: [string, 'null'], description: Markdown from the alert runbook table}
    AlertPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/Alert'}}}
    ActivityEntry:
      type: object
      required: [id, ts, actor, action, target]
      properties:
        id: {type: integer}
        ts: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string, examples: [setting.write, setting.release, plan.write, alert.ack, irrigation.schedule.update]}
        target: {type: string, description: 'Param, plan id, alert id, line or slot id'}
        detail:
          type: object
          description: 'Before and after, e.g. {"before": 1.6, "value": 1.55, "requested": 1.53, "manual": {"before": false, "after": true}}; a plan lists its changes; trigger_id when an agent gave one'
        reason: {type: [string, 'null']}
        state: {anyOf: [{$ref: '#/components/schemas/ReadbackState'}, {type: 'null'}], description: Readback outcome of a setting or program write}
        confirmed_at: {type: [string, 'null'], format: date-time}
        experiment_id: {type: [string, 'null'], format: uuid, description: 'Set when the write landed while an experiment was armed; nothing is refused'}
        request_id: {type: [string, 'null'], format: uuid, description: The Idempotency-Key or MCP request_id}
    ActivityPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/ActivityEntry'}}}

    # ------------------------------------------------------------ irrigation
    LineId: {type: string, pattern: '^L(0[1-9]|1[01])$', description: L01-L11}
    IrrigationCause: {type: string, enum: [vpd, schedule, run_now, feed, prewet, flush, fallback, unknown]}
    RunOutcome:
      type: string
      description: >-
        unknown: no outcome reached the platform (it aged out of irr_events while the ingestor was disconnected); a
        gap, never missed, and it raises no alert. The controller never sends it
      enum: [ok, short, stopped, preempted, skipped, missed, cap, unknown]
    RunPurpose:
      type: string
      description: >-
        What water was for (#1348). irrigation: schedule, run_now, feed, prewet, flush (and unknown) on drips or
        misters. climate: VPD and fallback misting, and every fog (L11) run. SAF-4 and the zone caps count both. The
        server always sends it; the fields stay optional in the contract so a client reads a server from before #1348
        by the same rule
      enum: [irrigation, climate]
    UsedOfMax:
      type: object
      required: [used, max]
      properties:
        used: {type: [number, 'null']}
        max: {type: [number, 'null']}
    NextRun:
      type: object
      required: [line_id, slot_id, start_at]
      properties:
        line_id: {$ref: '#/components/schemas/LineId'}
        slot_id: {type: integer}
        start_at: {type: string, format: date-time}
        label: {type: [string, 'null']}
        minutes: {type: [number, 'null'], description: Planned valve-open minutes}
    ProgramSync:
      type: object
      description: The compiled program against the controller (irr_program_id); confirmed when the device hash matches
      required: [state, desired_sha256, src]
      properties:
        state: {$ref: '#/components/schemas/ReadbackState'}
        revision: {type: [integer, 'null'], description: Newest pushed revision}
        desired_sha256: {type: string, description: compile_program() over the tables now}
        applied_revision: {type: [integer, 'null']}
        applied_hash: {type: [string, 'null'], description: First 16 hex of the applied sha256}
        src: {type: [string, 'null'], enum: [nvs, rom, null], description: 'null before the engine firmware; rom = the built-in program'}
        reason: {type: [string, 'null'], description: 'Why there is no program on the controller, e.g. engine not on controller'}
        pushed_at: {type: [string, 'null'], format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        reject_code: {type: [string, 'null']}
        next_retry_at: {type: [string, 'null'], format: date-time, description: 'Retries after 1, 5 and 15 min'}
    LineState:
      type: object
      required: [code]
      properties:
        code: {type: string, enum: [idle, running, waiting, blocked, paused, disabled, unknown]}
        cause: {anyOf: [{$ref: '#/components/schemas/IrrigationCause'}, {type: 'null'}]}
        slot_id: {type: [integer, 'null']}
        reason: {type: [string, 'null'], description: 'Waiting or blocked reason in words, e.g. someone inside (Frigate)'}
        ends_at: {type: [string, 'null'], format: date-time}
        observed_at: {type: [string, 'null'], format: date-time, description: irr_state or relay edge}
    IrrigationLine:
      type: object
      required: [line_id, name, zone, kind, reserved, enabled, check, daily_cap_min, paused_until, manual, state, sync]
      properties:
        line_id: {$ref: '#/components/schemas/LineId'}
        name: {type: string, description: 'The line''s display name, the words a person reads (#1341); line_id stays the machine key', examples: [Wall drip]}
        zone: {type: string, enum: [wall, center, south, west, supply, house], description: 'The line''s place: supply for L03, house for L11. Minutes by zone use fog for L11 and leave L03 out'}
        kind: {type: string, enum: [drip, mister, fert_drip, fert_mister, master, fog]}
        clean_partner: {type: [string, 'null'], pattern: '^L(0[1-9]|1[01])$'}
        reserved: {type: boolean, description: 'True for L05 and L06 (Round 2b E): schedulable, no bring-up now; shown reserved while disabled'}
        enabled: {type: boolean}
        check:
          description: 'The one-time physical check (D-IRP-07, D-IRP-08), recorded on the dashboard; null until someone records it'
          anyOf:
            - type: 'null'
            - type: object
              required: [checked_by, checked_at]
              properties:
                checked_by: {type: string}
                checked_at: {type: string, format: date-time}
                note: {type: [string, 'null'], maxLength: 500}
        vpd_member: {type: [boolean, 'null'], description: 'Misters L04, L07 and L09 only; confirmed by the program hash'}
        schedule_member: {type: [boolean, 'null'], description: Misters only; confirmed by the program hash}
        vpd_source: {type: [string, 'null'], enum: [own, peer, house, null], description: 'Own probe, peer mean or house average (D-IRP-13)'}
        daily_cap_min: {type: integer, description: 0 means none}
        vpd_reserve_min: {type: [integer, 'null']}
        paused_until: {type: [string, 'null'], format: date-time}
        paused_by:
          description: >-
            Who set the current paused_until: the newest activity_log row with action irrigation.line.update, target
            the line or all, whose detail sets paused_until. Null when the line is not paused
          anyOf: [{$ref: '#/components/schemas/Actor'}, {type: 'null'}]
        pause_reason: {type: [string, 'null'], maxLength: 500, description: 'That row''s reason; null when the line is not paused or none was given'}
        fault: {type: [string, 'null'], enum: [backing_off, mister_fault, null], description: 'D-IRP-19 watchdog: a back-off, or a latch until midnight or a clear'}
        fault_until: {type: [string, 'null'], format: date-time}
        manual: {type: boolean, description: Iris skips this line while true}
        manual_before: {type: [boolean, 'null'], description: The flag before this write (write responses)}
        state: {$ref: '#/components/schemas/LineState'}
        today:
          type: object
          description: Every purpose (the cap counts all of it); climate_minutes and climate_pulses are the VPD and fallback misting inside it
          properties:
            minutes: {type: [number, 'null']}
            pulses: {type: [integer, 'null']}
            gal: {type: [integer, 'null'], description: Whole gallons}
            climate_minutes: {type: [number, 'null']}
            climate_pulses: {type: [integer, 'null']}
        next_run: {anyOf: [{$ref: '#/components/schemas/NextRun'}, {type: 'null'}]}
        last_water:
          description: >-
            The newest run on the line that opened a valve: relay-edge runs, joined to their ledger row when there is
            one; the run in progress and VPD episodes included
          anyOf:
            - type: 'null'
            - type: object
              required: [at, open_s, cause]
              properties:
                at: {type: string, format: date-time}
                open_s: {type: integer}
                pulses: {type: [integer, 'null']}
                cause: {$ref: '#/components/schemas/IrrigationCause'}
                purpose: {$ref: '#/components/schemas/RunPurpose'}
        last_outcome:
          anyOf:
            - type: 'null'
            - type: object
              required: [outcome, at]
              properties:
                outcome: {$ref: '#/components/schemas/RunOutcome'}
                at: {type: string, format: date-time}
                reason: {type: [string, 'null']}
        sync: {$ref: '#/components/schemas/ReadbackState', description: This line's fields against the program hash}
    Command:
      type: object
      description: >-
        An irrigation_command row: pending until the ingestor marks it sent, just before it calls the device (sent at
        most once), or failed when not sent within 2 min. Relay edges and irr_state show the outcome
      required: [command_id, kind, line_id, status, actor, created_at]
      properties:
        command_id: {type: string, format: uuid}
        kind: {type: string, enum: [run, stop, clear_fault, override]}
        line_id: {type: [string, 'null'], pattern: '^L(0[1-9]|1[01])$', description: Null means every line}
        args: {type: object, description: The request body as stored}
        status: {type: string, enum: [pending, sent, failed]}
        actor: {$ref: '#/components/schemas/Actor'}
        reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
    CircuitId: {type: string, enum: [wall_drip, center_drip, center_mister, south_mister, west_mister]}
    Variant: {type: string, enum: [clean, fertilized]}
    CircuitVariant:
      type: object
      description: >-
        One variant of a physical line: its relay, or line_id null and wired false when that valve has no relay (shown,
        never scheduled or run). master_valve: L03 opens with it, fertilized only (#1336)
      required: [variant, line_id, wired, master_valve, enabled, running]
      properties:
        variant: {$ref: '#/components/schemas/Variant'}
        line_id: {anyOf: [{$ref: '#/components/schemas/LineId'}, {type: 'null'}]}
        wired: {type: boolean}
        master_valve: {type: boolean}
        enabled: {type: boolean}
        running: {type: boolean}
    Circuit:
      type: object
      description: >-
        A physical line (#1336): Wall drip (every wall and shelf), Center drip, and the Center, South and West misters,
        each with a clean and a fertilized variant mapped to its relay. Fog is a climate device, not a physical line
      required: [circuit_id, name, zone, kind, clean, fertilized]
      properties:
        circuit_id: {$ref: '#/components/schemas/CircuitId'}
        name: {type: string}
        zone: {type: string, enum: [wall, center, south, west]}
        kind: {type: string, enum: [drip, mister]}
        clean: {$ref: '#/components/schemas/CircuitVariant'}
        fertilized: {$ref: '#/components/schemas/CircuitVariant'}
    IrrigationStatus:
      type: object
      required: [server_time, engine, program, lines, circuits, active_runs, today, limits, leak, occupancy, fallback_active, freshness]
      properties:
        server_time: {type: string, format: date-time}
        engine: {type: boolean, description: 'The live controller connection has the irrigation engine (irr_command); false before the engine firmware'}
        program: {$ref: '#/components/schemas/ProgramSync'}
        lines: {type: array, items: {$ref: '#/components/schemas/IrrigationLine'}, description: L01-L11}
        circuits: {type: array, items: {$ref: '#/components/schemas/Circuit'}, description: 'The five physical lines over the relays (#1336)'}
        active_runs:
          type: array
          description: The run on each manifold
          items:
            type: object
            required: [manifold, line_id, cause, started_at]
            properties:
              manifold: {type: string, enum: [drip, mister]}
              line_id: {$ref: '#/components/schemas/LineId'}
              cause: {$ref: '#/components/schemas/IrrigationCause'}
              slot_id: {type: [integer, 'null']}
              started_at: {type: string, format: date-time}
              ends_at: {type: [string, 'null'], format: date-time}
              pulses_done: {type: [integer, 'null']}
              pulses_total: {type: [integer, 'null']}
        today:
          type: object
          description: >-
            Valve-open minutes today by zone: wall, center, south and west, and fog for L11's humidification. L03's
            supply minutes are never in zone totals. Partial day
          required: [date, zones]
          properties:
            date: {type: string, format: date}
            zones: {type: object, additionalProperties: {type: [number, 'null']}}
            climate_zones: {type: object, additionalProperties: {type: [number, 'null']}, description: 'The VPD and fallback misting inside each zone''s minutes (#1348), with the same nulls; fog is all climate'}
            climate:
              type: object
              description: 'The site''s mist and fog today (#1348): VPD and fallback misting plus fog; null on a day with no data'
              properties:
                minutes: {type: [number, 'null']}
                pulses: {type: [integer, 'null']}
                gal: {type: [integer, 'null'], description: Whole gallons}
        limits:
          type: object
          description: Per-line duty and drip caps are on each line (today.minutes against daily_cap_min)
          required: [saf4_gal, soft_budget_gal]
          properties:
            saf4_gal: {$ref: '#/components/schemas/UsedOfMax'}
            soft_budget_gal: {$ref: '#/components/schemas/UsedOfMax'}
        leak: {$ref: '#/components/schemas/Leak'}
        occupancy: {$ref: '#/components/schemas/Occupancy'}
        fallback_active: {type: boolean, description: 'degraded_only slots are running (D-IRP-12)'}
        freshness: {$ref: '#/components/schemas/Freshness', description: irr_state (published on transitions)}
    ScheduleDays:
      type: array
      description: The weekdays the schedule runs on
      minItems: 1
      uniqueItems: true
      items: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}
    ScheduleStart:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [clock, sunrise, solar_noon, sunset]}
        clock: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Local HH:MM when kind is clock}
        offset_min: {type: integer, minimum: -240, maximum: 240, default: 0, description: Solar kinds}
    ScheduleInput:
      type: object
      description: 'Bounds per irrigation §4.3, checked per line kind on submit; values snap to whole seconds and minutes'
      properties:
        line_id: {type: string, pattern: '^L(0[124-9]|10)$', description: 'L01, L02, L04-L10 (not L03 or L11)'}
        circuit_id:
          $ref: '#/components/schemas/CircuitId'
          description: >-
            The physical line (#1336), with variant, instead of line_id; the API stores the variant's relay. An edit may
            give variant alone to switch clean and fertilized on the same physical line
        variant: {$ref: '#/components/schemas/Variant'}
        label: {type: string, maxLength: 60}
        enabled: {type: boolean, default: true}
        days: {$ref: '#/components/schemas/ScheduleDays'}
        start: {$ref: '#/components/schemas/ScheduleStart'}
        on_s: {type: integer, minimum: 10, maximum: 7200, description: 'Seconds per run or pulse; misters 10-90; fertilizer the feed'}
        count: {type: integer, minimum: 1, maximum: 60, default: 1, description: 'Pulses in a mist window; drips use 1'}
        gap_s: {type: integer, minimum: 0, maximum: 600, default: 0, description: 'Mister gap 30-600; drips 0'}
        prewet_s: {type: integer, minimum: 0, maximum: 1800, default: 0, description: Fertilizer lines only}
        flush_s: {type: integer, minimum: 0, maximum: 1800, default: 0, description: Fertilizer lines only}
        degraded_only: {type: boolean, default: false, description: 'L04, L07, L09 only (D-IRP-12)'}
        manual:
          type: boolean
          default: true
          description: 'Iris skips the schedule while true. A REST create or edit that omits it stores true (the dashboard default, R3); MCP writes default false'
        reason: {type: string, maxLength: 500}
    ScheduleCreate:
      allOf:
        - $ref: '#/components/schemas/ScheduleInput'
        - required: [days, start, on_s]
          description: 'The line: line_id, or circuit_id and variant (#1336); a variant whose valve is not wired is unknown_target'
          properties:
            manual: {type: boolean, default: true, description: 'Omitted on a REST create means true (the dashboard default); MCP creates default false'}
    Schedule:
      allOf:
        - $ref: '#/components/schemas/ScheduleInput'
        - type: object
          required: [slot_id, line_id, enabled, days, start, on_s, count, manual, sync, updated_by, updated_at]
          properties:
            slot_id: {type: integer, minimum: 1, maximum: 65535}
            manual_before: {type: [boolean, 'null'], description: The flag before this write (write responses)}
            sync: {$ref: '#/components/schemas/ReadbackState'}
            updated_by: {$ref: '#/components/schemas/Actor'}
            updated_at: {type: string, format: date-time}
    Occurrence:
      type: object
      required: [slot_id, line_id, planned_start, status]
      properties:
        slot_id: {type: integer}
        line_id: {$ref: '#/components/schemas/LineId'}
        planned_start: {type: string, format: date-time}
        status: {type: string, enum: [planned, skipped, blocked, running, done]}
        outcome: {anyOf: [{$ref: '#/components/schemas/RunOutcome'}, {type: 'null'}], description: 'Set when done; unknown when no outcome reached the platform'}
        reason: {type: [string, 'null'], description: 'Why skipped, blocked or missed, in words, e.g. line disabled. A pause reads ''line paused by <name>: <reason>'', the reason left out when none was given. A planned one may carry a note: only while VPD sensing is degraded, ends at the daily cap'}
        run_id: {type: [string, 'null']}
    ScheduleAgenda:
      type: object
      required: [schedules, occurrences, counts, bounds, solar]
      properties:
        schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        occurrences: {type: array, items: {$ref: '#/components/schemas/Occurrence'}, description: 'By planned start; the week view draws them per line and day'}
        counts:
          type: object
          required: [schedules, max_schedules]
          properties:
            schedules: {type: integer}
            max_schedules: {type: integer, const: 24}
        bounds:
          type: object
          description: 'Per line kind (drip, mister, fert_drip, fert_mister), from verdify_schemas/irrigation.py, so editors and agents see the limits'
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required: [min, max]
              properties: {min: {type: number}, max: {type: number}}
        solar:
          type: array
          description: Per local day in the window, from verdify_schemas/solar.py, for previews
          items:
            type: object
            required: [date, sunrise, solar_noon, sunset]
            properties:
              date: {type: string, format: date}
              sunrise: {type: string, format: date-time}
              solar_noon: {type: string, format: date-time}
              sunset: {type: string, format: date-time}
    RunRequest:
      type: object
      description: >-
        Drips: minutes. Fertilizer drips (L02, L06): minutes, prewet_s, flush_s. Misters: on_s, count, gap_s.
        Fertilizer misters (L08, L10): on_s, count and gap_s within the mister bounds, plus prewet_s and flush_s. Fog
        (L11): minutes, 1-30. Before the engine firmware only L01 runs, for its configured irrig_wall_duration_min
      properties:
        minutes: {type: integer, minimum: 1, maximum: 120, description: 'Drips 1-120; fog 1-30'}
        prewet_s: {type: integer, minimum: 0, maximum: 1800}
        flush_s: {type: integer, minimum: 0, maximum: 1800}
        on_s: {type: integer, minimum: 10, maximum: 90}
        count: {type: integer, minimum: 1, maximum: 60}
        gap_s: {type: integer, minimum: 30, maximum: 600}
        reason: {type: string, maxLength: 500}
    LineCommand:
      type: object
      description: Stop or clear-fault target; omit line_id for every line
      properties:
        line_id: {$ref: '#/components/schemas/LineId'}
        reason: {type: string, maxLength: 500}
    LineUpdate:
      type: object
      properties:
        enabled: {type: boolean}
        vpd_member: {type: boolean, description: 'L04, L07 and L09 only'}
        schedule_member: {type: boolean, description: 'L04, L07 and L09 only; on for the first time needs the check'}
        checked: {type: boolean, description: 'Dashboard only (MCP tools do not take it); records checked_by and checked_at'}
        check_note: {type: string, maxLength: 500, description: Optional; dashboard only}
        daily_cap_min: {type: integer, minimum: 0, maximum: 480}
        vpd_reserve_min: {type: integer, minimum: 0, maximum: 480, description: At most daily_cap_min}
        paused_until: {type: [string, 'null'], format: date-time, description: Null or now resumes; VPD misting carries on}
        manual:
          type: boolean
          description: 'Iris skips the line while true. A REST definition edit (enabled, vpd_member, schedule_member, daily_cap_min or vpd_reserve_min) that omits it stores true (the dashboard default, R3); a body with none of those (only paused_until, the check or a reason) never changes it; MCP definition edits default false'
        reason: {type: string, maxLength: 500}
    OverrideRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [fans, humidify, vent_bypass, clear, restart]}
        minutes: {type: integer, minimum: 1, maximum: 120, description: 'Needed for fans, humidify and vent_bypass'}
        reason: {type: string, maxLength: 500}
    MinutesReport:
      type: object
      description: A period with coverage no_data has no rows; draw a gap, never 0
      required: [from, to, group_by, periods, rows]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        group_by: {type: string, enum: [zone, line, cause]}
        purpose: {anyOf: [{$ref: '#/components/schemas/RunPurpose'}, {type: 'null'}], description: The purpose filter applied; null for both}
        periods:
          type: array
          items:
            type: object
            required: [start, coverage]
            properties:
              start: {type: string, format: date}
              coverage: {type: string, enum: [complete, partial, no_data], description: Today and outage days are partial}
        rows:
          type: array
          description: Always split by cause, purpose and chemistry so charts can stack
          items:
            type: object
            required: [period, group, cause, chemistry, minutes]
            properties:
              period: {type: string, format: date}
              group: {type: string, description: 'Zone (wall, center, south, west, and fog for L11''s humidification), line id or cause. L03''s supply minutes appear only by line or cause, never in zone totals'}
              cause: {$ref: '#/components/schemas/IrrigationCause'}
              purpose: {$ref: '#/components/schemas/RunPurpose'}
              chemistry: {type: string, enum: [clean, fert]}
              minutes: {type: number}
              pulses: {type: [integer, 'null']}
              gal: {type: [integer, 'null'], description: Whole gallons}
    WaterUse:
      type: object
      description: 'API-21: daily water use in whole gallons. There is no rate and no flow flag'
      required: [from, to, days]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, description: 'Inclusive local day: today, a partial day'}
        days:
          type: array
          description: 'One per America/Denver day, oldest first. On a no_data day every value is null, never 0'
          items:
            type: object
            required: [date, coverage, meter_gal, by_line, by_cause, no_valve_gal]
            properties:
              date: {type: string, format: date}
              coverage: {type: string, enum: [complete, partial, no_data], description: 'From v_water_meter_daily quality: ok is complete; unavailable, or no row, is no_data; anything else is partial'}
              meter_gal: {type: [integer, 'null'], description: 'The site meter''s day total (main_pulse)'}
              by_line: {type: [object, 'null'], additionalProperties: {type: integer}, description: 'Verdify-valve gallons by line id'}
              by_cause: {type: [object, 'null'], additionalProperties: {type: integer}, description: Verdify-valve gallons by IrrigationCause}
              by_purpose: {type: [object, 'null'], additionalProperties: {type: integer}, description: 'Verdify-valve gallons by RunPurpose (#1348): irrigation and climate'}
              no_valve_gal: {type: [integer, 'null'], description: 'Meter water while no Verdify valve was open: the hose, sink, hydro or a leak'}
    LightingDays:
      type: object
      description: 'API-22: each grow-light circuit by America/Denver day, oldest first'
      required: [from, to, circuits]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        circuits:
          type: array
          items:
            type: object
            required: [light, equipment, label, days]
            properties:
              light: {type: string, enum: [main, grow]}
              equipment: {type: string, examples: [grow_light_main]}
              label: {type: string}
              days:
                type: array
                items:
                  type: object
                  required: [date, partial, on_s, starts, start_hour, cutoff_hour, lux_on, lux_off, target_min, window_min, qualified_min]
                  properties:
                    date: {type: string, format: date}
                    partial: {type: boolean, description: 'Today: counted up to now'}
                    on_s: {type: integer, description: 'Seconds the Lutron readback was on in the day'}
                    starts: {type: integer, description: 'OFF to ON edges in the day'}
                    start_hour: {type: [integer, 'null'], description: 'The photoperiod window''s start, local hour; null without a readback'}
                    cutoff_hour: {type: [integer, 'null'], description: 'The window''s cutoff, local hour'}
                    lux_on: {type: [number, 'null'], description: 'ON threshold, outdoor lux'}
                    lux_off: {type: [number, 'null'], description: 'OFF threshold: ON plus the hysteresis'}
                    target_min: {type: [integer, 'null'], description: 'Target qualified light minutes'}
                    window_min: {type: [integer, 'null'], description: 'Minutes of the window counted so far'}
                    qualified_min: {type: [integer, 'null'], description: 'Minutes in the window with enough outdoor light or the light on; null without a policy readback'}
    Run:
      type: object
      description: >-
        One run: a drip run, a fertilizer stage or a mist episode, from relay edges joined to its irrigation_ledger
        row. Listed once it has ended; the run in progress is in API-IRR-01
      required: [run_id, line_id, zone, chemistry, cause, started_at, open_s, outcome]
      properties:
        run_id: {type: string}
        line_id: {$ref: '#/components/schemas/LineId'}
        zone: {type: string}
        chemistry: {type: string, enum: [clean, fert]}
        cause: {$ref: '#/components/schemas/IrrigationCause'}
        purpose: {$ref: '#/components/schemas/RunPurpose'}
        slot_id: {type: [integer, 'null']}
        schedule_label: {type: [string, 'null']}
        command_id: {type: [string, 'null'], format: uuid, description: The run-now command that started it}
        actor: {anyOf: [{$ref: '#/components/schemas/Actor'}, {type: 'null'}], description: Null when the controller started it}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        open_s: {type: integer, description: '0 for skipped, missed and cap occurrences'}
        pulses: {type: [integer, 'null']}
        gal: {type: [integer, 'null'], description: 'Whole gallons from the one site meter (it also counts the hose, sink and hydro); informational. 0 when the run moved no water; null without meter data'}
        outcome: {$ref: '#/components/schemas/RunOutcome', description: 'From the ledger; unknown when its outcome never reached the platform. A run with no ledger row (a VPD episode, or a run before the engine firmware) reads ok'}
        reason: {type: [string, 'null']}
    RunPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/Run'}}}
    # ------------------------------------------------------------ climate law (API-30, API-31)
    LawView:
      type: object
      description: >-
        API-30: what the controller's climate law is doing now and why. Thresholds come from the band in use and the
        law constants this API build was generated from, never from a typed value. Null means the controller has not
        reported it, never 0
      required: [server_time, observed_at, reporting, band, inputs, rules, drying, timing, lead_fan, alone, constants]
      properties:
        server_time: {type: string, format: date-time}
        observed_at: {type: [string, 'null'], format: date-time, description: The newest law record's time; null with no law record}
        reporting: {type: boolean, description: 'The newest law record is at most 120 s old (the rule control_proof.law_fresh uses)'}
        band: {$ref: '#/components/schemas/LawBand'}
        inputs: {$ref: '#/components/schemas/LawInputs'}
        rules:
          type: array
          description: 'One per rule, in this fixed order: heat1, heat2, cooling, second_fan, fog, mist, drying, hot_limit, cold_limit'
          items: {$ref: '#/components/schemas/LawRule'}
        drying: {$ref: '#/components/schemas/LawDrying'}
        timing: {$ref: '#/components/schemas/LawTiming'}
        lead_fan: {type: [string, 'null'], enum: [fan1, fan2, null], description: 'The fan the law starts first (system_state lead_fan); null until the controller says'}
        alone: {$ref: '#/components/schemas/LawAlone'}
        constants: {$ref: '#/components/schemas/LawConstants'}
    LawBand:
      type: object
      description: The band the controller is using now (the law record's b field), and how it compares with the host's
      required: [temp_low_f, temp_high_f, vpd_low_kpa, vpd_high_kpa, repaired, source, host, differs]
      properties:
        temp_low_f: {type: [number, 'null'], description: '°F'}
        temp_high_f: {type: [number, 'null'], description: '°F'}
        vpd_low_kpa: {type: [number, 'null'], description: kPa}
        vpd_high_kpa: {type: [number, 'null'], description: kPa}
        repaired: {type: [boolean, 'null'], description: "The controller's band check changed the band it received (the record's br field)"}
        source:
          type: [string, 'null']
          enum: [onchip_curve, corridor, dispatcher_legacy, null]
          description: 'Where the controller takes its band from (diagnostics.band_source): its own diurnal curve from the pushed anchors, the corridor, or the older dispatcher push'
        host:
          description: 'The band the host computes for now (fn_band_setpoints(now())); null when it cannot'
          anyOf: [{$ref: '#/components/schemas/HostBandEdges'}, {type: 'null'}]
        differs: {type: [boolean, 'null'], description: 'The controller''s band and the host''s differ by more than 1.0 °F or 0.10 kPa on an edge (the band_device_db_divergence rule); null when either is missing'}
    LawInputs:
      type: object
      description: What the law is reading
      required: [temp_f, vpd_kpa, rh_pct, dew_point_f, outdoor, observed_at]
      properties:
        temp_f: {type: [number, 'null'], description: 'The control temperature, °F (climate.temp_control)'}
        vpd_kpa: {type: [number, 'null'], description: 'The control VPD, kPa (climate.vpd_control)'}
        rh_pct: {type: [number, 'null'], description: Indoor relative humidity}
        dew_point_f: {type: [number, 'null'], description: 'Indoor dew point, °F'}
        outdoor:
          type: object
          required: [source, temp_f, rh_pct, dew_point_f]
          properties:
            source:
              type: [string, 'null']
              enum: [station, intake, none, null]
              description: 'Where the outdoor reading comes from (system_state outdoor_source): the weather station, the intake probe, or none'
            temp_f: {type: [number, 'null']}
            rh_pct: {type: [number, 'null']}
            dew_point_f: {type: [number, 'null']}
        observed_at: {type: [string, 'null'], format: date-time, description: The climate row the readings come from}
    LawRule:
      type: object
      description: One rule of the law with its thresholds, latch, request and the relays it drives
      required: [id, signal, direction, on_at, off_at, latched, requested, relays, hold]
      properties:
        id: {type: string, enum: [heat1, heat2, cooling, second_fan, fog, mist, drying, hot_limit, cold_limit]}
        signal: {type: string, enum: [temp, vpd], description: 'The reading the rule watches: temperature (°F) or VPD (kPa)'}
        direction: {type: string, enum: [below, above], description: The rule turns on when the signal goes below or above on_at}
        on_at: {type: [number, 'null'], description: 'Turns on past this, in the signal''s unit, from the band in use and the constants'}
        off_at: {type: [number, 'null'], description: 'Turns off back past this, in the signal''s unit'}
        latched:
          type: [boolean, 'null']
          description: >-
            The rule's latch bit (h1, h2, cool, cool2, wet, mist, dry); hot_limit and cold_limit have no latch and carry
            their request bits
        requested: {type: [boolean, 'null'], description: "The law's request after its own gates (heat1, heat2, cooling, fans>=2, fog, mist, drying, hot, cold)"}
        relays: {type: array, items: {$ref: '#/components/schemas/LawRelay'}, description: The relays this rule drives}
        hold:
          description: >-
            Set only when the host can prove it: requested with the relay off inside its minimum off time (min_off), or
            not requested with the relay on inside its minimum on time (min_on); null otherwise. Nothing is proven for a
            relay a manual run holds (or may hold, while its flag is unknown), for the fogger off unless the controller
            names its minimum off time as the reason, or for the fogger on outside the protection limits, where the
            irrigation engine can run it
          anyOf:
            - type: 'null'
            - type: object
              required: [kind, remaining_s]
              properties:
                kind: {type: string, enum: [min_off, min_on]}
                remaining_s: {type: integer, minimum: 0}
    LawRelay:
      type: object
      required: [equipment, state, since]
      properties:
        equipment: {type: string, enum: [heat1, heat2, vent, fan1, fan2, fog, mister_any]}
        state: {type: string, enum: ['on', 'off', unknown], description: The newest equipment_state row; unknown while the controller is not reporting}
        since: {type: [string, 'null'], format: date-time, description: Start of the current run of equal states}
    LawDrying:
      type: object
      description: >-
        Drying: venting with drier outdoor air when the house is too humid. running: drying runs; refused: the house
        wants drying and the law refuses it, for refused_reason; not_wanted: the house is dry enough; unknown: no law
        record
      required: [state, wanted, outdoor_drier, refused_reason, cost_kwh_per_kg, limit_kwh_per_kg, limit_source, wanted_below_kpa, stop_above_kpa, min_temp_f, checks, meter, today]
      properties:
        state: {type: string, enum: [running, refused, not_wanted, unknown]}
        wanted: {type: [boolean, 'null'], description: 'The dry latch: the house is humid enough to want drying'}
        outdoor_drier: {type: [boolean, 'null'], description: 'The air latch: outdoor air holds less water than indoor air'}
        refused_reason:
          type: [string, 'null']
          enum: [none, no_outdoor, cooling, furnace, not_drier, too_cold, cost, humidity_invalid, no_temperature, null]
          description: "The record's dr field: the first refusal while drying is wanted and not running; humidity_invalid or no_temperature whenever those inputs are missing; none otherwise"
        cost_kwh_per_kg: {type: [number, 'null'], description: 'kWh of heat per kg of water removed (the record''s e field); null when the controller reports no price (no outdoor data)'}
        limit_kwh_per_kg: {type: [number, 'null'], description: 'The drying cost limit in force on the controller (the record''s lim field)'}
        limit_source: {type: string, enum: [owner, default], description: 'owner: a desired_state row for dry_cost_limit_kwh_per_kg exists; default: the controller''s compiled value'}
        wanted_below_kpa: {type: [number, 'null'], description: 'Drying is wanted below this VPD: vpd_low plus the drying-on margin'}
        stop_above_kpa: {type: [number, 'null'], description: 'Drying stops above this VPD: vpd_low plus the drying-off margin'}
        min_temp_f: {type: [number, 'null'], description: 'Drying needs the house above this: the band low plus the drying temperature margin'}
        checks:
          type: array
          description: >-
            The decision chain in the order the law refuses, so the first check that fails is refused_reason (no_outdoor
            leaves outdoor_drier null). warm_enough and worth_it decide only the start: both are true while a run is on
          items:
            type: object
            required: [id, ok]
            properties:
              id: {type: string, enum: [humid, not_cooling, furnace_off, outdoor_drier, warm_enough, worth_it]}
              ok: {type: [boolean, 'null']}
        meter:
          type: object
          description: "The controller's drying counters since its last restart (system_state climate_drying_meter)"
          required: [seconds, water_g, heat_wh, refused_seconds, observed_at]
          properties:
            seconds: {type: [number, 'null'], description: Seconds drying ran with the vent open}
            water_g: {type: [number, 'null'], description: Grams of water carried out}
            heat_wh: {type: [number, 'null'], description: Heat carried out with it}
            refused_seconds: {type: [number, 'null'], description: Seconds drying was wanted and did not run}
            observed_at: {type: [string, 'null'], format: date-time}
        today:
          description: "Today's daily_record row; null before it is written"
          anyOf:
            - type: 'null'
            - type: object
              required: [seconds, runs, water_g, heat_wh, lower_bound]
              properties:
                seconds: {type: [number, 'null']}
                runs: {type: [integer, 'null']}
                water_g: {type: [number, 'null']}
                heat_wh: {type: [number, 'null']}
                lower_bound: {type: [boolean, 'null'], description: A restart lost meter counts today}
    LawTiming:
      type: object
      description: The law's timing constants and safety limits, from the generated constants module
      required: [relay_min_on_s, relay_min_off_s, fog_min_on_s, fog_min_off_s, furnace_boot_wait_s, mist_pulse_s, mist_gap_s, hot_limit_f, cold_limit_f]
      properties:
        relay_min_on_s: {type: integer}
        relay_min_off_s: {type: integer}
        fog_min_on_s: {type: integer}
        fog_min_off_s: {type: integer}
        furnace_boot_wait_s: {type: integer}
        mist_pulse_s: {type: integer}
        mist_gap_s: {type: integer}
        hot_limit_f: {type: number, description: 'Everything cools above this, °F'}
        cold_limit_f: {type: number, description: 'Everything heats below this, °F'}
    LawAlone:
      type: object
      description: What the controller needs to keep running without the host
      required: [clock, probes, host, gap_log]
      properties:
        clock:
          type: object
          required: [valid, sync_age_s]
          properties:
            valid: {type: [boolean, 'null'], description: The controller's clock is set (diagnostics.sntp_valid)}
            sync_age_s: {type: [number, 'null'], description: Seconds since its last time sync}
        probes:
          type: object
          required: [active, degraded]
          properties:
            active: {type: [integer, 'null'], description: Probes the controller reads (diagnostics.active_probe_count)}
            degraded: {type: [boolean, 'null'], description: The controller runs on fewer probes than it should (diagnostics.sensor_degraded_active)}
        host:
          type: object
          required: [connected, heartbeat_age_s]
          properties:
            connected: {type: [boolean, 'null'], description: The ingestor is connected to the controller}
            heartbeat_age_s: {type: [number, 'null'], description: Age of the ingestor's heartbeat}
        gap_log:
          type: [string, 'null']
          enum: [armed, not_armed_yet, nvs_small, nvs_full, nvs_slow, nvs_error, null]
          description: >-
            The gap log that keeps a record while the host is away (diagnostics.gap_log_state): armed, not armed yet
            since the restart, or off because storage is too small, full, too slow or failing
    LawConstants:
      type: object
      required: [hash, release_hash, matches, observed_at]
      properties:
        hash: {type: [string, 'null'], description: "The hash of the law constants the controller reports (system_state climate_law_constants)"}
        release_hash: {type: string, description: The hash of the constants this API build was generated from}
        matches: {type: [boolean, 'null'], description: The two hashes are equal; null while the controller has not reported one}
        observed_at: {type: [string, 'null'], format: date-time}
    LawHistory:
      type: object
      description: 'API-31: the law''s decisions over [from, to). A span of more than 180 s with no law record is unknown'
      required: [from, to, first_record_at, lanes, drying, outdoor_source, band_repaired, cost, band]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        first_record_at: {type: [string, 'null'], format: date-time, description: The oldest law record; earlier spans have none}
        lanes: {type: array, items: {$ref: '#/components/schemas/LawLane'}, description: 'One per request and per latch, in the fixed order of LawLane.key'}
        drying:
          type: array
          description: Drying's state over the window, as change intervals
          items:
            type: object
            required: [start, end, state, reason]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
              state: {type: string, enum: [running, refused, not_wanted, unknown]}
              reason: {type: [string, 'null'], description: 'The refusal reason while refused (LawDrying.refused_reason''s values); null otherwise'}
        outdoor_source:
          type: array
          items:
            type: object
            required: [start, end, source]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
              source: {type: string, enum: [station, intake, none, unknown]}
        band_repaired:
          type: array
          description: The spans in which the controller's band check changed the band it received
          items:
            type: object
            required: [start, end]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
        cost:
          type: object
          description: The drying price and the limit in force, per bucket; null where no record reports one
          required: [bucket_s, t, cost_kwh_per_kg, limit_kwh_per_kg]
          properties:
            bucket_s: {type: integer, enum: [60, 300, 900, 3600, 10800, 86400]}
            t: {type: array, items: {type: integer}, description: 'Bucket starts, epoch seconds'}
            cost_kwh_per_kg: {$ref: '#/components/schemas/NullableNumbers'}
            limit_kwh_per_kg: {$ref: '#/components/schemas/NullableNumbers'}
        band:
          type: object
          description: The band the controller used, per bucket
          required: [bucket_s, t, temp_low_f, temp_high_f, vpd_low_kpa, vpd_high_kpa]
          properties:
            bucket_s: {type: integer, enum: [60, 300, 900, 3600, 10800, 86400]}
            t: {type: array, items: {type: integer}, description: 'Bucket starts, epoch seconds'}
            temp_low_f: {$ref: '#/components/schemas/NullableNumbers'}
            temp_high_f: {$ref: '#/components/schemas/NullableNumbers'}
            vpd_low_kpa: {$ref: '#/components/schemas/NullableNumbers'}
            vpd_high_kpa: {$ref: '#/components/schemas/NullableNumbers'}
    LawLane:
      type: object
      required: [key, group, intervals]
      properties:
        key:
          type: string
          enum: [request.heat1, request.heat2, request.vent, request.fog, request.mist, request.fan1, request.fan2, request.cooling, request.drying,
            request.hot, request.cold, latch.h1, latch.h2, latch.cool, latch.cool2, latch.wet, latch.mist, latch.dry, latch.air, latch.run]
          description: 'request.fan1 is at least one fan, request.fan2 both fans'
        group: {type: string, enum: [request, latch]}
        intervals:
          type: array
          items:
            type: object
            required: [start, end, state]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
              state: {type: string, enum: ['on', 'off', unknown]}

    # ------------------------------------------------------------ daily record (API-32, API-33)
    DailyRecord:
      type: object
      description: 'API-32: one row per America/Denver day, oldest first, with the 7- and 30-day means and the periods before and since the law'
      required: [from, to, days, means, law_started, baseline, since_law, server_time]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, description: Inclusive local day}
        days: {type: array, items: {$ref: '#/components/schemas/RecordDay'}, description: Ascending by date}
        means:
          type: object
          description: The means the reviewer and the owner compare against, over complete days only; null with no complete day
          required: [d7, d30]
          properties:
            d7: {anyOf: [{$ref: '#/components/schemas/RecordMeans'}, {type: 'null'}]}
            d30: {anyOf: [{$ref: '#/components/schemas/RecordMeans'}, {type: 'null'}]}
        law_started: {type: [string, 'null'], format: date, description: "The local day of the controller's first law record; null when none is stored"}
        baseline:
          description: The 30 days before law_started, leaving out days with a band edit (activity_log band.write); null when law_started is null
          anyOf: [{$ref: '#/components/schemas/RecordPeriod'}, {type: 'null'}]
        since_law:
          description: >-
            The days from the day after law_started through yesterday, band-edit days left out as in baseline; null
            until one of those days is complete (ended and its record stored)
          anyOf: [{$ref: '#/components/schemas/RecordPeriod'}, {type: 'null'}]
        server_time: {type: string, format: date-time}
    RecordPeriod:
      type: object
      description: >-
        A fixed period of local days, from and to inclusive, and its means over its complete days less the days on
        which the house band was changed. A period with no such day has means.days 0 and every mean null; a real
        figure, zero included, always comes with days above 0, so a reader tells the two apart by days
      required: [from, to, excluded_days, means]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, description: Inclusive local day}
        excluded_days: {type: integer, minimum: 0, description: The days in the period left out because the house band was changed on them (band edits)}
        means:
          $ref: '#/components/schemas/RecordMeans'
          description: "Over the period's complete days that are not left out; days 0 with every mean null when there are none"
    RecordDay:
      type: object
      required: [date, complete, band, relays, climate_starts, climate_run_s, energy, gas, water, drying, counter_sample_pct, alerts]
      properties:
        date: {type: string, format: date}
        complete: {type: boolean, description: The local day has ended and its record is stored}
        band: {anyOf: [{$ref: '#/components/schemas/RecordBand'}, {type: 'null'}], description: 'daily_band_compliance; null with no row'}
        relays:
          type: [object, 'null']
          description: >-
            By equipment (heat1, heat2, fan1, fan2, vent, fog, mister_center, mister_south, mister_west, drip_wall,
            drip_center), from the daily relay record; null with no row
          additionalProperties:
            type: object
            required: [starts, run_s, repaired_runs]
            properties:
              starts: {type: integer}
              run_s: {type: number}
              repaired_runs: {type: integer, description: Runs whose missing edge the record repaired}
        climate_starts: {type: [integer, 'null'], description: 'The six climate relays together (heat1, heat2, fan1, fan2, vent, fog)'}
        climate_run_s: {type: [number, 'null']}
        energy:
          type: object
          required: [kwh, kwh_partial, coverage_pct]
          properties:
            kwh: {type: [number, 'null'], description: The 24-hour figure; null under 70 % meter coverage}
            kwh_partial: {type: [number, 'null'], description: What the meter reported}
            coverage_pct: {type: [number, 'null'], description: Share of the day the meter reported}
        gas:
          type: object
          required: [therms_est]
          properties:
            therms_est: {type: [number, 'null'], description: Estimated from furnace run time; gas is not metered}
        water:
          type: object
          required: [total_gal, crop_gal, wetting_gal, house_gal, complete]
          properties:
            total_gal: {type: [number, 'null'], description: The site meter's day total}
            crop_gal: {type: [number, 'null'], description: 'Water for the plants: wetting plus wall irrigation and fertigation (daily_record.planning_water_gal)'}
            wetting_gal: {type: [number, 'null'], description: Fog and mister water}
            house_gal: {type: [number, 'null'], description: Water with no Verdify valve open (the hose, sink or hydro)}
            complete: {type: [boolean, 'null'], description: The meter covered the whole day}
        drying: {anyOf: [{$ref: '#/components/schemas/RecordDrying'}, {type: 'null'}]}
        counter_sample_pct: {type: [number, 'null'], description: Share of the day the relay counters were sampled}
        alerts:
          type: [object, 'null']
          description: Alerts raised that day by severity (v_daily_scorecard); null with no row
          required: [critical, warning, info]
          properties:
            critical: {type: integer}
            warning: {type: integer}
            info: {type: integer}
    RecordBand:
      type: object
      description: The day's compliance with the served band (daily_band_compliance), in percent of graded minutes
      required: [both_pct, temp_pct, vpd_pct, both_day_pct, both_night_pct, temp_below_pct, temp_above_pct, vpd_below_pct, vpd_above_pct, graded_min, night_dryout_min, night_dried, above_full_cooling_min]
      properties:
        both_pct: {type: [number, 'null'], description: Temperature and VPD both in band}
        temp_pct: {type: [number, 'null']}
        vpd_pct: {type: [number, 'null']}
        both_day_pct: {type: [number, 'null']}
        both_night_pct: {type: [number, 'null']}
        temp_below_pct: {type: [number, 'null']}
        temp_above_pct: {type: [number, 'null']}
        vpd_below_pct: {type: [number, 'null']}
        vpd_above_pct: {type: [number, 'null']}
        graded_min: {type: [integer, 'null'], description: Minutes with a reading and a band}
        night_dryout_min: {type: [integer, 'null'], description: Night minutes the house spent drying out}
        night_dried: {type: [boolean, 'null'], description: The night dried out}
        above_full_cooling_min: {type: [integer, 'null'], description: Minutes above the band with every cooling stage running}
    RecordDrying:
      type: object
      required: [seconds, runs, furnace_starts_after, water_g, heat_wh, lower_bound, wanted_s, refused_s]
      properties:
        seconds: {type: [number, 'null']}
        runs: {type: [integer, 'null']}
        furnace_starts_after: {type: [integer, 'null'], description: Gas furnace starts soon after a drying run}
        water_g: {type: [number, 'null']}
        heat_wh: {type: [number, 'null']}
        lower_bound: {type: [boolean, 'null'], description: A restart lost meter counts that day}
        wanted_s: {type: [number, 'null'], description: Seconds the house wanted drying}
        refused_s:
          type: [object, 'null']
          description: Seconds drying was refused, by the refusal reason (LawDrying.refused_reason's values)
          additionalProperties: {type: number}
    RecordMeans:
      type: object
      description: Means over complete days only
      required: [days, both_pct, temp_pct, vpd_pct, nights_dried, climate_starts, climate_run_h, heat1_run_h, heat2_run_h, kwh, therms_est, crop_gal, drying_h]
      properties:
        days: {type: integer, description: How many complete days the mean covers}
        both_pct: {type: [number, 'null']}
        temp_pct: {type: [number, 'null']}
        vpd_pct: {type: [number, 'null']}
        nights_dried: {type: [integer, 'null'], description: Nights that dried out among those days}
        climate_starts: {type: [number, 'null']}
        climate_run_h: {type: [number, 'null']}
        heat1_run_h: {type: [number, 'null']}
        heat2_run_h: {type: [number, 'null']}
        kwh: {type: [number, 'null']}
        therms_est: {type: [number, 'null']}
        crop_gal: {type: [number, 'null']}
        drying_h: {type: [number, 'null']}
    RelayCheck:
      type: object
      description: "API-33: the controller's own relay counters against the stored daily relay record, newest day first"
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, comparison, boots, relays]
            properties:
              date: {type: string, format: date}
              comparison:
                type: string
                enum: [complete, partial, no_record, record_early]
                description: >-
                  complete: counters cover the whole day; partial: counters cover part of it (a restart or their first
                  day); no_record: no stored record for the day; record_early: the record was computed before the day
                  ended
              boots: {type: [integer, 'null'], description: Controller restarts that day}
              relays:
                type: array
                items:
                  type: object
                  required: [equipment, counter_starts, record_starts, starts_difference, counter_run_s, record_run_s, run_s_difference]
                  properties:
                    equipment: {type: string, examples: [heat1, fan1]}
                    counter_starts: {type: [integer, 'null']}
                    record_starts: {type: [integer, 'null']}
                    starts_difference: {type: [integer, 'null']}
                    counter_run_s: {type: [number, 'null'], description: The fans only; the controller counts no run time for the others}
                    record_run_s: {type: [number, 'null']}
                    run_s_difference: {type: [number, 'null']}

    # ------------------------------------------------------------ daily review (API-34)
    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, today, tokens, proposal_waiting]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Review'}, description: Newest first}
            today:
              type: object
              description: >-
                Today's review: due from 07:00 local, late after 10:00. written, delivered, requested and failed are the
                newest review's status for the day; due when it has none yet and expected_after has passed; not_due before
                then
              required: [review_date, status, missed, expected_after, late_after]
              properties:
                review_date: {type: string, format: date, description: The local day the review covers (yesterday)}
                status: {type: string, enum: [written, delivered, requested, failed, due, not_due]}
                missed: {type: boolean, description: 'The daily_review_missed alert is open'}
                expected_after: {type: string, const: '07:00', description: Local time the review is due from}
                late_after: {type: string, const: '10:00', description: Local time after which it is late}
            tokens:
              type: object
              description: The reviewer's token use
              required: [last, mean_7, mean_30, rise_pct, count_7, count_30]
              properties:
                last: {type: [integer, 'null'], description: The newest review's total tokens}
                mean_7: {type: [number, 'null']}
                mean_30: {type: [number, 'null']}
                count_7: {type: integer, minimum: 0, maximum: 7, description: How many finished reviews before the newest mean_7 averages; 0 when mean_7 is null}
                count_30: {type: integer, minimum: 0, maximum: 30, description: How many finished reviews before the newest mean_30 averages; 0 when mean_30 is null}
                rise_pct: {type: [number, 'null'], description: 'The newest review against the 7-review mean of the reviews before it'}
            proposal_waiting:
              description: The written review whose band proposal waits for the owner; null when none does
              anyOf:
                - type: 'null'
                - type: object
                  required: [review_id, review_date]
                  properties:
                    review_id: {type: integer}
                    review_date: {type: string, format: date}
    Review:
      type: object
      description: One planner_review row (v_dashboard_review)
      required: [id, kind, review_date, status, requested_at, requested_by, attempts, delivered_at, run_finished_at, written_at, failure, input_tokens, output_tokens, total_tokens, summary, proposal, proposal_state]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [daily, manual], description: 'daily: the ingestor wakes the reviewer after 07:00; manual: asked for on demand'}
        review_date: {type: string, format: date, description: The local day reviewed}
        status: {type: string, enum: [requested, delivered, written, failed]}
        requested_at: {type: string, format: date-time}
        requested_by: {type: string, examples: [ingestor]}
        attempts: {type: integer}
        delivered_at: {type: [string, 'null'], format: date-time}
        run_finished_at: {type: [string, 'null'], format: date-time}
        written_at: {type: [string, 'null'], format: date-time}
        failure:
          type: [string, 'null']
          enum: [gateway_rejected, gateway_unreachable, hermes_run_failed, hermes_run_cancelled, completed_without_review, attempts_exhausted, null]
          description: Why a failed review failed (verdify_schemas.review.ReviewFailure)
        input_tokens: {type: [integer, 'null']}
        output_tokens: {type: [integer, 'null']}
        total_tokens: {type: [integer, 'null']}
        summary: {type: [string, 'null'], description: The review in words}
        proposal: {anyOf: [{$ref: '#/components/schemas/ReviewProposal'}, {type: 'null'}]}
        proposal_state:
          type: [string, 'null']
          enum: [waiting, answered, superseded, null]
          description: >-
            waiting: this is the newest written review with a proposal and no band.write followed its written_at;
            answered: a band.write followed it; superseded: a newer written review exists. Null without a proposal
    ReviewProposal:
      type: object
      description: A band edit the review proposes (verdify_schemas.review.BandProposal); the owner applies it or not
      required: [changes, price, reason]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [param, label, unit, current, proposed]
            properties:
              param: {type: string, examples: [band_temp_low_sr]}
              label: {type: string}
              unit:
                type: [string, 'null']
                examples: ['°F', kPa]
                description: The row's registry unit; null for a row the registry gives no unit (the zone priorities)
              current: {type: [number, 'null'], description: The stored value now}
              proposed: {type: number}
        price: {type: string, description: 'The price-list rows the review quotes, as it stored them'}
        reason: {type: [string, 'null']}

    # ------------------------------------------------------------ system (API-35 to API-37)
    ControllerHealth:
      type: object
      description: >-
        API-35: the controller's hardware budget, from the newest non-null diagnostics value per column over 15 min.
        Null means not reported in that window, never 0
      required: [observed_at, firmware, uptime_s, restarts, heap, loop, nvs, wifi, clock, probes, band_source, gap_log, limits]
      properties:
        observed_at: {type: [string, 'null'], format: date-time}
        firmware:
          type: object
          required: [version, pinned, matches]
          properties:
            version: {type: [string, 'null'], description: The firmware the controller runs}
            pinned: {type: [string, 'null'], description: The firmware the ingestor expects (system_state ingestor_counters)}
            matches: {type: [boolean, 'null']}
        uptime_s: {type: [number, 'null']}
        restarts:
          type: object
          required: [count, reset_reason, booted_at]
          properties:
            count: {type: [integer, 'null']}
            reset_reason: {type: [string, 'null'], examples: [Software reset]}
            booted_at: {type: [string, 'null'], format: date-time}
        heap:
          type: object
          description: kB
          required: [free_kb, min_free_kb, largest_block_kb, minute_low_kb, largest_block_minute_low_kb]
          properties:
            free_kb: {type: [number, 'null']}
            min_free_kb: {type: [number, 'null'], description: The lowest since the restart}
            largest_block_kb: {type: [number, 'null']}
            minute_low_kb: {type: [number, 'null'], description: The lowest in the last minute}
            largest_block_minute_low_kb: {type: [number, 'null']}
        loop:
          type: object
          required: [worst_ms, stack_free_min_b]
          properties:
            worst_ms: {type: [number, 'null'], description: The slowest control loop in the last minute}
            stack_free_min_b: {type: [number, 'null'], description: The least free stack seen, bytes}
        nvs:
          type: object
          description: The controller's settings storage
          required: [used_entries, free_entries, write_worst_ms]
          properties:
            used_entries: {type: [integer, 'null']}
            free_entries: {type: [integer, 'null']}
            write_worst_ms: {type: [number, 'null']}
        wifi:
          type: object
          required: [rssi_dbm, disconnects, api_clients]
          properties:
            rssi_dbm: {type: [number, 'null']}
            disconnects: {type: [integer, 'null']}
            api_clients: {type: [integer, 'null'], description: Connections to the controller's API}
        clock:
          type: object
          required: [valid, sync_age_s, misses]
          properties:
            valid: {type: [boolean, 'null']}
            sync_age_s: {type: [number, 'null']}
            misses: {type: [integer, 'null'], description: Time syncs missed}
        probes:
          type: object
          required: [active, degraded, health]
          properties:
            active: {type: [integer, 'null']}
            degraded: {type: [boolean, 'null']}
            health: {type: [string, 'null'], description: 'The controller''s probe summary as it sends it', examples: [OK, 'North INVALID, South STALE']}
        band_source: {type: [string, 'null'], description: 'As LawBand.source', examples: [onchip_curve]}
        gap_log: {type: [string, 'null'], description: 'As LawAlone.gap_log', examples: [armed]}
        limits:
          type: object
          description: The hardware-budget thresholds from their one existing definition
          required: [heap_warning_kb, heap_critical_kb, largest_block_kb, ota_free_kb, loop_worst_ms, nvs_write_ms, stack_free_b, nvs_arm_free_pct, nvs_stop_free_pct]
          properties:
            heap_warning_kb: {type: number, description: Free heap under this for 2 min warns}
            heap_critical_kb: {type: number, description: Free heap under this is critical}
            largest_block_kb: {type: number, description: The largest free block a firmware update needs}
            ota_free_kb: {type: number, description: The free heap a firmware update needs}
            loop_worst_ms: {type: number, description: A control loop slower than this warns}
            nvs_write_ms: {type: number, description: Storage writes slower than this stop the gap log}
            stack_free_b: {type: number, description: Free stack under this warns}
            nvs_arm_free_pct: {type: number, description: The gap log arms with at least this share of storage free}
            nvs_stop_free_pct: {type: number, description: The gap log stops under this share free}
    DataContinuity:
      type: object
      description: 'API-36: whether telemetry is flowing, what was lost and what the gap log restored'
      required: [from, to, gap_log, outages, replayed, by_day, tables, probes, ingestor]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        gap_log: {type: [string, 'null'], description: 'As LawAlone.gap_log', examples: [armed]}
        outages:
          type: array
          description: Telemetry outages the gap log has not restored (v_data_gaps_unreplayed), newest first, at most 200
          items:
            type: object
            required: [start, end, duration_s, reason, status]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
              duration_s: {type: integer}
              reason: {type: string, description: 'Why the ingestor lost telemetry, as stored', examples: [ingestor_restart, ingestor_process_restart]}
              status: {type: string, description: 'What the ingestor saved when it came back, as stored', examples: [snapshot_taken, snapshot_incomplete]}
        replayed:
          type: array
          description: The quarters of one-minute records the controller replayed from its gap log, newest first, at most 200
          items:
            type: object
            required: [boot, qseq, first_at, last_at, received_at, climate_rows, transition_rows]
            properties:
              boot: {type: integer, description: The controller boot the quarter belongs to}
              qseq: {type: integer, description: The quarter's number within that boot}
              first_at: {type: string, format: date-time}
              last_at: {type: string, format: date-time}
              received_at: {type: string, format: date-time}
              climate_rows: {type: integer}
              transition_rows: {type: integer}
        by_day:
          type: array
          description: Per local day, oldest first
          items:
            type: object
            required: [date, outage_s, replayed_min]
            properties:
              date: {type: string, format: date}
              outage_s: {type: integer, description: Seconds of outages not restored}
              replayed_min: {type: integer, description: Minutes the gap log restored}
        tables:
          type: array
          items:
            type: object
            required: [table, last_row_age_s, rows_5m]
            properties:
              table: {type: string, examples: [climate, diagnostics, equipment_state]}
              last_row_age_s: {type: [number, 'null']}
              rows_5m: {type: [integer, 'null'], description: Rows written in the last 5 minutes}
        probes:
          type: array
          items:
            type: object
            required: [sensor, age_s, last_seen_at]
            properties:
              sensor: {type: string, examples: [climate.temp_north]}
              age_s: {type: [number, 'null'], description: Seconds since its newest reading; 7200 means not seen in 2 h}
              last_seen_at:
                type: [string, 'null']
                format: date-time
                description: >-
                  For a probe not seen in 2 h, the time of its newest reading in the last 30 days; null when it has none
                  in 30 days, and null for a probe seen in the last 2 h, whose age already says it
        ingestor:
          type: object
          required: [heartbeat_age_s, reconnects, payloads_rejected, replay_failures, rows_rejected, observed_at]
          properties:
            heartbeat_age_s: {type: [number, 'null']}
            reconnects: {type: [integer, 'null']}
            payloads_rejected: {type: [integer, 'null']}
            replay_failures: {type: [integer, 'null']}
            rows_rejected: {type: [object, 'null'], additionalProperties: {type: integer}, description: Rows that failed validation, by table}
            observed_at: {type: [string, 'null'], format: date-time, description: The ingestor_counters row}
    Delivery:
      type: object
      description: 'API-37: whether the controller took what the host pushed (setpoint_changes in the window)'
      required: [from, to, by_status, oldest_unconfirmed_s, latency, failing, dispatcher_stage, readback_pass]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        by_status:
          type: array
          items:
            type: object
            required: [source, status, count]
            properties:
              source: {type: string, description: Who pushed the change, as stored, examples: [band, manual, plan, esp32, none]}
              status: {type: string, description: Where its delivery stands, as stored, examples: [confirmed, failed, observed, pending, cancelled, superseded]}
              count: {type: integer}
        oldest_unconfirmed_s: {type: [number, 'null'], description: Age of the oldest push still waiting; 0 when nothing waits}
        latency:
          type: object
          description: From push to readback confirmation
          required: [p50_s, p95_s, confirmed]
          properties:
            p50_s: {type: [number, 'null']}
            p95_s: {type: [number, 'null']}
            confirmed: {type: integer}
        failing:
          type: array
          description: Settings with a failed push in the window, worst first, at most 50
          items:
            type: object
            required: [param, label, failed, last_failed_at, last_confirmed_at]
            properties:
              param: {type: string}
              label: {type: string}
              failed: {type: integer}
              last_failed_at: {type: string, format: date-time}
              last_confirmed_at: {type: [string, 'null'], format: date-time}
        dispatcher_stage: {type: [string, 'null'], description: 'The dispatcher''s stage, as it reports it', examples: [ordinary, paced 12/40]}
        readback_pass:
          type: object
          description: The newest readback pass (system_state setpoint_snapshot_pass)
          required: [at, stored, of]
          properties:
            at: {type: [string, 'null'], format: date-time}
            stored: {type: [integer, 'null']}
            of: {type: [integer, 'null']}

    # ------------------------------------------------------------ crops (#1327)
    Place:
      type: object
      description: 'One occupancy range: the zone, the shelf and the cell (each null above the level given), and when.'
      required: [zone, since]
      properties:
        zone: {type: string}
        shelf: {type: [string, 'null']}
        cell: {type: [string, 'null']}
        since: {type: string, format: date-time}
        until: {type: [string, 'null'], format: date-time}
        count: {type: [integer, 'null']}
    Planting:
      type: object
      description: A planting as the Crops page and the agents show it. cells are its open cells; places its open occupancy at every level; count null is unknown.
      required: [id, crop, planted_date, active]
      properties:
        id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        crop_catalog_slug: {type: [string, 'null']}
        count: {type: [integer, 'null']}
        stage: {type: [string, 'null']}
        planted_date: {type: string, format: date}
        active: {type: boolean}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        recorded_by: {anyOf: [{$ref: '#/components/schemas/Actor'}, {type: 'null'}]}
        zones: {type: array, items: {type: string}}
        shelves: {type: array, items: {type: string}}
        cells: {type: array, items: {type: string}}
        where: {type: [string, 'null']}
        places: {type: array, items: {$ref: '#/components/schemas/Place'}}
    PlantingEvent:
      type: object
      required: [id, event_type]
      properties:
        id: {type: integer}
        ts: {type: [string, 'null'], format: date-time}
        event_type: {type: string}
        count: {type: [integer, 'null']}
        notes: {type: [string, 'null']}
        source: {type: [string, 'null']}
        operator: {type: [string, 'null']}
        detail: {type: [object, 'null']}
    HarvestRecord:
      type: object
      required: [id]
      properties:
        id: {type: integer}
        ts: {type: [string, 'null'], format: date-time}
        unit_count: {type: [integer, 'null']}
        weight_kg: {type: [number, 'null']}
        notes: {type: [string, 'null']}
        operator: {type: [string, 'null']}
    PlantingDetail:
      type: object
      description: 'A planting with every place it has been, its events (newest first) and its harvests.'
      required: [id, crop, planted_date, active]
      properties:
        id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        crop_catalog_slug: {type: [string, 'null']}
        count: {type: [integer, 'null']}
        stage: {type: [string, 'null']}
        planted_date: {type: string, format: date}
        active: {type: boolean}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        recorded_by: {anyOf: [{$ref: '#/components/schemas/Actor'}, {type: 'null'}]}
        zones: {type: array, items: {type: string}}
        shelves: {type: array, items: {type: string}}
        cells: {type: array, items: {type: string}}
        where: {type: [string, 'null']}
        places: {type: array, items: {$ref: '#/components/schemas/Place'}}
        history: {type: array, items: {$ref: '#/components/schemas/Place'}}
        events: {type: array, items: {$ref: '#/components/schemas/PlantingEvent'}}
        harvests: {type: array, items: {$ref: '#/components/schemas/HarvestRecord'}}
    PlantingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Planting'}}
    Occupant:
      type: object
      required: [planting_id, crop, since]
      properties:
        planting_id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        since: {type: string, format: date-time}
        count: {type: [integer, 'null']}
    WaterLine:
      type: object
      required: [line_id, name]
      properties:
        line_id: {type: string}
        name: {type: string}
        note: {type: [string, 'null']}
    CellView:
      type: object
      required: [label]
      properties:
        label: {type: string}
        number: {type: [integer, 'null']}
        mount_type: {type: [string, 'null']}
        layout_group: {type: [string, 'null']}
        layout_row: {type: [integer, 'null']}
        layout_col: {type: [integer, 'null']}
        occupant: {anyOf: [{$ref: '#/components/schemas/Occupant'}, {type: 'null'}]}
    ShelfView:
      type: object
      required: [slug, name, kind]
      properties:
        slug: {type: string}
        name: {type: string}
        kind: {type: string}
        tier: {type: [integer, 'null']}
        wall: {type: [string, 'null']}
        display_order: {type: [integer, 'null']}
        label_short: {type: [string, 'null']}
        water_lines: {type: array, items: {$ref: '#/components/schemas/WaterLine'}}
        plantings: {type: array, items: {$ref: '#/components/schemas/Occupant'}}
        cells: {type: array, items: {$ref: '#/components/schemas/CellView'}}
    ZoneView:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        plantings: {type: array, items: {$ref: '#/components/schemas/Occupant'}}
        shelves: {type: array, items: {$ref: '#/components/schemas/ShelfView'}}
    Locations:
      type: object
      description: 'The location tree with what each place holds now: zone- and shelf-level plantings and each cell''s occupant.'
      required: [zones, cell_count, occupied_cells, active_plantings, server_time]
      properties:
        zones: {type: array, items: {$ref: '#/components/schemas/ZoneView'}}
        cell_count: {type: integer}
        occupied_cells: {type: integer}
        active_plantings: {type: integer}
        server_time: {type: string, format: date-time}
    Tenure:
      type: object
      description: 'One planting''s time in a cell; until null while it is there.'
      required: [planting_id, crop, since]
      properties:
        planting_id: {type: integer}
        crop: {type: string}
        variety: {type: [string, 'null']}
        since: {type: string, format: date-time}
        until: {type: [string, 'null'], format: date-time}
        count: {type: [integer, 'null']}
    PositionHistory:
      type: object
      description: 'Who has held one cell: the current occupant first, then the rest newest first.'
      required: [label, zone, shelf, items]
      properties:
        label: {type: string}
        zone: {type: string}
        shelf: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/Tenure'}}
    CatalogEntry:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        category: {type: [string, 'null']}
    Catalog:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CatalogEntry'}}
    ResolvedPlace:
      type: object
      required: [zone]
      properties:
        zone: {type: string}
        shelf: {type: [string, 'null']}
        cell: {type: [string, 'null']}
    Conflict:
      type: object
      required: [cell, planting_id, crop, since]
      properties:
        cell: {type: string}
        planting_id: {type: integer}
        crop: {type: string}
        since: {type: string, format: date-time}
        until: {type: [string, 'null'], format: date-time}
    Resolution:
      type: object
      description: What a place text means and what holds those cells at at. Nothing is written.
      required: [places, cells, where, at]
      properties:
        places: {type: array, items: {$ref: '#/components/schemas/ResolvedPlace'}}
        cells: {type: array, items: {type: string}}
        where: {type: string}
        at: {type: string, format: date-time}
        conflicts: {type: array, items: {$ref: '#/components/schemas/Conflict'}}
    PlantingCreate:
      type: object
      description: 'A new planting (API-CROP-07, MCP record_planting). crop is a catalog slug or name (lettuce, basil) or a free name; count is the number of plants, unknown when omitted; count_per_cell is stored on each cell''s occupancy. planted_at defaults to now; a date means local midnight. replace ends or trims whatever holds a requested cell instead of refusing with position_occupied.'
      additionalProperties: false
      required: [crop, positions]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        crop: {type: string, maxLength: 200, minLength: 1}
        variety: {type: [string, 'null'], maxLength: 200}
        positions: {type: array, items: {type: string}, maxItems: 40, minItems: 1}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        count_per_cell: {type: [integer, 'null'], maximum: 1000, minimum: 0}
        planted_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        stage: {type: [string, 'null'], enum: [seed, germination, seedling, vegetative, flowering, fruiting, harvest, cleared, null]}
        notes: {type: [string, 'null'], maxLength: 2000}
        replace: {type: boolean, default: false}
    PlantingMove:
      type: object
      description: 'Move a planting (API-CROP-08, MCP move_planting): from_positions (default: everywhere it is now) close at moved_at and to_positions open then. Both ranges stay in history.'
      additionalProperties: false
      required: [to_positions]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        to_positions: {type: array, items: {type: string}, maxItems: 40, minItems: 1}
        from_positions: {anyOf: [{type: array, items: {type: string}, maxItems: 40, minItems: 1}, {type: 'null'}]}
        moved_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        replace: {type: boolean, default: false}
    PlantingHarvest:
      type: object
      description: 'Record a harvest (API-CROP-09, MCP harvest_planting). Partial by default: the planting stays. Cells in positions are cleared; final ends the planting as harvested.'
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        weight_kg: {type: [number, 'null'], maximum: 10000, minimum: 0}
        positions: {anyOf: [{type: array, items: {type: string}, maxItems: 40, minItems: 1}, {type: 'null'}]}
        final: {type: boolean, default: false}
        harvested_at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        notes: {type: [string, 'null'], maxLength: 2000}
    PlantingEnd:
      type: object
      description: 'End a planting without a harvest (API-CROP-10, MCP remove_planting): every open place closes at at.'
      additionalProperties: false
      required: [end_reason]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        end_reason: {type: string, enum: [failed, removed, reconciled]}
        at: {anyOf: [{type: string, format: date-time}, {type: string, format: date}, {type: 'null'}]}
        note: {type: [string, 'null'], maxLength: 2000}
    PlantingPatch:
      type: object
      description: 'Edit a planting''s record (API-CROP-11): only the fields sent change. count null means unknown.'
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        variety: {type: [string, 'null'], maxLength: 200}
        count: {type: [integer, 'null'], maximum: 100000, minimum: 0}
        stage: {type: [string, 'null'], enum: [seed, germination, seedling, vegetative, flowering, fruiting, harvest, cleared, null]}
        notes: {type: [string, 'null'], maxLength: 2000}
        expected_harvest: {type: [string, 'null'], format: date}
    PlantingNote:
      type: object
      description: 'A note on a planting''s history (API-CROP-12, MCP annotate_planting); ended plantings take notes too.'
      additionalProperties: false
      required: [note]
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
        note: {type: string, minLength: 1, maxLength: 2000}
